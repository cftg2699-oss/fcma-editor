<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCMA Assessment Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--hover:#334155;--teal:#0d9488;--tealL:#14b8a6;--tealD:rgba(13,148,136,0.15);--text:#e2e8f0;--dim:#94a3b8;--mute:#64748b;--brd:#334155;--brdL:#475569;--red:#ef4444;--amb:#f59e0b;--grn:#22c55e;--wh:#fff;--r:8px;--rs:4px;--f:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--f);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--brdL);border-radius:3px}
::selection{background:var(--tealD);color:var(--tealL)}
input,textarea,select{font-family:var(--f)}
button{font-family:var(--f);cursor:pointer}

.app{display:flex;flex-direction:column;height:100vh}
.hdr{background:var(--card);border-bottom:1px solid var(--brd);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr .logo{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--tealL));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--wh)}
.hdr .title{font-size:14px;font-weight:700;letter-spacing:-0.3px}
.hdr .sub{font-size:10px;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
.pills{display:flex;gap:4px}
.pill{border:1px solid var(--brd);border-radius:20px;padding:5px 14px;font-size:13px;background:transparent;color:var(--dim);transition:all .15s}
.pill.on{background:var(--teal);border-color:var(--teal);color:var(--wh);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;font-family:var(--fm)}
.badge-t{background:rgba(13,148,136,0.15);color:var(--teal)}
.badge-b{background:rgba(59,130,246,0.15);color:#3b82f6}
.badge-a{background:rgba(245,158,11,0.15);color:var(--amb)}
.btn{border:1px solid var(--brd);border-radius:var(--rs);padding:5px 12px;font-size:12px;font-weight:500;background:var(--card);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--brdL)}
.btn-t{background:var(--teal);border-color:var(--teal);color:var(--wh)}
.btn-r{background:transparent;border-color:var(--red);color:var(--red)}
.btn-r:hover{background:rgba(239,68,68,0.1)}
.btn-g{background:transparent;border-color:transparent;color:var(--dim)}
.btn-sm{padding:3px 8px;font-size:11px}
.inp{background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs);color:var(--text);padding:7px 10px;font-size:13px;width:100%;outline:none;transition:border .15s}
.inp:focus{border-color:var(--teal)}
textarea.inp{resize:vertical;line-height:1.5}
.main{flex:1;display:flex;overflow:hidden}

/* Panels */
.panel{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.panel-l{width:210px;border-right:1px solid var(--brd)}
.panel-m{width:230px;border-right:1px solid var(--brd)}
.panel-r{flex:1;padding:16px;overflow-y:auto}
.panel-hd{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600}
.pitem{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--rs);cursor:pointer;border:1px solid transparent;transition:all .1s}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--tealD);border-color:var(--teal)}
.pitem .pid{font-size:11px;font-family:var(--fm);color:var(--teal);font-weight:700;min-width:24px}
.pitem .pn{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Component card */
.ccard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;border-left:4px solid var(--brd)}
.ccard.core{border-left-color:var(--teal);border-color:var(--teal)}
.ccard-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none}
.ccard-hd:hover{background:var(--hover)}
.ccard .cid{font-size:11px;color:var(--mute);font-family:var(--fm);min-width:38px}
.ccard .cn{flex:1;font-size:13px;font-weight:500}
.ccard-body{padding:0 12px 12px;border-top:1px solid var(--brd)}
.ccard .arrow{font-size:14px;color:var(--mute);transition:transform .2s}
.ccard .arrow.open{transform:rotate(180deg)}

/* Levels */
.lvl{display:flex;gap:8px;align-items:flex-start;padding:7px;border-radius:var(--rs)}
.lvl:nth-child(odd){background:rgba(13,148,136,0.06)}
.lvl-n{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--wh);flex-shrink:0}
.lvl-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}

/* Preview */
.preview{flex:1;overflow-y:auto;padding:32px;max-width:900px;margin:0 auto}
.preview h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.5px}
.preview h2{font-size:18px;font-weight:700;color:var(--tealL);margin:24px 0 4px}
.preview h3{font-size:14px;font-weight:600;margin:16px 0 6px 16px}
.preview .comp{margin:0 0 10px 24px;border-left:3px solid var(--brd);padding-left:12px}
.preview .comp.core{border-left-color:var(--teal)}
.preview .comp-hd{font-size:13px;font-weight:600;margin-bottom:4px}
.preview table{width:100%;border-collapse:collapse;font-size:12px}
.preview td{padding:3px 8px;border-bottom:1px solid var(--brd)}
.preview .ln{width:30px;font-weight:700;text-align:center}

/* Stats */
.stats{flex:1;overflow-y:auto;padding:32px;max-width:800px;margin:0 auto}
.stats h2{font-size:22px;font-weight:700;margin-bottom:20px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.scard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;text-align:center}
.scard .sv{font-size:30px;font-weight:800;font-family:var(--fm)}
.scard .sl{font-size:11px;color:var(--mute);margin-top:4px}
.stable{width:100%;border-collapse:collapse}
.stable th{padding:8px;text-align:left;border-bottom:2px solid var(--teal);font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.stable td{padding:8px;border-bottom:1px solid var(--brd);font-size:13px}
.pbar{width:100%;height:8px;background:var(--brd);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .3s}
.empty-state{margin-top:20px;padding:20px;border:1px dashed var(--brd);border-radius:var(--r);text-align:center}

/* IP Protection - Client mode */
.ip-protect{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.ip-protect *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.ip-protect input,.ip-protect textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
.watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:0.03;font-size:28px;font-weight:800;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:120px;transform:rotate(-25deg);letter-spacing:6px;font-family:var(--fm);overflow:hidden}
.footer-legal{position:fixed;bottom:0;left:0;width:100%;background:rgba(15,23,42,0.95);border-top:1px solid var(--brd);padding:4px 20px;font-size:10px;color:var(--mute);text-align:center;z-index:9998;letter-spacing:0.3px}
.lang-sel{display:flex;gap:2px;background:var(--bg);border-radius:14px;padding:2px;border:1px solid var(--brd)}
.lang-btn{border:none;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;background:transparent;color:var(--mute);cursor:pointer;transition:all .15s;font-family:var(--f)}
.lang-btn.on{background:var(--teal);color:var(--wh)}
@media print{body{display:none!important}}

/* Quiz UX animations */
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-40px)}}
@keyframes pulseCheck{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes progressFill{from{width:0}to{width:var(--fill)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.quiz-slide{animation:fadeSlideIn .35s ease-out}
.quiz-slide-out{animation:fadeSlideOut .2s ease-in forwards}
.lvl-card{transition:all .2s ease;cursor:pointer;position:relative;overflow:hidden}
.lvl-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s}
.lvl-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.lvl-card.selected{transform:scale(1.02)}
.lvl-card.selected .check-anim{animation:pulseCheck .4s ease}
.lvl-expand{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0}
.lvl-expand.open{max-height:400px;opacity:1}
.auto-timer{height:3px;background:var(--tealL);border-radius:2px;transition:width .05s linear}
.pilar-stripe{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.progress-ring{transition:stroke-dashoffset .5s ease}
.stat-card-anim{animation:fadeIn .4s ease backwards}

/* Responsive */
@media(max-width:768px){
  .panel-l{width:160px}.panel-m{width:180px}
  .hdr{flex-wrap:wrap;gap:8px}
  .sgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
// ═══════════════════════════════════════════════════════════
// FCMA ASSESSMENT EDITOR — Vanilla JS (no React needed)
// Deployable on GitHub Pages as single index.html
// ═══════════════════════════════════════════════════════════

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  kids.flat(9).forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
};

// ── STATE ──
let DATA = [];
const INIT_DATA = [{"id":"P0","name":"Estrategia de Fraude","desc":"Capa estratégica que evalúa si el banco tiene una visión articulada de cómo competir contra el fraude, dónde aceptar pérdidas y cómo equilibrar seguridad con experiencia de cliente.","subs":[{"id":"0.1","name":"Visión y Estrategia de Fraude","comps":[{"id":"0.1.1","name":"Existencia de estrategia documentada","L":["No existe ningún documento que articule la estrategia de fraude del banco. Las decisiones se toman caso a caso sin marco estratégico.","Existe un documento informal o presentación interna que menciona objetivos de fraude, pero no está aprobado por la alta dirección ni tiene vigencia definida.","Existe un documento formal de estrategia de fraude aprobado por un comité ejecutivo, con objetivos medibles y un horizonte temporal definido (1–3 años).","La estrategia está aprobada por el Board, se revisa al menos anualmente, incluye metas cuantitativas (bps, USD), y tiene métricas de seguimiento que se reportan trimestralmente.","La estrategia se actualiza ante cada cambio regulatorio, lanzamiento de producto o evento significativo. Incluye escenarios prospectivos (threat modeling a 3–5 años) y está integrada con la estrategia de negocio del banco."]},{"id":"0.1.2","name":"Articulación de objetivos estratégicos","L":["No hay objetivos de fraude articulados. El área reacciona a lo que ocurre sin dirección definida.","Los objetivos existen implícitamente ('reducir fraude') pero no están documentados, no son medibles, y no distinguen entre reducir pérdidas, optimizar UX o cumplir regulación.","Los objetivos están documentados y son medibles (ej: 'reducir fraud loss rate a X bps en tarjetas para diciembre'). Cubren al menos dos dimensiones: pérdidas y regulación.","Los objetivos cubren las tres dimensiones (pérdidas, experiencia de cliente, regulación), tienen owners asignados, y se miden trimestralmente con datos reales.","Los objetivos se descomponen por producto, canal y segmento. Se usa un balanced scorecard que incluye trade-offs explícitos entre seguridad, experiencia y costo. Se ajustan dinámicamente basándose en threat intelligence."]},{"id":"0.1.3","name":"Horizonte temporal de la estrategia","L":["No existe un plan de fraude con horizonte temporal. Se opera día a día.","Existe un plan de acción anual de fraude, pero es una lista de proyectos sin secuencia ni dependencias, y no se conecta con la estrategia del banco.","Existe un plan a 1–2 años con fases, hitos y presupuesto estimado. Se presenta formalmente a management.","Existe un plan a 3 años con fases, hitos, presupuesto aprobado, KPIs por fase, y revisiones semestrales documentadas con ajustes.","Existe un plan a 3–5 años con escenarios (base, optimista, adverso), vinculado al plan estratégico del banco. Incluye horizon scanning de amenazas emergentes y se actualiza ante cada nuevo vector de ataque identificado."]}]},{"id":"0.2","name":"Decisiones Estratégicas de Riesgo","comps":[{"id":"0.2.1","name":"Risk acceptance explícito","L":["No existe ninguna definición de qué fraude el banco acepta. Toda pérdida se trata como falla del programa.","Informalmente se reconoce que algún fraude es inevitable, pero no hay documentación de umbrales de aceptación por producto o canal.","Existe un documento de risk acceptance aprobado por un comité, con umbrales de pérdida aceptable por producto (ej: 'hasta X bps en tarjetas de crédito').","El risk acceptance está definido por producto, canal y segmento, aprobado por el Board, revisado anualmente, y se reporta la desviación vs. umbrales cada trimestre.","El risk acceptance se calibra dinámicamente usando datos de pérdida real, benchmark de industria, y análisis de costo-beneficio. Se ejecutan simulaciones de escenarios para validar los umbrales."]},{"id":"0.2.2","name":"Trade-off seguridad vs. fricción documentado","L":["No se analiza el trade-off. Los controles se implementan sin considerar impacto en la experiencia del cliente.","Se reconoce informalmente que los controles generan fricción, pero no se mide ni se documenta el impacto.","Existe un análisis documentado del trade-off para al menos los 3 controles principales (ej: tasa de declinaciones legítimas, tasa de abandono en step-up).","Se mide el trade-off por producto/canal con datos reales: false positives, transacciones legítimas bloqueadas, NPS post-fraude, y abandono por control. Se reporta trimestralmente.","Se usa un modelo cuantitativo que optimiza el trade-off en tiempo real: el scoring ajusta umbrales automáticamente para mantener la fricción dentro de límites aprobados sin exceder el apetito de riesgo."]},{"id":"0.2.3","name":"Criterios de priorización de inversión","L":["No existen criterios para priorizar inversión en fraude. Se invierte reactivamente ante incidentes.","La inversión se decide por urgencia o presión regulatoria, sin análisis de ROI ni comparación entre alternativas.","Existe un proceso anual de presupuesto de fraude con criterios de priorización documentados (regulatorio primero, luego por volumen de pérdida).","Se usa un modelo de priorización basado en ROI: para cada iniciativa se estima pérdida evitada, costo de implementación y costo de fricción.","Se usa un motor de priorización multi-criterio (impacto económico × esfuerzo × dependencia tecnológica × tiempo a valor) con datos reales. Se revisa trimestralmente."]}]},{"id":"0.3","name":"Alineación con Estrategia de Negocio","comps":[{"id":"0.3.1","name":"Vinculación fraude-estrategia comercial","L":["El área de fraude opera completamente separada de la estrategia comercial. No se le consulta para decisiones de negocio.","El área de fraude se entera de nuevos productos o canales después de su lanzamiento. La integración es reactiva.","El área de fraude participa en comités de producto y recibe información sobre lanzamientos con al menos 30 días de anticipación.","Cada lanzamiento requiere un fraud risk assessment aprobado antes de go-live. Fraude tiene un asiento formal en el comité de producto.","El área de fraude participa desde la fase de diseño (fraud by design). Los KPIs de producto incluyen métricas de fraude. Se mide el costo de fraude por producto nuevo a 90 días."]},{"id":"0.3.2","name":"Participación en decisiones de lanzamiento","L":["Fraude no participa en decisiones de lanzamiento de productos ni canales digitales.","Fraude es consultado ocasionalmente para lanzamientos de alto perfil, pero su input no es vinculante ni se documenta.","Fraude emite un dictamen de riesgo para cada lanzamiento de producto digital. El dictamen es documentado pero no bloquea el lanzamiento.","El dictamen de fraude es obligatorio y tiene poder de veto o de exigir controles compensatorios antes del lanzamiento.","Fraude co-diseña los controles de cada nuevo producto desde la fase de ideación. Existe un playbook de 'fraud by design' con checklists por tipo de producto/canal."]},{"id":"0.3.3","name":"Consideración de fraude en crecimiento digital","L":["La estrategia digital del banco no menciona ni considera el riesgo de fraude.","El riesgo de fraude se menciona genéricamente en la estrategia digital, pero no hay acciones específicas ni presupuesto asignado.","La estrategia digital incluye un capítulo de fraude con controles por canal (app, web, PIX, open banking) y presupuesto asignado.","Cada iniciativa digital tiene un perfil de riesgo de fraude con controles diferenciados, métricas de éxito y owner responsable.","Existe un modelo predictivo de riesgo de fraude por canal digital que se actualiza con datos reales. Se usa para calibrar la inversión en controles antes de escalar cada canal."]}]}]},{"id":"P1","name":"Gobernanza, Cultura y Marco Organizacional","desc":"Evalúa la estructura de gobierno, políticas, comités y cultura organizacional que soportan el programa de fraude. Anclado en COSO/ACFE Principio 1.","subs":[{"id":"1.1","name":"Política de Fraude y Apetito de Riesgo","comps":[{"id":"1.1.1","name":"Existencia y alcance de la política","L":["No existe una política de fraude escrita. Las decisiones se basan en criterio individual de cada área.","Existe un documento de política pero cubre solo operaciones (tarjetas/transacciones). No abarca fraude interno, digital, ni originación.","La política es enterprise-wide: cubre fraude externo, interno, digital, originación y terceros. Está aprobada por un comité ejecutivo y tiene fecha de vigencia.","La política incluye definiciones, alcance, roles, apetito de riesgo cuantificado, tolerancias por producto/canal, y un proceso de revisión anual con trigger events.","La política se actualiza dentro de los 30 días de cada cambio regulatorio, nuevo producto o incidente significativo. Existe una matriz de trazabilidad entre la política y los requisitos regulatorios aplicables."]},{"id":"1.1.2","name":"Apetito de riesgo cuantificado","L":["No existe un apetito de riesgo de fraude definido. No se ha discutido en ningún comité.","El apetito de riesgo se expresa cualitativamente ('bajo', 'moderado') sin cifras. No está aprobado por el Board.","El apetito de riesgo está cuantificado en al menos una métrica (ej: fraud loss rate <X bps) y aprobado por el Board.","El apetito está cuantificado por producto, canal y tipo de fraude. Incluye tolerancias, límites de escalamiento y se reporta la desviación mensualmente.","El apetito se calibra con datos históricos, benchmark de peers, y proyecciones de pérdida. Se somete a stress testing. Se revisa dinámicamente."]},{"id":"1.1.3","name":"Tolerancias y límites por producto/canal","L":["No existen tolerancias diferenciadas. Se aplica un criterio uniforme a todo.","Existen tolerancias informales para algunos productos, pero no están documentadas.","Existen tolerancias documentadas para al menos 3 productos/canales principales. Están aprobadas por el comité de riesgo.","Cada producto/canal tiene tolerancias específicas documentadas, con umbrales de alerta temprana y de escalamiento. Se monitorean mensualmente.","Las tolerancias se ajustan trimestralmente usando análisis de tendencia y benchmark. Se descomponen por segmento de cliente y geografía."]},{"id":"1.1.4","name":"Proceso de revisión de la política","L":["La política no tiene fecha de revisión. No se ha actualizado en los últimos 2+ años.","La política tiene una fecha de revisión teórica pero se incumple. La última actualización tiene más de 18 meses.","La política se revisa anualmente según calendario. Existe un proceso documentado con checklist de actualización.","Además de la revisión anual, tiene trigger events definidos (nueva regulación, incidente >$X, nuevo canal) que disparan revisión extraordinaria.","La revisión incluye benchmark regulatorio multi-jurisdicción, gap analysis vs. estándares (COSO/ACFE, OCC), y aprobación por el Board con acta documentada."]},{"id":"1.1.5","name":"Alineación con ERM y riesgo operacional","L":["La política de fraude no hace referencia al Enterprise Risk Management ni a riesgo operacional.","La política menciona que fraude es un sub-tipo de riesgo operacional, pero no hay integración práctica.","La política se mapea al framework de riesgo operacional. Los eventos de fraude se registran en la base de pérdidas operacionales.","Existe taxonomía compartida entre fraude y riesgo operacional. Los KRIs de fraude alimentan el dashboard de riesgo operacional.","El programa de fraude está plenamente integrado al ERM: el apetito de riesgo de fraude es sub-componente del apetito total, con correlaciones modeladas."]}]},{"id":"1.2","name":"Estructura Organizacional y Accountability","comps":[{"id":"1.2.1","name":"Ubicación en el organigrama","L":["El área de fraude no tiene una ubicación formal en el organigrama. Las funciones están dispersas sin coordinación.","Existe un equipo identificable pero embebido en operaciones o IT, sin reporte directo a un líder de riesgo.","El área tiene posición definida con reporte al CRO, CISO o COO. El líder tiene título formal.","Reporta al CRO o equivalente con acceso directo al Board. El Head de Fraude participa en comités ejecutivos con presupuesto propio.","Independencia funcional con líneas de reporte claras a 1LoD, 2LoD y Board. Rango VP/SVP con poder de escalamiento directo al CEO/Board."]},{"id":"1.2.2","name":"Roles y responsabilidades 3LoD","L":["No existe un mapeo de roles de fraude a las tres líneas de defensa.","Se reconoce informalmente que operaciones es 1LoD y auditoría es 3LoD, pero sin documentación.","Existe un documento RACI que mapea roles de fraude a 1LoD, 2LoD y 3LoD.","El RACI está aprobado por el comité de fraude, se revisa anualmente, y cada rol tiene KPIs asociados.","El modelo de 3LoD se testea operativamente: 2LoD ejecuta challenge independiente, 3LoD evalúa efectividad del challenge, resultados se reportan al Board."]},{"id":"1.2.3","name":"Comité de Fraude","L":["No existe un comité de fraude formal. Decisiones se toman ad-hoc.","Existe un espacio recurrente pero sin charter, actas formales, ni quórum definido.","Comité con charter aprobado, frecuencia mínima mensual, actas formales, y asistencia de fraude, riesgo, operaciones y tecnología.","El comité tiene quórum definido, derechos de decisión documentados, tracking de action items con owners y fechas, y escalamiento al Board.","El comité tiene decision rights sobre apetito de riesgo por producto, aprobación de modelos de scoring, y excepciones. Las actas se auditan y los action items tienen aging reports."]},{"id":"1.2.4","name":"Composición del Comité","L":["No aplica — no existe comité de fraude.","El comité está compuesto solo por fraude y operaciones.","Incluye fraude, compliance/AML, tecnología/IT y al menos una línea de negocio.","Incluye fraude, compliance/AML, cyber/IT, legal, operaciones, líneas de negocio, y un observador de auditoría. Data/Analytics tiene representación.","Además, tiene un sponsor C-suite, invita áreas de negocio según la agenda, y mantiene un roster con suplentes designados."]},{"id":"1.2.5","name":"Mecanismo de escalamiento al Board","L":["No existe un proceso de escalamiento. El Board no recibe información de fraude de forma regular.","El Board recibe información solo cuando ocurre un incidente significativo, reactivamente.","Existe proceso documentado con umbrales de pérdida que disparan notificación al Board.","Además de umbrales, el Board recibe reporte trimestral con tendencias, benchmark, KPIs y estado de remediación.","El Board tiene un comité de riesgo con fraude como agenda fija. El Head de Fraude presenta directamente. El Board puede ajustar el apetito de riesgo en la misma sesión."]},{"id":"1.2.6","name":"SLAs cross-organizacionales","L":["No existen SLAs entre fraude y otras áreas (IT, operaciones, negocio).","Existen acuerdos informales pero no hay SLAs documentados ni medibles.","SLAs documentados para al menos 2 relaciones clave (fraude-IT, fraude-ops).","SLAs cubren todas las relaciones clave, aprobados por los heads, se miden mensualmente con dashboard.","SLAs con penalizaciones/escalamiento por incumplimiento, revisión semestral, y medición presentada en el comité de fraude."]},{"id":"1.2.7","name":"Protocolos de escalamiento (interno vs. externo)","L":["No existe diferenciación en protocolos entre fraude interno y externo.","Se reconoce que fraude interno requiere tratamiento diferente, pero se usan los mismos procesos.","Protocolos diferenciados documentados: fraude externo por monitoreo; fraude interno se escala a compliance, auditoría y/o legal.","Protocolos de fraude interno incluyen preservación de evidencia, restricción de acceso, notificación a RRHH, y cadena de custodia formal. Se testean anualmente.","Fraude interno tiene equipo especializado con acceso a logs, CCTV, y correos (con aprobación legal). Playbook con tiempos de respuesta por severidad."]},{"id":"1.2.8","name":"Oficial de Fraude designado","L":["No existe un oficial o responsable designado formalmente ante el regulador.","Hay un responsable de facto, pero su designación no es formal ni reconocida por el regulador.","Existe un Oficial de Fraude formalmente designado, con acta de nombramiento y conocido por el regulador.","El Oficial tiene autoridad documentada, presupuesto propio, y acceso directo al Board.","El Oficial tiene certificaciones (CFE, CAMS), protección de tenure, y su desempeño se evalúa con KPIs específicos."]}]},{"id":"1.3","name":"Supervisión de Alta Dirección y Board","comps":[{"id":"1.3.1","name":"Frecuencia y profundidad del reporte al Board","L":["El Board no recibe reportes de fraude. El tema solo surge si hay un incidente público.","El Board recibe información anualmente, incluida en un reporte general de riesgo operacional sin desglose.","El Board recibe reporte dedicado al menos trimestralmente con métricas de pérdida, tendencias y estado de iniciativas.","El reporte incluye benchmark vs. peers, análisis de root cause, estado de remediación, y proyecciones de pérdida.","Reporting mensual de KPIs clave y trimestral con deep dive. Dashboard interactivo, exception-based reporting, y preguntas preparadas para el challenge del Board."]},{"id":"1.3.2","name":"Entendimiento del Board sobre riesgo de fraude","L":["El Board no tiene conocimiento sobre el riesgo de fraude más allá de lo que sale en medios.","Ha recibido al menos una presentación educativa, pero no tiene formación recurrente.","Recibe educación anual sobre tendencias, nuevos vectores y estado del programa. Se documenta asistencia.","Al menos un miembro tiene experiencia en fraude/riesgo. El Board hace preguntas de challenge documentadas en acta.","Programa de educación continua (2+ sesiones/año), ha visitado el centro de monitoreo, y sus preguntas han generado cambios documentables."]},{"id":"1.3.3","name":"Participación en decisiones de apetito de riesgo","L":["El Board no participa en decisiones de apetito de riesgo de fraude.","El Board aprueba el apetito de forma ceremonial sin discusión sustancial.","El Board discute y aprueba anualmente. La discusión está documentada en acta.","El Board modifica activamente las propuestas: hay evidencia de cambios solicitados vs. propuesta original de management.","El Board conecta el apetito de fraude con el apetito total del banco. Evalúa escenarios adversos y aprueba tolerancias diferenciadas."]},{"id":"1.3.4","name":"Ejecutivo responsable C-suite","L":["No hay un ejecutivo C-suite con responsabilidad explícita sobre el programa de fraude.","El CRO o COO tiene la responsabilidad nominalmente, pero sin KPIs de fraude en su evaluación.","Hay un ejecutivo C-suite con responsabilidad explícita documentada. Fraude aparece en su job description.","El ejecutivo tiene KPIs de fraude en su evaluación, preside o co-preside el comité, y reporta al Board.","Existe un Chief Fraud Officer o equivalente con asiento en el comité ejecutivo, presupuesto propio, y autoridad para detener lanzamientos."]}]},{"id":"1.4","name":"Cultura Ética y Programas de Concientización","comps":[{"id":"1.4.1","name":"Código de ética y fraude","L":["No existe un código de ética que mencione fraude, o el código existente no aborda fraude interno ni externo.","El código menciona fraude genéricamente ('no tolerar conductas fraudulentas') sin definiciones, ejemplos ni consecuencias.","El código aborda fraude interno y externo con definiciones claras, ejemplos por rol, consecuencias disciplinarias, aprobado por la Junta.","Se complementa con casos reales anonimizados del banco. Se firma anualmente. Se testea conocimiento con evaluaciones.","Se actualiza con nuevas tipologías cada año. Existe evidencia de que se han aplicado consecuencias basándose en el código."]},{"id":"1.4.2","name":"Programa de concientización para empleados","L":["No existe un programa de concientización de fraude para empleados.","Capacitación de fraude anual, obligatoria, tipo e-learning genérico, sin contenido específico por rol.","Programa anual diferenciado por rol, con contenido actualizado basado en tipologías recientes del banco.","Programa trimestral con simulaciones de phishing/social engineering, evaluaciones de conocimiento, y métricas de cobertura.","Gamification, red team exercises, y se mide correlación entre capacitación y métricas de detección/reporte espontáneo."]},{"id":"1.4.3","name":"Capacitación especializada por rol","L":["No existe capacitación de fraude diferenciada por rol.","Los investigadores reciben capacitación básica, pero analistas, tecnología y negocio no tienen formación específica.","Plan diferenciado: analistas (tipologías), investigadores (cadena de custodia), tecnología (reglas/modelos), negocio (red flags).","Cada rol tiene currículo con certificaciones objetivo (CFE, CAMS). Se mide avance y se asigna presupuesto.","Incluye rotaciones entre áreas, mentoring, participación en conferencias (ACFE, RSA). Se vincula al plan de carrera."]},{"id":"1.4.4","name":"Canal de denuncias (whistleblower)","L":["No existe un canal de denuncias, o el existente no cubre fraude.","Existe pero es poco conocido, no se promueve activamente, y no ofrece garantías de anonimato.","Canal accesible (teléfono, email, web), promueve anonimato, operado por tercero independiente, cubre fraude interno y externo.","Se promueve activamente (campañas semestrales), tiene SLA de respuesta (<48h), tracking de casos, y protección contra retaliación.","Se miden métricas del canal: volumen, % sustanciadas, tiempo de resolución. Se compara vs. benchmark. El Board recibe reporte semestral."]},{"id":"1.4.5","name":"Tone from the top","L":["No hay evidencia de mensajes de la alta dirección sobre fraude o ética.","El CEO ha mencionado la importancia de la ética genéricamente, pero sin referencia específica a fraude.","Al menos un mensaje anual del CEO específicamente sobre prevención de fraude, distribuido a toda la organización.","Mensajes trimestrales, participación en eventos de concientización, con datos del programa.","CEO y Board hacen referencia a fraude en earnings calls, reportes anuales, y town halls. La cultura antifraude es parte del employer branding."]},{"id":"1.4.6","name":"Medición de cultura antifraude","L":["No se mide la cultura antifraude en la organización.","Alguna pregunta sobre ética en la encuesta de clima, pero no preguntas específicas sobre fraude.","La encuesta incluye preguntas específicas sobre fraude ('¿sabes cómo reportar?', '¿confías en que no habrá retaliación?').","Además de encuesta, se miden indicadores proxy: volumen de reportes espontáneos, tiempo de reporte, participación voluntaria.","Índice compuesto de cultura antifraude que combina encuestas, indicadores proxy, resultados de simulaciones. Se compara año a año."]}]},{"id":"1.5","name":"Alineación Regulatoria","comps":[{"id":"1.5.1","name":"Mapeo de requisitos regulatorios","L":["No existe un mapeo de requisitos regulatorios aplicables al programa de fraude.","Se conocen los principales reguladores pero no hay mapeo sistemático de requisitos vs. controles.","Existe matriz de cumplimiento que mapea cada requisito a un control del programa. Se actualiza anualmente.","La matriz incluye multi-jurisdicción, estado de cumplimiento, owner, y plan de remediación. Se presenta al comité de compliance.","Se actualiza dentro de 30 días de cada cambio regulatorio. Incluye análisis de impacto, timeline, y trazabilidad a los componentes del FCMA."]},{"id":"1.5.2","name":"Monitoreo de cambios regulatorios","L":["No existe un proceso de monitoreo de cambios regulatorios en fraude.","Compliance monitorea regulación general, pero no hay feed específico para fraude.","Proceso de monitoreo con fuentes definidas y boletín al menos trimestral al equipo de fraude.","El boletín incluye análisis de impacto, timeline de cumplimiento, y owner de implementación.","Monitoreo continuo (alertas automáticas), multi-jurisdicción, cada cambio tiene impact assessment con deadline tracked."]},{"id":"1.5.3","name":"Historial de hallazgos regulatorios y remediación","L":["No se lleva registro centralizado de hallazgos regulatorios en fraude.","Los hallazgos se documentan cuando ocurren pero sin tracking centralizado ni aging report.","Tracker centralizado con descripción, fecha, severidad, owner, plan de remediación, y fecha de cierre.","Se reporta mensualmente al comité. Se mide aging, closure rate, y recurrencia. Los >90 días se escalan.","Integrado con sistema de auditoría interna. Se hace root cause analysis de recurrentes. Los patrones alimentan la actualización de la política."]}]}]},{"id":"P2","name":"Evaluación de Riesgo de Fraude e Inteligencia de Amenazas","desc":"Evalúa la capacidad del banco para identificar, evaluar y priorizar riesgos de fraude. Anclado en COSO/ACFE Principio 2.","subs":[{"id":"2.1","name":"Identificación de Riesgos de Fraude","comps":[{"id":"2.1.1","name":"Inventario de esquemas de fraude","L":["No existe un inventario de esquemas. El equipo conoce los tipos de fraude por experiencia personal.","Existe una lista informal no documentada formalmente, sin diferenciación por producto/canal, y con más de 12 meses sin actualización.","Inventario documentado que diferencia por tipo (interno/externo), producto, canal y modus operandi. Tiene fecha de actualización y owner.","Se actualiza trimestralmente con input de investigaciones, inteligencia y vendors. Cada esquema tiene: descripción, indicadores, controles y pérdida histórica.","Inventario dinámico que se alimenta automáticamente de investigaciones y threat intel. Incluye esquemas emergentes no observados pero detectados en peers."]},{"id":"2.1.2","name":"Proceso de identificación de amenazas emergentes","L":["No existe proceso de identificación de amenazas emergentes. El banco se entera cuando las sufre.","El equipo lee publicaciones de industria ocasionalmente, pero sin proceso estructurado ni responsable.","Proceso documentado con fuentes definidas (FS-ISAC, vendors, ACFE, dark web monitoring), frecuencia y responsable.","Las amenazas se evalúan con metodología de impacto potencial y se priorizan. Se presentan en el comité de fraude.","Se usa threat modeling predictivo: se analiza cómo adversarios podrían explotar nuevos productos antes de que ocurra. Red team exercises anualmente."]},{"id":"2.1.3","name":"Cobertura del inventario","L":["El inventario cubre solo fraude transaccional con tarjetas.","Cubre fraude transaccional y algún tipo adicional, pero deja fuera categorías completas.","Cubre al menos: transaccional, originación, ATO, fraude interno, y fraude en canales digitales.","Cobertura completa: transaccional (por canal), originación, ATO, interno, terceros, P2P/instant payments, y APP fraud.","Cobertura total más categorías emergentes: mule accounts, voice cloning/deepfake, AI-assisted social engineering, fraud-as-a-service, y cross-border."]},{"id":"2.1.4","name":"Frecuencia de actualización","L":["El inventario no se actualiza o no existe fecha de última actualización.","Se actualiza ad-hoc cuando ocurre un incidente, sin frecuencia definida.","Se actualiza al menos anualmente como parte de la evaluación de riesgo.","Se actualiza trimestralmente con input de investigaciones, inteligencia y cambios en productos.","Se actualiza en near-real-time: cada investigación alimenta automáticamente el inventario. SLA de 5 días para incorporar nueva tipología."]}]},{"id":"2.2","name":"Metodología de Evaluación de Riesgo Inherente","comps":[{"id":"2.2.1","name":"Metodología formal documentada","L":["No existe una metodología de evaluación de riesgo de fraude.","Metodología informal (reunión de brainstorming) no documentada ni repetible.","Metodología documentada basada en probabilidad × impacto, con escalas definidas, aplicada a cada esquema.","Incluye criterios cuantitativos (datos de pérdida, volumen) y cualitativos. Se aplica consistentemente y se documenta.","Usa datos reales de pérdida, proyecciones actuariales, y benchmark para cuantificar riesgo en USD. Se valida independientemente."]},{"id":"2.2.2","name":"Granularidad de la evaluación","L":["La evaluación es a nivel institución: un solo score de riesgo.","Diferencia entre fraude interno y externo, pero no descompone más.","Se realiza por producto y por canal.","Se realiza por producto × canal × tipo de fraude. Se identifican combinaciones de mayor riesgo.","Incluye producto × canal × tipo × segmento × geografía. Heat map multi-dimensional, ejecución trimestral."]},{"id":"2.2.3","name":"Participación de líneas de negocio","L":["Las líneas de negocio no participan en la evaluación.","Se les consulta ocasionalmente pero su input no es estructurado ni documentado.","Cada línea designa un representante que participa en la evaluación anual.","Las líneas co-evalúan los riesgos de sus productos, validan la priorización, y se comprometen con planes de remediación.","Las líneas son co-owners: participan trimestralmente, aportan datos de negocio, y sus KPIs incluyen métricas de colaboración con fraude."]},{"id":"2.2.4","name":"Criterios de calificación de probabilidad e impacto","L":["No existen criterios de calificación. La evaluación es puramente subjetiva.","Se usan escalas cualitativas genéricas ('alto/medio/bajo') sin definición de qué significa cada nivel.","Existen criterios documentados: probabilidad se mide con escala definida (ej: 1=raro, 5=casi seguro) e impacto en USD con rangos específicos por tamaño del banco.","Los criterios combinan datos cuantitativos (frecuencia histórica, volumen de pérdida) con cualitativos (experticia del equipo). Se calibran anualmente con datos reales.","Los criterios se validan estadísticamente: la probabilidad se basa en distribuciones actuariales de eventos, el impacto se modela con simulación Monte Carlo. Se someten a challenge independiente."]}]},{"id":"2.3","name":"Evaluación de Efectividad de Controles","comps":[{"id":"2.3.1","name":"Proceso de evaluación de controles","L":["No se evalúa la efectividad de controles. Se asumen efectivos una vez implementados.","Se revisan cuando falla algo, sin evaluación proactiva ni periódica.","Proceso anual de evaluación de controles clave con testing por muestra y documentación.","Cada control tiene owner, se testea semestralmente (design + operating effectiveness), y alimenta el riesgo residual.","Testing continuo con métrica de efectividad en producción (detection rate por regla, % de fraude que pasó cada control). Se usa para recalibrar o retirar."]},{"id":"2.3.2","name":"Vinculación controles-esquemas","L":["No existe mapeo entre controles y esquemas de fraude.","Se sabe informalmente qué controles cubren qué, pero sin documentación.","Matriz controles × esquemas documentada. Se identifican esquemas con gaps.","La matriz se actualiza con cada nuevo esquema. Se mide cobertura. Los gaps se priorizan.","La matriz incluye efectividad medida por esquema. Se ejecutan simulaciones de falla de controles. Se identifican single points of failure."]},{"id":"2.3.3","name":"Pruebas de efectividad de controles","L":["No se testean los controles de fraude. Se asumen efectivos porque existen.","Se testean controles solo cuando falla algo o cuando auditoría lo exige.","Se ejecutan pruebas de efectividad al menos anualmente para los controles clave: se verifica design effectiveness y se documenta.","Se testea design y operating effectiveness semestralmente. Se usan datos reales (ej: transacciones fraudulentas conocidas que pasaron el control). Se documenta el resultado por control.","Se ejecuta red teaming: se simulan ataques reales contra los controles para medir su efectividad en condiciones adversas. Se mide la tasa de bypass por control y se usa para recalibrar."]}]},{"id":"2.4","name":"Determinación de Riesgo Residual y Priorización","comps":[{"id":"2.4.1","name":"Cálculo de riesgo residual","L":["No se calcula el riesgo residual de fraude.","Noción cualitativa ('alto', 'medio', 'bajo') sin cálculo formal.","Se calcula como riesgo inherente menos efectividad de controles. Se registra por esquema.","Se cuantifica en USD (pérdida esperada post-controles) por producto/canal. Se compara vs. apetito aprobado.","Se monitorea continuamente con datos reales. Desviaciones vs. apetito disparan alertas automáticas y planes de acción."]},{"id":"2.4.2","name":"Aceptación formal de riesgos residuales","L":["Los riesgos residuales no se aceptan formalmente.","Algunos se aceptan implícitamente ('no tenemos presupuesto') sin aprobación formal.","Los que exceden tolerancia se presentan al comité para aceptación o remediación.","La aceptación requiere firma del owner de negocio + aprobación del comité de riesgo, con justificación documentada.","La aceptación tiene ciclo de vida: revisión trimestral, expiración automática, re-aprobación requerida. Se reporta inventario de riesgos aceptados."]}]},{"id":"2.5","name":"Inteligencia de Fraude (Fraud Threat Intelligence)","comps":[{"id":"2.5.1","name":"Función de inteligencia de fraude","L":["No existe función de inteligencia de fraude. Sin acceso a fuentes externas.","El equipo lee newsletters y alertas de vendors, pero sin función ni responsable asignado.","Responsable de inteligencia con fuentes definidas y producción regular de reportes.","Múltiples fuentes (FS-ISAC, consorcios, vendors, OSINT, dark web), reportes mensuales, alimenta reglas/modelos.","Ciclo completo (recolección → análisis → diseminación → acción → feedback). Alertas near-real-time. Se mide impacto en detección."]},{"id":"2.5.2","name":"Integración de inteligencia con detección","L":["La inteligencia no se conecta con reglas ni modelos de detección.","Ocasionalmente se crea una regla desde inteligencia, pero el proceso es ad-hoc.","Proceso documentado: inteligencia genera ticket que el equipo de reglas evalúa y prioriza.","El proceso tiene SLA (ej: <72h para amenaza crítica). Se mide time-to-deploy desde intel hasta producción.","Feeds de IoCs se convierten programáticamente en features para modelos ML. Se mide la contribución de intel al detection rate."]},{"id":"2.5.3","name":"Fuentes de inteligencia (internas y externas)","L":["No se usan fuentes de inteligencia de fraude, ni internas ni externas.","Se usan fuentes internas (resultados de investigaciones) pero no se consumen fuentes externas.","Se consumen al menos 3 fuentes externas (FS-ISAC, alertas de vendors, redes de pago) además de las internas. Están documentadas.","Se consolidan fuentes internas (investigaciones, alertas, quejas) con externas (consorcios, OSINT, dark web, law enforcement). Se evalúa la calidad de cada fuente anualmente.","Se usa un threat intelligence platform (TIP) que agrega, correlaciona y prioriza inteligencia de 10+ fuentes. Se mide la tasa de actionable intelligence y el time-to-action."]},{"id":"2.5.4","name":"Producción de reportes de inteligencia","L":["No se producen reportes de inteligencia de fraude.","Se comparten hallazgos informalmente por email o chat cuando alguien encuentra algo relevante.","Se produce un boletín de inteligencia al menos mensual, con destinatarios definidos (equipo de fraude, reglas, management).","Se producen reportes diferenciados: operativos (semanales, para analistas y reglas), tácticos (mensuales, para management), y estratégicos (trimestrales, para Board). Cada uno con formato y profundidad apropiados.","Los reportes incluyen indicadores de compromiso (IoCs) accionables, recomendaciones de reglas/modelos, y assessment de amenazas a 90 días. Se mide cuántas recomendaciones se implementan y su impacto en detección."]}]}]},{"id":"P3","name":"Prevención y Actividades de Control (Basado en Journey)","desc":"Evalúa los controles preventivos a lo largo del customer journey, incluyendo APP fraud/scams. Anclado en COSO/ACFE Principio 3.","subs":[{"id":"3.1","name":"Mapeo de Customer Journeys","comps":[{"id":"3.1.1","name":"Mapeo de journeys con puntos de vulnerabilidad","L":["No existe mapeo de journeys desde perspectiva de fraude.","Se conocen informalmente pero no están documentados con vulnerabilidades.","Mapas para los 3 productos/canales principales con puntos de vulnerabilidad y controles mapeados.","Todos los journeys mapeados, cada punto con control asignado y owner. Se actualiza ante cada cambio de flujo.","Incluyen heatmap de riesgo por punto, datos de pérdida real, y war games semestrales para nuevas vulnerabilidades."]},{"id":"3.1.2","name":"Cobertura de controles por etapa del journey","L":["Controles concentrados en una sola etapa (generalmente post-transacción).","Hay controles en 2 etapas pero quedan vacíos en autenticación, post-transacción o disputas.","Controles en las 5 etapas: onboarding, autenticación, transacción, post-transacción y disputa.","Controles diferenciados por canal y producto en cada etapa. Se mide efectividad por etapa.","Controles adaptativos: la intensidad se ajusta dinámicamente según risk score. Se mide tasa de captura y fricción por etapa."]},{"id":"3.1.3","name":"Controles embebidos vs. bolt-on","L":["Todos los controles son bolt-on: agregados después del diseño del journey.","Algunos están embebidos (ej: OTP), pero la mayoría son parches.","Los controles principales están diseñados como parte del journey original.","Existe guía de 'fraud by design' aplicada en diseño de todos los journeys nuevos.","Todos los controles son invisibles al cliente (frictionless by design) a menos que el risk score exceda umbral."]},{"id":"3.1.4","name":"Análisis de gaps en journeys digitales vs. presenciales","L":["No se ha realizado un análisis de gaps entre journeys digitales y presenciales.","Se reconoce que los journeys digitales tienen mayor riesgo, pero no se ha cuantificado el gap de controles.","Se ha realizado un gap analysis que identifica controles presentes en el journey presencial ausentes en el digital (y viceversa). Documentado.","El gap analysis se actualiza semestralmente, incluye plan de remediación con timeline, y se prioriza por pérdida esperada.","Existe un programa continuo de penetration testing de journeys digitales que identifica vulnerabilidades antes de que sean explotadas. Los resultados alimentan el roadmap de controles."]}]},{"id":"3.2","name":"Onboarding e Identidad","comps":[{"id":"3.2.1","name":"Programa contra robo de identidad","L":["No existe programa formal de identity theft. No se buscan red flags.","Se revisan documentos manualmente en apertura presencial, sin programa digital.","Programa documentado con red flags por canal, capacitación al front, y al menos una herramienta de verificación.","Verificación documental + no documental + digital ID verification. Se mide tasa de detección en onboarding.","Multimodal verification: documento + facial match + device intelligence + behavioral analytics."]},{"id":"3.2.2","name":"Detección de identidades sintéticas","L":["No se buscan identidades sintéticas en originación.","Se revisan solicitudes sospechosas manualmente, sin herramientas específicas.","Se usan al menos 2 señales de synthetic ID (SSN randomization, credit file thin con actividad alta).","Modelo o score específico que evalúa consistencia de datos, velocidad de construcción de crédito, patrones anómalos.","Enfoque multi-capa: score + consortium data + análisis de grafos + verificación de dispositivo. Se mide detection rate específico."]},{"id":"3.2.3","name":"Validación de dispositivo en onboarding digital","L":["No se valida el dispositivo en onboarding digital.","Se registra información básica (IP, user agent) pero no se usa para decisiones.","Device fingerprinting en onboarding comparado contra listas negras.","Device fingerprint enriquecido con geolocalización, velocity, integrado con score de onboarding.","Device intelligence en real-time: reputation score, emulador detection, jailbreak/root, VPN/proxy. Decisión holística."]},{"id":"3.2.4","name":"Debida diligencia reforzada para clientes de alto riesgo","L":["No existe debida diligencia reforzada para clientes de alto riesgo desde la perspectiva de fraude.","Se aplica EDD para AML/KYC pero no se incluyen criterios de riesgo de fraude.","Se aplica EDD de fraude para al menos 2 segmentos de alto riesgo (ej: nuevos clientes digitales, clientes con historial de chargebacks).","Se aplica EDD con criterios de fraude diferenciados por producto, canal y perfil. Los criterios se revisan anualmente basándose en datos de pérdida.","La EDD de fraude está integrada con el scoring de onboarding: el nivel de due diligence se determina dinámicamente por el risk score del aplicante. Se mide la tasa de detección en EDD vs. diligencia estándar."]},{"id":"3.2.5","name":"Listas negras internas y compartidas (consorcios)","L":["No se mantienen listas negras de fraude.","Se mantiene una lista negra interna básica (ej: tarjetas comprometidas), pero no se comparte con consorcios ni se actualiza sistemáticamente.","Se mantienen listas negras internas por tipo (dispositivos, beneficiarios, identidades) y se consume al menos una lista externa de consortium.","Las listas se actualizan en near-real-time desde investigaciones y fuentes externas. Se usan en el scoring de detección. Se mide la contribución de cada lista al detection rate.","Se participa activamente en consorcios de compartición bidireccional. Las listas se integran programáticamente con el motor de detección. Se mide false match rate y true match rate por lista."]},{"id":"3.2.6","name":"Cotejo contra listas de sanciones (OFAC)","L":["No se cotejan clientes ni transacciones contra listas de sanciones desde la perspectiva de fraude.","El cotejo existe en AML/compliance pero no está integrado con el flujo de fraude.","El cotejo contra OFAC/SDN se ejecuta en onboarding y se comparte el resultado con el equipo de fraude.","El cotejo se ejecuta en onboarding y en cada transacción para beneficiarios de alto riesgo. Los matches se investigan con protocolo documentado.","El cotejo es real-time, multi-lista (OFAC, UN, EU, listas locales), con fuzzy matching avanzado. Se integra con el scoring de fraude y se audita la tasa de false positives."]}]},{"id":"3.3","name":"Autenticación y Control de Acceso","comps":[{"id":"3.3.1","name":"Métodos de autenticación por canal","L":["Solo usuario + contraseña en todos los canales. Sin segundo factor.","MFA (OTP SMS) en al menos un canal; otros dependen solo de contraseña.","MFA en todos los canales digitales. Métodos: OTP y push notification como mínimo.","Además de MFA, métodos avanzados en al menos un canal: biometría, device binding, behavioral biometrics.","Autenticación adaptativa multi-método: el sistema selecciona método según risk score de la sesión."]},{"id":"3.3.2","name":"Autenticación adaptativa basada en riesgo","L":["No existe. Todos pasan por el mismo flujo independientemente del riesgo.","Step-up para operaciones fijas (ej: transferencias >$X), pero no basado en riesgo de sesión.","Step-up se activa basado en al menos 3 señales de riesgo (monto, dispositivo nuevo, geo atípica).","Risk engine evalúa 10+ señales en tiempo real y decide nivel de autenticación. Se mide tasa de abandono por nivel.","Motor de autenticación se entrena continuamente con datos de fraude confirmado. Se optimiza para minimizar fricción en sesiones legítimas."]},{"id":"3.3.3","name":"Protección contra ATO","L":["No existen controles específicos para ATO. No se monitorean cambios de dispositivo, SIM swap ni credential stuffing.","Se detectan cambios de contraseña con notificación, pero sin monitoreo de otros indicadores.","Se monitorean al menos 3 indicadores: cambio de dispositivo + cambio de datos de contacto + login desde IP/geo atípica.","Score de riesgo de sesión que integra device fingerprint, behavioral biometrics, velocity, IP reputation, SIM swap detection.","Multi-capa en real-time: credential intelligence, session risk scoring, behavioral analytics, coordinación con telecom para SIM swap."]},{"id":"3.3.4","name":"Balance seguridad/fricción en autenticación","L":["No se mide la fricción generada por la autenticación.","Se conocen quejas de clientes por la autenticación, pero no se mide sistemáticamente.","Se mide la tasa de abandono en el flujo de autenticación por canal. Se reporta mensualmente.","Se mide abandono, tiempo de completación, tasa de error, y NPS por método de autenticación. Se usa para calibrar el step-up.","Existe un modelo de optimización que balancea seguridad (fraud prevented) vs. fricción (abandono + NPS) por segmento de cliente. Se recalibra trimestralmente."]}]},{"id":"3.4","name":"Controles Transaccionales","comps":[{"id":"3.4.1","name":"Límites transaccionales","L":["No existen límites diferenciados para fraude.","Límites genéricos por canal sin diferenciación por perfil de riesgo del cliente.","Límites por canal y producto con al menos 3 niveles (nuevo, regular, VIP). Se revisan anualmente.","Límites dinámicos según perfil de comportamiento del cliente. Se mide impacto en experiencia.","Límites completamente adaptativos: se recalculan por transacción basándose en risk score, contexto (hora, dispositivo, beneficiario). Se optimizan para minimizar declinaciones legítimas."]},{"id":"3.4.2","name":"Controles en pagos en tiempo real (PIX/instant)","L":["Mismos controles que pagos batch — sin diferenciación.","Se aplican mismos límites más restrictivos, sin controles específicos.","Controles específicos: scoring real-time, verificación de beneficiario, velocity checks para el canal.","Incluye mule account detection, behavioral analytics, confirmación de beneficiario (CoP), hold inteligente (<30 seg) para alto riesgo.","Scoring <100ms con modelo ML específico para el canal. FP rate medido por separado. Network intelligence para beneficiarios de alto riesgo."]},{"id":"3.4.3","name":"Reglas de negocio preventivas","L":["No existen reglas preventivas más allá de límites de monto.","Existen 2-3 reglas básicas (ej: bloqueo por país, límite de monto), aplicadas uniformemente.","Existen reglas diferenciadas: velocity checks, geo-fencing, merchant category restrictions, y horarios atípicos. Documentadas con owner.","Las reglas preventivas se calibran con datos de fraude real. Se mide el impacto de cada regla en la prevención vs. la fricción generada.","Las reglas son dinámicas: se ajustan en near-real-time según el perfil del cliente y el contexto de la transacción. Se usa A/B testing para validar nuevas reglas antes de despliegue general."]},{"id":"3.4.4","name":"Proceso de excepción y override de controles","L":["No existe un proceso de excepción. Los controles se aplican o no se aplican, sin documentación.","Las excepciones se otorgan informalmente (ej: un gerente autoriza por teléfono). No se documentan.","Existe un proceso documentado: solicitud, justificación, aprobación por autoridad definida, y registro de la excepción.","Las excepciones se registran en un sistema, tienen vigencia limitada, y se auditan trimestralmente. Se mide el volumen de excepciones y su correlación con pérdidas.","Las excepciones se analizan como señal de que el control necesita recalibración. Patrones de excepción recurrentes disparan revisión del control. Se reporta al comité."]}]},{"id":"3.5","name":"Prevención de APP Fraud / Scams","comps":[{"id":"3.5.1","name":"Detección de indicadores de coerción","L":["No se buscan indicadores de coerción o social engineering en el journey.","Los analistas están entrenados para identificar coerción en llamadas, pero sin detección automatizada.","Se monitorean al menos 3 señales automatizadas: monto inusual + beneficiario nuevo + hora atípica.","Behavioral analytics: tiempos de sesión anómalos, patrones de typing que sugieren dictado, sesión telefónica simultánea.","Modelo ML específico para APP fraud integrando behavioral, transaccional y contextual. Friction inteligente pre-autorización."]},{"id":"3.5.2","name":"Educación proactiva al cliente","L":["No existe programa de educación al cliente sobre fraude o scams.","Alertas ocasionales en redes sociales o sitio web, sin programa estructurado.","Programa con contenido por canal (in-app tips, emails, SMS) enfocado en tipologías frecuentes. Publicación mensual.","Warnings contextuales en el journey (ej: al transferir a beneficiario nuevo). Se mide tasa de interacción.","Personalización: warnings adaptados al perfil del cliente y contexto de la transacción. Se mide impacto en tasa de fraude."]},{"id":"3.5.3","name":"Protocolo de confirmación de beneficiario (CoP)","L":["No existe un protocolo de confirmación de beneficiario antes de pagos.","Se muestra el nombre del banco destino pero no se valida el nombre del beneficiario.","Se implementa Confirmation of Payee o equivalente para pagos de alto riesgo: se valida nombre del beneficiario vs. cuenta destino antes de autorizar.","CoP se aplica a todos los pagos a nuevos beneficiarios. Se mide la tasa de mismatch y su correlación con fraude. Se notifica al cliente antes de proceder.","CoP con inteligencia: además de name matching, se evalúa el riesgo del beneficiario (mule score, historial de fraude en consortium). Se bloquean automáticamente los beneficiarios de alto riesgo."]}]},{"id":"3.6","name":"Controles de Fraude Interno","comps":[{"id":"3.6.1","name":"Segregación de funciones","L":["No se ha evaluado la segregación desde perspectiva de fraude interno.","Se reconocen algunas incompatibilidades pero sin matriz formal.","Matriz de segregación para procesos de alto riesgo, documentada y revisada anualmente.","La matriz se aplica sistémicamente en permisos del core. Se audita semestralmente. Se detectan violaciones.","Monitoreo en real-time: cualquier violación genera alerta inmediata. Se reporta al comité mensualmente."]},{"id":"3.6.2","name":"Monitoreo de actividad de empleados","L":["No se monitorea actividad de empleados desde perspectiva de fraude.","Se revisan logs manualmente ante sospecha, sin monitoreo proactivo.","Se monitorean al menos 3 indicadores: acceso fuera de horario, volumen inusual, acceso a cuentas sin relación.","Motor de reglas específico para fraude interno: comportamiento, acceso a info sensible, txns en cuentas de empleados/familiares.","Behavioral analytics de empleados: baseline por rol, correlación con HR data, revisiones de acceso trimestrales."]},{"id":"3.6.3","name":"Autorización dual para operaciones sensibles","L":["No existe autorización dual para operaciones sensibles.","Se requiere autorización dual solo para algunas operaciones (ej: transferencias internacionales >$X), pero no está sistematizado.","Existe una lista documentada de operaciones que requieren autorización dual: ajustes de cuenta, cambio de límites, overrides de controles, operaciones manuales de alto valor.","La autorización dual se implementa sistémicamente: el sistema no permite completar la operación sin la segunda aprobación. Se audita el cumplimiento.","Se monitorea la efectividad de la autorización dual: se analizan los casos donde la segunda aprobación detectó anomalías. Se ajusta la lista de operaciones anualmente."]},{"id":"3.6.4","name":"Background checks para posiciones de riesgo","L":["No se realizan background checks desde la perspectiva de fraude para posiciones de riesgo.","Se hacen background checks estándar de RRHH al contratar, pero no se repiten ni se enfocan en riesgo de fraude.","Se realizan background checks específicos de fraude (antecedentes judiciales, crediticios, referencias) para posiciones de alto riesgo. Se documenta.","Los background checks se repiten periódicamente (al menos cada 2 años) para posiciones de alto riesgo. Se monitorean cambios de perfil financiero del empleado.","Se usa un programa continuo de monitoring: alertas automáticas si un empleado en posición de riesgo tiene cambios significativos en su perfil crediticio o antecedentes. Se integra con el monitoreo de fraude interno."]}]},{"id":"3.7","name":"Controles de Terceros y Vendors","comps":[{"id":"3.7.1","name":"Due diligence de fraude sobre proveedores","L":["No se evalúa riesgo de fraude sobre proveedores o partners.","Se evalúa riesgo de terceros en general pero sin componente específico de fraude.","Preguntas de fraude en evaluación de terceros de alto riesgo. Se documenta.","Cuestionario específico con scoring. Los de alto riesgo requieren revisión periódica y controles contractuales.","Se monitorean indicadores de fraude originados vía terceros. Se comparten datos con partners estratégicos. Auditorías de fraude sobre terceros."]},{"id":"3.7.2","name":"Controles contractuales con terceros","L":["No existen controles contractuales de fraude con terceros.","Los contratos con terceros mencionan fraude genéricamente ('cumplir con estándares de seguridad').","Los contratos incluyen cláusulas específicas: liability shift, obligación de monitoreo, reporte de incidentes <24h, y derecho de auditoría.","Las cláusulas se revisan anualmente. Se mide el cumplimiento de los SLAs contractuales de fraude. Se escalan incumplimientos.","Los contratos incluyen KPIs de fraude medibles (ej: tasa de fraude originado por el tercero <X bps), penalidades por incumplimiento, y data sharing bidireccional."]},{"id":"3.7.3","name":"Monitoreo de fraude originado por terceros","L":["No se monitorea el fraude originado a través de canales de terceros.","Se conoce que algunos terceros originan fraude, pero no se mide ni se trackea.","Se mide la tasa de fraude por tercero/partner al menos trimestralmente. Se compara vs. canales propios.","Se monitorea en near-real-time la tasa de fraude por tercero. Se aplican controles diferenciados para terceros de alto riesgo. Se escalan desviaciones.","Existe un dashboard de fraude por tercero integrado con el programa de vendor management. Los terceros con tasa de fraude >umbral se ponen en plan de remediación o se terminan."]}]}]},{"id":"P4","name":"Detección, Monitoreo y Decisioning","desc":"Evalúa las capacidades de detección en tiempo real y batch, modelos ML, gestión de alertas e impacto al cliente. Anclado en COSO/ACFE Principio 3 (detectivo) + Gartner 5 Layers.","subs":[{"id":"4.1","name":"Motor de Monitoreo Transaccional","comps":[{"id":"4.1.1","name":"Cobertura por canales y productos","L":["El motor cubre solo un canal o producto (ej: solo tarjetas de crédito).","Cubre 2–3 canales pero deja fuera canales significativos (ej: PIX o digital banking).","Cubre todos los canales y productos principales: tarjetas, transferencias, pagos instantáneos, banca digital y originación.","Cobertura total con reglas diferenciadas por canal/producto. Se mide detection rate por canal. Canales nuevos se integran en <90 días.","Cobertura universal con scoring unificado: reglas del canal + modelo ML cross-channel + network intelligence. Alerta si un canal queda sin monitoreo."]},{"id":"4.1.2","name":"Inventario y documentación de reglas","L":["No existe inventario de reglas. Las reglas están en el sistema pero sin documentación externa.","Existe una lista de reglas activas, pero sin documentación del propósito, lógica ni performance.","Cada regla tiene: nombre, descripción, lógica, fecha de creación, owner, esquema que ataca, y alertas/mes.","Además: detection rate, FP rate, last calibration date, y justificación de umbrales. Se revisa semestralmente.","Inventario dinámico: métricas de producción se actualizan automáticamente. Reglas sin disparar en >6 meses se marcan para revisión. Reglas con FP >90% se escalan para recalibración."]},{"id":"4.1.3","name":"Calibración de umbrales","L":["Los umbrales se definieron al implementar y no se han modificado.","Se ajustan reactivamente cuando las quejas o pérdidas suben, sin proceso periódico.","Recalibración al menos semestral basada en distribución de alertas y feedback de investigaciones.","Recalibración trimestral con datos de TP y FP, documentando cada cambio con before/after metrics.","Optimización automática: el sistema recomienda ajustes maximizando detection con constraint de FP. Los cambios pasan por governance."]},{"id":"4.1.4","name":"Governance del rule set","L":["No existe governance. Cualquiera con acceso puede cambiar reglas.","Proceso informal ('pedir aprobación al jefe') no documentado ni auditado.","Proceso documentado: solicitud, justificación, aprobación, testing en QA antes de producción.","Incluye change advisory board, backtesting, impact analysis, y rollback procedure.","Full governance: ticket, backtesting, aprobación dual, canary testing, monitoring post-deploy 7 días, rollback automático si FP excede umbral."]},{"id":"4.1.5","name":"Desempeño de reglas","L":["No se mide el desempeño por regla individual.","Se conoce el FP rate global pero no por regla.","Se mide detection rate y FP rate por regla al menos trimestralmente. Se identifican top-10 por volumen.","Cada regla tiene scorecard: alertas, detection rate, FP rate, TP rate, pérdida detectada y no detectada. Revisión mensual.","Dashboards real-time por regla, alertas automáticas si FP excede threshold o regla deja de disparar. Reporte trimestral de 'reglas zombie'."]}]},{"id":"4.2","name":"Modelos de Machine Learning","comps":[{"id":"4.2.1","name":"Existencia y alcance de modelos ML","L":["No se usan modelos ML. Todo el monitoreo es con reglas estáticas.","Se usa un modelo ML de vendor (ej: FICO/Falcon) sin customización ni modelos propietarios.","Modelos ML (vendor + al menos 1 propietario) para detección. Cubren al menos un tipo de fraude.","Múltiples modelos ML: fraude transaccional, ATO, originación, y al menos uno cross-channel. Documentación técnica completa.","Portfolio completo: por tipo de fraude, canal y segmento. Técnicas avanzadas (deep learning, graph neural networks). Se mide contribution margin ML vs. reglas."]},{"id":"4.2.2","name":"Validación independiente de modelos","L":["No se validan independientemente. El equipo que desarrolla también valida.","Validación básica interna antes de deployment, por el mismo equipo.","Equipo o función de validación independiente (2LoD o tercero) que valida antes de producción. Se documenta.","Sigue OCC 2011-12 / SR 11-7: conceptual soundness, outcomes analysis, ongoing monitoring. Informe con hallazgos.","Backtesting riguroso, stability analysis (PSI), AUC/Gini, calibration analysis, bias testing, stress testing. Revalidación anual."]},{"id":"4.2.3","name":"Champion/challenger","L":["No existe proceso. El modelo en producción es el único hasta reemplazo manual.","Modelos nuevos se desarrollan como reemplazo total sin ejecución en paralelo.","Al menos un challenger en shadow mode para comparar performance antes del swap.","Múltiples challengers en paralelo con métricas automatizadas. El swap se decide con datos.","A/B testing en producción con control de exposición. Ciclo champion/challenger continuo."]},{"id":"4.2.4","name":"Monitoreo de performance en producción","L":["No se monitorea performance una vez en producción.","Se revisa manualmente cada 6+ meses o cuando hay aumento de pérdidas.","Monitoreo mensual: AUC, detection rate, FP rate, score distribution.","Monitoreo real-time o semanal con alertas automáticas si métricas se degradan (AUC, PSI, FP rate).","Framework completo: performance + feature drift + concept drift + data quality checks. Backtesting mensual. Trigger automático de reentrenamiento."]},{"id":"4.2.5","name":"Tipos de modelos y técnicas utilizadas","L":["No se usan modelos de ML para fraude.","Se usa un solo tipo de modelo (ej: regresión logística o score de vendor) sin explorar otras técnicas.","Se usan al menos 2 tipos de modelos: supervisados (ej: gradient boosting) y al menos un no supervisado (ej: clustering para anomalías).","Se usa un ensemble de modelos que combina múltiples técnicas (supervisados, no supervisados, redes neuronales). Se evalúa el contribution de cada técnica al detection.","Se usan técnicas de frontera: graph neural networks para detección de redes, deep learning para secuencias transaccionales, generative models para data augmentation en clases raras. Se documenta la justificación de cada técnica."]},{"id":"4.2.6","name":"Explainability e interpretabilidad de modelos","L":["No se evalúa la explainability de los modelos. Son cajas negras.","Se conocen las features más importantes del modelo, pero no se puede explicar una decisión individual.","Se usan técnicas de explainability (SHAP, LIME) para al menos el modelo principal. Se puede explicar por qué una transacción se marcó como sospechosa.","La explainability se integra en el flujo de investigación: el analista ve las top-N razones de cada alerta. Se evalúa la utilidad de las explicaciones con feedback de los analistas.","La explainability se usa también para cumplimiento regulatorio (fair lending, bias testing), para debugging de modelos, y para comunicación al cliente cuando se requiere. Se audita anualmente."]},{"id":"4.2.7","name":"Proceso de desarrollo de modelos","L":["No existe un proceso estandarizado de desarrollo de modelos de fraude.","Los modelos se desarrollan ad-hoc: un data scientist los construye con su propia metodología.","Existe un proceso documentado con etapas: definición del problema, data selection, feature engineering, training, testing, documentación, y deployment.","El proceso incluye peer review en cada etapa, data governance (linaje de datos de entrenamiento), testing con datos out-of-time, y documentación completa alineada con OCC/SR 11-7.","El proceso está automatizado (MLOps pipeline): feature store, automated training, automated testing (AUC, stability, bias), automated documentation, y deployment con canary testing. Se mide el time-to-production de un nuevo modelo."]}]},{"id":"4.3","name":"Arquitectura de Detección: Real-Time vs. Batch","comps":[{"id":"4.3.1","name":"Capacidad real-time","L":["No existe detección en tiempo real. Todo es batch (D+1).","Algunas alertas en near-real-time (<1 hora), mayoría batch diario.","Scoring en real-time (<500ms) para los canales principales.","Scoring <200ms para todos los canales. Se monitorea latencia con SLA.","Scoring <100ms con 99.9% uptime. Soporta 10x picos. Stress tests trimestrales. Failover con degradación graceful."]},{"id":"4.3.2","name":"Procesos batch complementarios","L":["No existen procesos batch de detección. Todo lo que no se detecta en real-time se pierde.","Se ejecutan consultas manuales ad-hoc cuando se sospecha de un patrón, pero no hay procesos batch automatizados.","Existen procesos batch diarios que buscan patrones de largo plazo: velocidad acumulada, patrones de beneficiario recurrente, ring detection.","Los procesos batch cubren tipologías que no se pueden detectar en real-time: slow-burn patterns, synthetic ID rings, colusión interna. Se ejecutan diariamente con alertas automáticas.","Se combinan real-time y batch en una arquitectura lambda/kappa: el real-time decide en milisegundos, el batch revalúa con contexto histórico completo y genera alertas retroactivas. Se mide la contribución de cada capa."]},{"id":"4.3.3","name":"Arquitectura de decisioning","L":["No hay una arquitectura de decisioning definida. Las decisiones son manuales o automáticas sin criterios claros.","Las decisiones se dividen binariamente: automática (aprobado) o manual (cola de revisión). Sin matices.","Existe una arquitectura de 3 niveles: aprobación automática (bajo riesgo), alerta para revisión (medio riesgo), y bloqueo automático (alto riesgo). Los umbrales están documentados.","La arquitectura incluye decisiones intermedias: aprobación con step-up authentication, aprobación con hold temporal, y aprobación con notificación al cliente. Se mide el impacto de cada decisión.","La arquitectura es adaptativa: los umbrales de decisión se ajustan dinámicamente por canal, producto y hora del día. Se usa reinforcement learning para optimizar las decisiones en función de outcome real."]}]},{"id":"4.4","name":"Gestión de Alertas y Triage","comps":[{"id":"4.4.1","name":"Proceso de triage","L":["No existe proceso de triage. Alertas en orden de llegada sin priorización.","Se priorizan informalmente las de mayor monto, sin criterios documentados ni SLAs.","Proceso documentado con criterios de priorización, asignación, y SLAs de disposición.","Triage automático: score de prioridad asigna alertas a colas con SLA diferenciado. Las de máxima prioridad con SLA <30 min.","ML de priorización ordena por probabilidad de TP × impacto financiero. Las de baja probabilidad se auto-dispositivan. Se optimiza productividad."]},{"id":"4.4.2","name":"Impacto en el cliente de los falsos positivos","L":["No se mide el impacto de los falsos positivos en el cliente.","Se conocen quejas por bloqueos pero no se cuantifican ni correlacionan con el motor.","Se mide tasa de transacciones legítimas declinadas y se reporta mensualmente.","Se mide: declinaciones legítimas, NPS post-fraude, revenue perdido, tasa de contacto por FP. Se presenta al comité.","Modelo de impacto que cuantifica en USD el costo total de la fricción. Se usa para calibrar umbrales de detección."]},{"id":"4.4.3","name":"Productividad del equipo de análisis","L":["No se mide la productividad del equipo de análisis de alertas.","Se conoce informalmente cuántas alertas revisa cada analista, pero no se mide ni se compara.","Se mide: alertas por analista por día, tiempo promedio de disposición, y tasa de disposición correcta.","Se mide con granularidad: por analista, por tipo de alerta, por turno. Se usa para balanceo de carga, identificación de necesidades de capacitación, y planificación de headcount.","Se optimiza la productividad con ML: las alertas se enrutan al analista con mayor expertise en el tipo de fraude. Se usa gamification y quality scoring para incentivar accuracy, no solo volumen."]},{"id":"4.4.4","name":"Categorización de disposiciones y retroalimentación","L":["Las alertas se cierran sin categorización del resultado.","Las alertas se cierran como 'fraude' o 'no fraude' sin subcategorización.","Se categorizan con al menos 5 disposiciones: fraude confirmado (por tipo), falso positivo (por razón), escalado, y pendiente. Se usa para métricas.","Las disposiciones alimentan directamente las métricas de performance de reglas y modelos. Se usa la razón del falso positivo para recalibrar.","Las disposiciones se usan como labels de reentrenamiento para modelos ML. Se ejecuta quality assurance sobre las disposiciones (doble revisión de una muestra). Se mide la tasa de error de los analistas."]}]},{"id":"4.5","name":"Monitoreo Cross-Channel","comps":[{"id":"4.5.1","name":"Visión unificada del cliente","L":["Cada canal tiene monitoreo independiente. No se cruza información.","Se comparten algunas listas pero el scoring es por canal sin visión del cliente.","Customer-level score que agrega actividad de al menos 2 canales para el decisioning.","Score customer-level que integra todos los canales simultáneamente.","Score con features cross-channel en real-time: el modelo detecta patrones multi-canal que ningún canal detecta solo."]},{"id":"4.5.2","name":"Correlación de eventos entre canales","L":["No se correlacionan eventos entre canales.","Se correlacionan manualmente durante la investigación, pero no en el momento de la detección.","Se correlacionan al menos 3 tipos de eventos cross-canal en near-real-time (ej: cambio de clave + transferencia + cambio de dispositivo).","Existe un motor de correlación de eventos que monitorea secuencias cross-canal en tiempo real. Se tienen al menos 10 escenarios de correlación activos.","El motor de correlación usa event-driven architecture: cada evento del cliente se evalúa en contexto de su actividad en todos los canales en los últimos 7 días. Los modelos ML consumen features de correlación como input."]}]},{"id":"4.6","name":"Analítica de Red / Grafos","comps":[{"id":"4.6.1","name":"Capacidad de análisis de grafos","L":["No se usa análisis de grafos para detección.","Link analysis manual para investigaciones puntuales, no parte del proceso de detección.","Se usa para al menos un caso de uso: mule networks o synthetic ID rings. Herramienta dedicada.","Uso sistemático: mule networks, synthetic ID rings, colusión interna, beneficiario compartido. Integrado con alertas.","Graph analytics en near-real-time como feature input para modelos ML. Graph neural networks para detección de comunid
