const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  kids.flat(9).forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
};

function sha256(str){ const buf=new TextEncoder().encode(str); return crypto.subtle.digest('SHA-256',buf).then(h=>Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')); }
function checkEditorAuth(){
  if(IS_CLIENT) return;
  var stored=sessionStorage.getItem('fcma_editor_auth'); if(stored==='ok') return;
  var pwd=prompt('FCMA Editor — Enter password:');
  if(!pwd){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#64748b;font-family:system-ui">Access denied</div>';return;}
  sha256(pwd).then(hash=>{if(hash===EDITOR_HASH){sessionStorage.setItem('fcma_editor_auth','ok');load();render();}else{document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#ef4444;font-family:system-ui">Invalid password</div>';}});
}

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwH3iTpHO9qrKsvxyyqpr_YwpRor3JRfKdgTcOxeZ7sTcd_GBvgyVzW2n7pBnwKXiic/exec';
function validateCode(code,callback){
  if(!code){callback(false,'');return;}
  fetch(SHEET_URL+'?action=validate&code='+encodeURIComponent(code)).then(r=>r.json()).then(data=>{if(data.valid){CODE_VALID=true;CODE_COMPANY=data.company||'';callback(true,data.company);}else{CODE_VALID=false;callback(false,'');}}).catch(()=>{CODE_VALID=true;callback(true,'');});
}
function postToSheets(payload){return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}).catch(e=>console.warn('Sheets:',e));}
function sendRegistration(r){return postToSheets({type:'registration',accessCode:r.accessCode||ACCESS_CODE||'',company:r.company,contact:r.contact,email:r.email,role:r.role,country:r.country,sector:r.sector,lang:r.lang,ndaAccepted:r.ndaAccepted,ts:r.ts});}
function sendAnswers(){
  var sc=getScores(),totalQ=0,pillarScores={};
  DATA.forEach(p=>{p.subs.forEach(s=>{totalQ+=s.comps.length});pillarScores[p.id]=sc[p.id]||0;});
  return postToSheets({type:'answers',registration:REG_DATA,answers:ANSWERS,totalQuestions:totalQ,globalScore:sc._total,pillarScores,mode:AQ_MODE,lang:LANG});
}

function importMD(text){

    if(curP&&!curP.desc&&line.startsWith('*')&&line.endsWith('*')){curP.desc=line.slice(1,-1);continue;}
    const sm=line.match(/^## (\d+\.\d+)\s*[—–-]\s*(.+)/);if(sm&&curP){curS={id:sm[1],name:sm[2].trim(),comps:[]};curP.subs.push(curS);curC=null;continue;}
    const cm=line.match(/^### (?:🔷\s*CORE\s*·\s*)?(\d+\.\d+\.\d+)\s*·\s*(.+)/);if(cm&&curS){if(line.includes('🔷 CORE'))newCore.add(cm[1]);curC={id:cm[1],name:cm[2].trim(),L:[]};curS.comps.push(curC);continue;}
    const lm=line.match(/^\|\s*\*\*(\d)\*\*\s*\|\s*(.+?)\s*\|$/);if(lm&&curC){curC.L.push(lm[2]);continue;}
  }
  pilars.forEach(p=>p.subs.forEach(s=>s.comps.forEach(c=>{while(c.L.length<5)c.L.push('');})));
  DATA=pilars;CORE=newCore;ACTIVE_P=pilars.length>0?0:null;ACTIVE_S=null;save();render();
}

      var pName=DATA[i].id+': '+DATA[i].name.split(' ').slice(0,3).join(' ');
      var anchor='middle';
      if(lp.x<rcx-15)anchor='end';else if(lp.x>rcx+15)anchor='start';
      var sv=scores[DATA[i].id]||0;
      var lc=sv>0?(sv<2?'#ef4444':sv<3?'#f97316':sv<3.5?'#f59e0b':sv<4.25?'#3b82f6':'#22c55e'):'var(--dim)';
      sp.push('<text x="'+lp.x.toFixed(1)+'" y="'+lp.y.toFixed(1)+'" text-anchor="'+anchor+'" font-size="10" font-weight="700" fill="'+lc+'" font-family="IBM Plex Sans,sans-serif">'+pName+'</text>');
      if(sv>0){var lp2=rpt(i,5.7+0.5,5);sp.push('<text x="'+lp2.x.toFixed(1)+'" y="'+lp2.y.toFixed(1)+'" text-anchor="'+anchor+'" font-size="9" fill="'+lc+'bb" font-family="IBM Plex Mono,monospace">'+sv.toFixed(1)+'</text>');}
    }
    // Legend
    sp.push('<rect x="16" y="'+(SH-46)+'" width="14" height="3" rx="1.5" fill="#3b82f6"/>');
    sp.push('<text x="36" y="'+(SH-40)+'" font-size="10" fill="var(--dim)" font-family="IBM Plex Sans,sans-serif">Current Score</text>');
    sp.push('<line x1="16" y1="'+(SH-26)+'" x2="30" y2="'+(SH-26)+'" stroke="rgba(13,148,136,0.7)" stroke-width="2" stroke-dasharray="4,3"/>');
    sp.push('<text x="36" y="'+(SH-22)+'" font-size="10" fill="var(--dim)" font-family="IBM Plex Sans,sans-serif">Target 4.0</text>');
    sp.push('</svg>');
    var radarWrap=el('div',{style:{display:'flex',justifyContent:'center',overflowX:'auto'}});
    radarWrap.innerHTML=sp.join('');
    radarSec.append(radarWrap);
  })();
  wrap.append(radarSec);

  // ── SECTION 4: PILLAR SCORES WITH DRILL-DOWN ──
  var pillarSec=el('div',{className:'rpt-card'});
  pillarSec.append(
    el('div',{className:'rpt-card-title'},'Results by Pillar'),
    el('div',{style:{fontSize:'13px',color:'var(--mute)',marginBottom:'20px'}},'Click any pillar to expand sub-dimension heatmap. Color: red <2.0 · orange 2–2.9 · yellow 3–3.4 · blue 3.5–4.2 · green >4.2')
  );

  var expandedPillars={};
  function buildPillarCard(p,pi){
    var pScore=scores[p.id]||0;
    var pColor=scoreColor(pScore);
    var pAnswered=0,pTotal=0;
    p.subs.forEach(function(s){s.comps.forEach(function(c){pTotal++;if(ANSWERS[c.id])pAnswered++;});});
    var pPct=pScore>0?(pScore/5*100):0;
    var isExp=!!expandedPillars[p.id];
    var card=el('div',{className:'rpt-pillar-card'+(isExp?' expanded':'')});

    var hrow=el('div',{className:'rpt-pillar-hrow',onClick:function(){
      expandedPillars[p.id]=!expandedPillars[p.id];
      var nc=buildPillarCard(p,pi);
      card.replaceWith(nc);
    }});

    var pidx=el('div',{className:'rpt-pillar-idx',style:{background:pColor+'18',color:pColor,border:'2px solid '+pColor+'44'}},p.id.replace('P',''));
    var pinfo=el('div',{style:{flex:'1',minWidth:0}});
    pinfo.append(
      el('div',{style:{fontSize:'14px',fontWeight:'700',lineHeight:'1.3'}},p.name),
      el('div',{style:{fontSize:'11px',color:'var(--mute)',marginTop:'3px',fontFamily:'var(--fm)'}},pAnswered+'/'+pTotal+' evaluated · '+p.subs.length+' sub-dimensions')
    );
    var barWrap=el('div',{style:{width:'160px',flexShrink:'0'}});
    var barOuter=el('div',{style:{height:'28px',background:'var(--bg)',borderRadius:'8px',overflow:'hidden'}});
    var barInner=el('div',{style:{height:'100%',width:pPct+'%',background:'linear-gradient(90deg,'+pColor+','+pColor+'bb)',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'10px',transition:'width .6s ease'}});
    if(pScore>0) barInner.append(el('span',{style:{fontSize:'12px',fontWeight:'700',color:'#fff',fontFamily:'var(--fm)'}},pScore.toFixed(1)));
    barOuter.append(barInner); barWrap.append(barOuter);
    var scoreN=el('div',{style:{width:'52px',textAlign:'center',fontSize:'22px',fontWeight:'800',fontFamily:'var(--fm)',color:pScore>0?pColor:'var(--mute)',flexShrink:'0'}},pScore>0?pScore.toFixed(1):'—');
    var arrow=el('div',{style:{fontSize:'18px',color:'var(--mute)',transition:'transform .25s',transform:isExp?'rotate(180deg)':'rotate(0deg)',flexShrink:'0',paddingTop:'4px'}},'▾');
    hrow.append(pidx,pinfo,barWrap,scoreN,arrow);
    card.append(hrow);

    if(isExp){
      var subGrid=el('div',{className:'rpt-sub-grid'});
      p.subs.forEach(function(s){
        var sSum=0,sCnt=0;
        s.comps.forEach(function(c){if(ANSWERS[c.id]){sSum+=ANSWERS[c.id];sCnt++;}});
        var sAvg=sCnt>0?sSum/sCnt:0;
        var sCol=scoreColor(sAvg);
        var sBg=scoreBg(sAvg);
        var sc2=el('div',{className:'rpt-sub-card',style:{background:sAvg>0?sBg:'var(--bg)',borderColor:sAvg>0?sCol+'33':'var(--brd)'}});
        sc2.append(
          el('div',{style:{fontSize:'10px',color:'var(--mute)',marginBottom:'6px',fontFamily:'var(--fm)'}},s.id),
          el('div',{style:{fontSize:'12px',fontWeight:'600',lineHeight:'1.4',marginBottom:'8px',color:sAvg>0?'var(--text)':'var(--mute)'}},s.name),
          el('div',{style:{fontSize:'24px',fontWeight:'800',fontFamily:'var(--fm)',color:sAvg>0?sCol:'var(--mute)'}},sAvg>0?sAvg.toFixed(1):'—'),
          el('div',{style:{fontSize:'10px',color:'var(--mute)',marginTop:'4px'}},sCnt+'/'+s.comps.length+' comps')
        );
        subGrid.append(sc2);
      });
      card.append(subGrid);
    }
    return card;
  }
  DATA.forEach(function(p,pi){pillarSec.append(buildPillarCard(p,pi));});
  wrap.append(pillarSec);

  // ── SECTION 5: CRITICAL GAPS ──
  var gaps=[];
  DATA.forEach(function(p){
    p.subs.forEach(function(s){
      s.comps.forEach(function(c){
        if(ANSWERS[c.id]&&ANSWERS[c.id]<=2) gaps.push({comp:c,score:ANSWERS[c.id],pilar:p,sub:s});
      });
    });
  });
  gaps.sort(function(a,b){return a.score-b.score||(a.comp.id<b.comp.id?-1:1);});

  if(gaps.length>0){
    var gapSec=el('div',{className:'rpt-card'});
    gapSec.append(
      el('div',{className:'rpt-card-title',style:{color:'#ef4444'}},'⚠ Critical Gaps — Level 1–2'),
      el('div',{style:{fontSize:'13px',color:'var(--mute)',marginBottom:'20px'}},gaps.length+' component'+(gaps.length>1?'s':'')+' at critical maturity. Expand each to see current state vs. target Level 4 and optimal Level 5.')
    );
    var expandedGaps={};
    function buildGapCard(g){
      var gCol=g.score===1?'#ef4444':'#f97316';
      var gCard=el('div',{className:'rpt-gap-card',style:{borderLeftColor:gCol}});
      var gHrow=el('div',{className:'rpt-gap-hrow',onClick:function(){
        expandedGaps[g.comp.id]=!expandedGaps[g.comp.id];
        var nc=buildGapCard(g); gCard.replaceWith(nc);
      }});
      var chip=el('div',{className:'rpt-gap-chip',style:{background:gCol+'18',color:gCol,borderColor:gCol+'44'}},'L'+g.score);
      var gInfo=el('div',{style:{flex:'1',minWidth:0}});
      gInfo.append(
        el('div',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'3px'}},g.comp.id+' · '+g.comp.name),
        el('div',{style:{fontSize:'11px',color:'var(--mute)',fontFamily:'var(--fm)'}},g.pilar.id+': '+g.pilar.name+' › '+g.sub.id+' '+g.sub.name)
      );
      var gRight=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',flexShrink:0}});
      if(CORE.has(g.comp.id)) gRight.append(el('span',{style:{fontSize:'10px',fontWeight:'700',padding:'3px 10px',borderRadius:'8px',background:'var(--tealD)',color:'var(--teal)'}},'🔷 CORE'));
      gRight.append(el('span',{style:{fontSize:'18px',color:'var(--mute)',transition:'transform .2s',transform:expandedGaps[g.comp.id]?'rotate(180deg)':'rotate(0deg)'}},'▾'));
      gHrow.append(chip,gInfo,gRight);
      gCard.append(gHrow);

      if(expandedGaps[g.comp.id]){
        var gExp=el('div',{className:'rpt-gap-expand'});
        var curDesc=g.comp.L[g.score-1]||'(No descriptor available)';
        var tarDesc=g.comp.L[3]||'(No descriptor available)';
        var optDesc=g.comp.L[4]||'(No descriptor available)';
        var grid3=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px'}});
        grid3.append(
          (function(){var d=el('div',{className:'rpt-gap-desc',style:{borderColor:gCol+'44',background:gCol+'08'}}); d.append(el('div',{style:{fontSize:'10px',fontWeight:'800',color:gCol,textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'📍 Current — Level '+g.score),el('div',{style:{fontSize:'12px',color:'var(--dim)',lineHeight:'1.65'}},curDesc));return d;})(),
          (function(){var d=el('div',{className:'rpt-gap-desc',style:{borderColor:'#3b82f644',background:'rgba(59,130,246,0.06)'}}); d.append(el('div',{style:{fontSize:'10px',fontWeight:'800',color:'#3b82f6',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'🎯 Target — Level 4'),el('div',{style:{fontSize:'12px',color:'var(--dim)',lineHeight:'1.65'}},tarDesc));return d;})(),
          (function(){var d=el('div',{className:'rpt-gap-desc',style:{borderColor:'#22c55e44',background:'rgba(34,197,94,0.06)'}}); d.append(el('div',{style:{fontSize:'10px',fontWeight:'800',color:'#22c55e',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'🏆 Optimized — Level 5'),el('div',{style:{fontSize:'12px',color:'var(--dim)',lineHeight:'1.65'}},optDesc));return d;})()
        );
        gExp.append(grid3);
        gCard.append(gExp);
      }
      return gCard;
    }
    gaps.forEach(function(g){gapSec.append(buildGapCard(g));});
    wrap.append(gapSec);
  }

  // ── SECTION 6: MATURITY DISTRIBUTION ──
  if(answered>0){
    var lvls=[0,0,0,0,0];
    Object.values(ANSWERS).forEach(function(v){if(v>=1&&v<=5)lvls[v-1]++;});
    var lvlLabels=['Non-Existent','Reactive / Informal','Defined','Managed','Optimized'];
    var lvlColors=['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];
    var distSec=el('div',{className:'rpt-card'});
    distSec.append(
      el('div',{className:'rpt-card-title'},'Maturity Distribution'),
      el('div',{style:{fontSize:'13px',color:'var(--mute)',marginBottom:'24px'}},'Distribution of answered components across all 5 maturity levels.')
    );
    lvls.forEach(function(cnt,i){
      var pct=answered>0?cnt/answered*100:0;
      var row=el('div',{style:{display:'flex',alignItems:'center',gap:'14px',marginBottom:'12px'}});
      row.append(el('div',{style:{width:'42px',height:'42px',borderRadius:'50%',background:lvlColors[i]+'18',border:'2px solid '+lvlColors[i]+'44',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:'800',fontFamily:'var(--fm)',color:lvlColors[i],flexShrink:'0'}},String(i+1)));
      var lw=el('div',{style:{width:'180px',flexShrink:'0'}});
      lw.append(el('div',{style:{fontSize:'13px',fontWeight:'600',color:lvlColors[i]}},'L'+(i+1)+' — '+lvlLabels[i]),el('div',{style:{fontSize:'11px',color:'var(--mute)'}},cnt+' component'+(cnt!==1?'s':'')));
      row.append(lw);
      var bo=el('div',{style:{flex:'1',height:'32px',background:'var(--bg)',borderRadius:'8px',overflow:'hidden'}});
      var bi=el('div',{style:{height:'100%',width:pct+'%',background:'linear-gradient(90deg,'+lvlColors[i]+','+lvlColors[i]+'bb)',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'12px',transition:'width .6s ease'}});
      if(cnt>0) bi.append(el('span',{style:{fontSize:'12px',fontWeight:'700',color:'#fff',fontFamily:'var(--fm)'}},cnt));
      bo.append(bi); row.append(bo);
      row.append(el('div',{style:{width:'46px',textAlign:'right',fontSize:'14px',fontWeight:'700',color:'var(--mute)',fontFamily:'var(--fm)'}},Math.round(pct)+'%'));
      distSec.append(row);
    });
    wrap.append(distSec);
  }

  // ── SECTION 7: FOOTER / EXPORT ──
  var footerDiv=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'20px',padding:'32px 0 80px'}});
  var btnRow=el('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',justifyContent:'center'}});
  btnRow.append(
    el('button',{className:'btn',style:{padding:'12px 28px',fontSize:'14px'},onClick:function(){AQ_VIEW='quiz';render();}},'← Back to Assessment'),
    el('button',{className:'btn',style:{padding:'12px 28px',fontSize:'14px'},onClick:function(){AQ_STARTED=false;AQ_VIEW='quiz';render();}},'🏠 Home'),
    el('button',{className:'btn btn-t',style:{padding:'12px 28px',fontSize:'14px',fontWeight:'700',boxShadow:'0 4px 20px rgba(13,148,136,0.25)'},onClick:function(){sendAnswers();exportJSON();}},'💾 Export Results JSON'),
    el('button',{className:'btn btn-t',style:{padding:'12px 28px',fontSize:'14px',fontWeight:'700',background:'linear-gradient(135deg,#0d9488,#0891b2)',borderColor:'#0d9488',boxShadow:'0 4px 20px rgba(13,148,136,0.35)'},onClick:function(){window.open('fcma_report.html','_blank');}},'📊 Open Executive Report')
  );
  if(answered>0){
    btnRow.append(el('button',{className:'btn btn-r',style:{padding:'12px 28px',fontSize:'14px'},onClick:function(){
      if(confirm('Delete all answers and restart?')){ANSWERS={};AQ_IDX=0;AQ_HIGHEST=0;AQ_VIEW='quiz';AQ_STARTED=false;save();render();}
    }},'🗑 Reset'));
  }
  footerDiv.append(btnRow);
  footerDiv.append(el('div',{style:{textAlign:'center',fontSize:'10px',color:'var(--mute)',lineHeight:'1.8',maxWidth:'640px'}},
    el('div',{style:{marginBottom:'4px'}},'© '+new Date().getFullYear()+' Christian Felipe Toro G. — All rights reserved.'),
    el('div',null,'FCMA™ Framework is exclusive intellectual property of the author. Reproduction, distribution, or use without written authorization is prohibited.')
  ));
  wrap.append(footerDiv);
  main.append(wrap);
}

function renderEditor(main) {
  const left = el('div',{className:'panel panel-l'});
  left.append(el('div',{className:'panel-hd'},t('pilars')));
  DATA.forEach((p,i) => {
    const item = el('div',{className:`pitem${ACTIVE_P===i?' on':''}`,onClick:()=>{ACTIVE_P=i;ACTIVE_S=null;render()}},
      el('span',{className:'pid'},p.id),
      el('span',{className:'pn'},p.name),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deletePilar',{id:p.id}))){DATA.splice(i,1);ACTIVE_P=Math.max(0,i-1);ACTIVE_S=null;save();render()}}},'✕')
    );
    left.append(item);
  });
  left.append(el('button',{className:'btn btn-t',style:{marginTop:'8px'},onClick:()=>{
    DATA.push({id:'P'+DATA.length,name:t('newPilar'),desc:'',subs:[]});
    ACTIVE_P=DATA.length-1;ACTIVE_S=null;save();render();
  }},'+ Pilar'));
  if(!DATA.length) left.append(el('div',{className:'empty-state'},el('div',{style:{fontSize:'13px',color:'var(--dim)',marginBottom:'8px'}},t('noData')),el('div',{style:{fontSize:'11px',color:'var(--mute)'}},t('import'))));
  main.append(left);
  const curP = DATA[ACTIVE_P];
  if (!curP) return;
  const mid = el('div',{className:'panel panel-m'});
  const pidInp = el('input',{className:'inp',value:curP.id,style:{width:'60px',fontFamily:'var(--fm)',fontSize:'12px',marginBottom:'4px'}});
  pidInp.addEventListener('input',()=>{curP.id=pidInp.value;save()});
  const pnInp = el('input',{className:'inp',value:curP.name,style:{fontSize:'13px',fontWeight:'600',marginBottom:'4px'}});
  pnInp.addEventListener('input',()=>{curP.name=pnInp.value;save()});
  const pdInp = el('textarea',{className:'inp',rows:'2',value:curP.desc||'',style:{fontSize:'11px',marginBottom:'10px'},placeholder:t('description')});
  pdInp.addEventListener('input',()=>{curP.desc=pdInp.value;save()});
  mid.append(pidInp,pnInp,pdInp);
  mid.append(el('div',{className:'panel-hd'},'Sub-dimensions ('+curP.subs.length+')'));
  curP.subs.forEach((s,i) => {
    const item = el('div',{className:`pitem${ACTIVE_S===i?' on':''}`,onClick:()=>{ACTIVE_S=i;render()}},
      el('span',{style:{fontSize:'10px',fontFamily:'var(--fm)',color:'var(--tealL)',minWidth:'24px'}},s.id),
      el('span',{className:'pn'},s.name),
      el('span',{className:'badge badge-t'},String(s.comps.length)),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deleteSub',{id:s.id}))){curP.subs.splice(i,1);ACTIVE_S=null;save();render()}}},'✕')
    );
    mid.append(item);
  });
  mid.append(el('button',{className:'btn btn-t',style:{marginTop:'8px'},onClick:()=>{
    const sid=curP.id.replace('P','')+'.'+String(curP.subs.length+1);
    curP.subs.push({id:sid,name:t('newSub'),comps:[]});
    ACTIVE_S=curP.subs.length-1;save();render();
  }},'+ Sub-dimension'));
  main.append(mid);
  const right = el('div',{className:'panel-r'});
  const curS = curP.subs[ACTIVE_S];
  if (!curS) { right.append(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'var(--mute)'}},t('selectSub'))); main.append(right); return; }
  const shdr = el('div',{style:{display:'flex',gap:'10px',alignItems:'center',marginBottom:'10px'}});
  const sidI = el('input',{className:'inp',value:curS.id,style:{width:'60px',fontFamily:'var(--fm)'}});
  sidI.addEventListener('input',()=>{curS.id=sidI.value;save()});
  const snI = el('input',{className:'inp',value:curS.name,style:{flex:'1',fontWeight:'600'}});
  snI.addEventListener('input',()=>{curS.name=snI.value;save()});
  shdr.append(sidI,snI,el('span',{className:'badge badge-b'},curS.comps.length+' comps'));
  right.append(shdr);
  const srch = el('input',{className:'inp',placeholder:t('searchComp'),value:SEARCH,style:{marginBottom:'12px'}});
  srch.addEventListener('input',()=>{SEARCH=srch.value;render()});
  right.append(srch);
  const colors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];
  const labels = getLBL();
  curS.comps.forEach((c,ci) => {
    if (SEARCH && !c.id.toLowerCase().includes(SEARCH.toLowerCase()) && !c.name.toLowerCase().includes(SEARCH.toLowerCase())) return;
    const isCore = CORE.has(c.id);
    const isExp = EXPANDED.has(c.id);
    const card = el('div',{className:`ccard${isCore?' core':''}`});
    const chd = el('div',{className:'ccard-hd',onClick:()=>{if(EXPANDED.has(c.id))EXPANDED.delete(c.id);else EXPANDED.add(c.id);render()}},
      el('span',{className:'cid'},c.id),
      ...(isCore?[el('span',{className:'badge badge-t'},'CORE')]:[]),
      el('span',{className:'cn'},c.name),
      el('button',{className:'btn btn-g btn-sm',onClick:e=>{e.stopPropagation();if(CORE.has(c.id))CORE.delete(c.id);else CORE.add(c.id);save();render()}},isCore?'★':'☆'),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deleteComp',{id:c.id}))){curS.comps.splice(ci,1);save();render()}}},'✕'),
      el('span',{className:`arrow${isExp?' open':''}`},'▾')
    );
    card.append(chd);
    if (isExp) {
      const body = el('div',{className:'ccard-body'});
      const row1 = el('div',{style:{display:'flex',gap:'10px',margin:'10px 0 12px'}});
      const ciI = el('input',{className:'inp',value:c.id,style:{width:'90px',fontFamily:'var(--fm)'}});
      ciI.addEventListener('input',()=>{c.id=ciI.value;save()});
      const cnI = el('input',{className:'inp',value:c.name,style:{flex:'1'}});
      cnI.addEventListener('input',()=>{c.name=cnI.value;save()});
      row1.append(ciI,cnI); body.append(row1);
      c.L.forEach((lv,li) => {
        const lvDiv = el('div',{className:'lvl'});
        lvDiv.append(el('div',{className:'lvl-n',style:{background:colors[li]}},String(li+1)));
        const lvRight = el('div',{style:{flex:'1'}});
        lvRight.append(el('div',{className:'lvl-label',style:{color:colors[li]}},'L'+(li+1)+' — '+labels[li]));
        const ta = el('textarea',{className:'inp',rows:'2',value:lv,placeholder:tf('descLevel',{n:li+1})});
        ta.addEventListener('input',()=>{c.L[li]=ta.value;save()});
        lvRight.append(ta); lvDiv.append(lvRight); body.append(lvDiv);
      });
      card.append(body);
    }
    right.append(card);
  });
  right.append(el('button',{className:'btn btn-t',style:{marginTop:'12px'},onClick:()=>{
    const cid=curS.id+'.'+(curS.comps.length+1);
    curS.comps.push({id:cid,name:t('newComp'),L:['','','','','']});
    EXPANDED.add(cid);save();render();
  }},'+ Component'));
  main.append(right);
}

  DATA.forEach(p => {
    pv.append(el('h2',null,p.id+': '+p.name));
    if(p.desc) pv.append(el('p',{style:{color:'var(--mute)',fontSize:'13px',fontStyle:'italic',margin:'0 0 12px'}},p.desc));
    p.subs.forEach(s => {
      pv.append(el('h3',null,s.id+' — '+s.name));
      s.comps.forEach(c => {
        const isCore = CORE.has(c.id);
        const div = el('div',{className:`comp${isCore?' core':''}`});
        div.append(el('div',{className:'comp-hd'},...(isCore?[el('span',{style:{color:'var(--teal)',marginRight:'6px'}},'🔷 CORE')]:[]),el('span',{style:{fontFamily:'var(--fm)',color:'var(--mute)',marginRight:'8px'}},c.id),c.name));
        const tbl = el('table'); const tb = el('tbody');
        c.L.forEach((l,i) => { tb.append(el('tr',null,el('td',{className:'ln',style:{color:colors[i]}},String(i+1)),el('td',{style:{color:'var(--dim)'}},l))); });
        tbl.append(tb); div.append(tbl); pv.append(div);
      });
    });
  });
  main.append(pv);
}

function renderStats(main) {
  const sv = el('div',{className:'stats'});
  sv.append(el('h2',null,t('statsTitle')));
  const st = getStats();
  const grid = el('div',{className:'sgrid'});
  [[t('pilars'),st.pilars,'var(--teal)'],[t('subs'),st.subs,'var(--tealL)'],[t('comps'),st.comps,'#3b82f6'],[t('core'),st.core,'var(--amb)']].forEach(([l,v,c])=>{
    grid.append(el('div',{className:'scard',style:{borderTop:`3px solid ${c}`}},el('div',{className:'sv',style:{color:c}},String(v)),el('div',{className:'sl'},l)));
  });
  sv.append(grid);
  sv.append(el('h3',{style:{fontSize:'16px',fontWeight:'600',margin:'0 0 12px'}},t('detailByPillar')));
  const tbl = el('table',{className:'stable'});
  const thead = el('thead'); const thr = el('tr');
  [t('pilar'),t('name'),t('subs'),t('comps'),t('core'),t('completeness')].forEach((h,i)=>{ thr.append(el('th',{style:{textAlign:i>1?'center':'left'}},h)); });
  thead.append(thr); tbl.append(thead);
  const tbody = el('tbody');
  DATA.forEach(p=>{
    let pc=0,pcr=0,filled=0,total=0;
    p.subs.forEach(s=>s.comps.forEach(c=>{pc++;if(CORE.has(c.id))pcr++;c.L.forEach(l=>{total++;if(l.trim())filled++})}));
    const pct=total?Math.round(filled/total*100):0;
    const tr=el('tr');
    tr.append(
      el('td',{style:{fontFamily:'var(--fm)',color:'var(--teal)',fontWeight:'700'}},p.id),
      el('td',null,p.name),
      el('td',{style:{textAlign:'center'}},String(p.subs.length)),
      el('td',{style:{textAlign:'center'}},String(pc)),
      el('td',{style:{textAlign:'center'}},el('span',{className:'badge badge-t'},String(pcr))),
      el('td',{style:{textAlign:'center'}},el('div',{className:'pbar'},el('div',{className:'pbar-fill',style:{width:pct+'%',background:pct===100?'var(--grn)':pct>80?'var(--teal)':'var(--amb)'}})),el('div',{style:{fontSize:'10px',color:'var(--mute)',marginTop:'2px'}},pct+'%'))
    );
    tbody.append(tr);
  });
  tbl.append(tbody); sv.append(tbl);
  sv.append(el('div',{style:{marginTop:'28px',padding:'16px',background:'var(--card)',borderRadius:'var(--r)',border:'1px solid var(--brd)'}},
    el('h4',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'6px'}},t('totalDesc')),
    el('p',{style:{fontSize:'13px',color:'var(--dim)'},innerHTML:tf('totalDescText',{c:st.comps,t:st.comps*5})})
  ));
  main.append(sv);
}

// ── INIT ──
load();
if(IS_CLIENT) {
  render();
  validateCode(ACCESS_CODE, function(valid){
    if(valid){ loadLangContent(LANG, function(){ render(); }); }
    else { render(); }
  });
} else {
  checkEditorAuth();
}
</script>
