<!DOCTYPE html>

<head>

<title>FCMA Assessment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#ffffff;--hover:#f1f5f9;--hover2:#ecfdf5;
  --teal:#059669;--tealL:#10b981;--tealD:rgba(5,150,105,0.08);--tealBrd:rgba(5,150,105,0.2);
  --text:#0f172a;--dim:#475569;--mute:#94a3b8;
  --brd:#e2e8f0;--brdL:#cbd5e1;
  --red:#dc2626;--redL:#ef4444;--amb:#d97706;--grn:#059669;--wh:#fff;
  --r:10px;--rs:7px;
  --sh1:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --sh2:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
  --sh3:0 12px 32px rgba(0,0,0,0.1),0 4px 8px rgba(0,0,0,0.05);
  --f:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--f);overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased}
input,textarea,select{font-family:var(--f)}button{font-family:var(--f);cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brdL);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mute)}
::selection{background:var(--tealD);color:var(--teal)}
.app{display:flex;flex-direction:column;height:100vh}
.main{flex:1;display:flex;overflow:hidden}
.hdr{background:var(--wh);border-bottom:1px solid var(--brd);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:var(--sh1);position:relative;z-index:50}
.hdr .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--tealL));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--wh);box-shadow:0 2px 8px rgba(5,150,105,0.3)}
.hdr .title{font-size:14px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.hdr .sub{font-size:10px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:1px}
.pills{display:flex;gap:4px}
.pill{border:1px solid var(--brd);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:500;background:transparent;color:var(--dim);transition:all .15s;cursor:pointer}
.pill:hover{background:var(--hover);border-color:var(--brdL)}
.pill.on{background:var(--teal);border-color:var(--teal);color:var(--wh);font-weight:700;box-shadow:0 2px 6px rgba(5,150,105,0.25)}
.badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;font-family:var(--fm)}
.badge-t{background:rgba(5,150,105,0.1);color:var(--teal);border:1px solid rgba(5,150,105,0.15)}
.badge-b{background:rgba(59,130,246,0.1);color:#2563eb;border:1px solid rgba(59,130,246,0.15)}
.badge-a{background:rgba(217,119,6,0.1);color:var(--amb);border:1px solid rgba(217,119,6,0.15)}
.btn{border:1px solid var(--brd);border-radius:var(--rs);padding:5px 12px;font-size:12px;font-weight:500;background:var(--wh);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:var(--sh1)}
.btn:hover{border-color:var(--brdL);background:var(--hover)}
.btn-t{background:var(--teal);border-color:var(--teal);color:var(--wh);box-shadow:0 2px 8px rgba(5,150,105,0.2)}
.btn-t:hover{background:#047857;border-color:#047857}
.btn-r{background:var(--wh);border-color:rgba(220,38,38,0.3);color:var(--red)}
.btn-r:hover{background:rgba(220,38,38,0.05);border-color:var(--red)}
.btn-g{background:transparent;border-color:transparent;color:var(--mute);box-shadow:none}
.btn-g:hover{background:var(--hover)}
.btn-sm{padding:3px 8px;font-size:11px}
.inp{background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs);color:var(--text);padding:8px 11px;font-size:13px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(5,150,105,0.08);background:var(--wh)}
textarea.inp{resize:vertical;line-height:1.5}
.panel{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;background:var(--wh)}
.panel-l{width:210px;border-right:1px solid var(--brd)}
.panel-m{width:230px;border-right:1px solid var(--brd)}
.panel-r{flex:1;padding:16px;overflow-y:auto;background:var(--bg)}
.panel-hd{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:700}
.pitem{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--rs);cursor:pointer;border:1px solid transparent;transition:all .1s}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--hover2);border-color:var(--tealBrd)}
.pitem .pid{font-size:11px;font-family:var(--fm);color:var(--teal);font-weight:700;min-width:24px}
.pitem .pn{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.ccard{background:var(--wh);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;border-left:3px solid var(--brdL);box-shadow:var(--sh1)}
.ccard.core{border-left-color:var(--teal);border-color:rgba(5,150,105,0.2);box-shadow:0 0 0 1px rgba(5,150,105,0.06),var(--sh1)}
.ccard-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .15s}
.ccard-hd:hover{background:var(--hover)}
.ccard .cid{font-size:11px;color:var(--mute);font-family:var(--fm);min-width:38px}
.ccard .cn{flex:1;font-size:13px;font-weight:500;color:var(--text)}
.ccard-body{padding:0 12px 12px;border-top:1px solid var(--brd);background:var(--bg)}
.ccard .arrow{font-size:14px;color:var(--mute);transition:transform .2s}
.ccard .arrow.open{transform:rotate(180deg)}
.lvl{display:flex;gap:8px;align-items:flex-start;padding:7px;border-radius:var(--rs)}
.lvl:nth-child(odd){background:rgba(5,150,105,0.03)}
.lvl-n{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--wh);flex-shrink:0}
.lvl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.preview{flex:1;overflow-y:auto;padding:32px;max-width:900px;margin:0 auto}
.preview h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.5px}
.preview h2{font-size:18px;font-weight:700;color:var(--teal);margin:24px 0 4px}
.preview h3{font-size:14px;font-weight:600;margin:16px 0 6px 16px}
.preview .comp{margin:0 0 10px 24px;border-left:3px solid var(--brd);padding-left:12px}
.preview .comp.core{border-left-color:var(--teal)}
.preview .comp-hd{font-size:13px;font-weight:600;margin-bottom:4px}
.preview table{width:100%;border-collapse:collapse;font-size:12px}
.preview td{padding:3px 8px;border-bottom:1px solid var(--brd)}
.preview .ln{width:30px;font-weight:700;text-align:center}
.stats{flex:1;overflow-y:auto;padding:32px;max-width:800px;margin:0 auto}
.stats h2{font-size:22px;font-weight:700;margin-bottom:20px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.scard{background:var(--wh);border:1px solid var(--brd);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh1)}
.scard .sv{font-size:30px;font-weight:800;font-family:var(--fm)}
.scard .sl{font-size:11px;color:var(--mute);margin-top:4px}
.stable{width:100%;border-collapse:collapse}
.stable th{padding:8px;text-align:left;border-bottom:2px solid var(--teal);font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.stable td{padding:8px;border-bottom:1px solid var(--brd);font-size:13px}
.pbar{width:100%;height:8px;background:var(--brd);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .3s}
.empty-state{margin-top:20px;padding:20px;border:1px dashed var(--brd);border-radius:var(--r);text-align:center;color:var(--mute);font-size:13px}
.ip-protect{-webkit-user-select:none;-moz-user-select:none;user-select:none}
.ip-protect *{-webkit-user-select:none;-moz-user-select:none;user-select:none}
.ip-protect input,.ip-protect textarea{-webkit-user-select:text;user-select:text}
.watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:0.035;font-size:28px;font-weight:700;color:#0f172a;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:120px;transform:rotate(-25deg);letter-spacing:6px;font-family:var(--fm);overflow:hidden}
.footer-legal{position:fixed;bottom:0;left:0;width:100%;background:rgba(248,250,252,0.97);border-top:1px solid var(--brd);box-shadow:0 -1px 8px rgba(0,0,0,0.06);padding:4px 20px;font-size:10px;color:var(--mute);text-align:center;z-index:9998;letter-spacing:0.3px}
.lang-sel{display:flex;gap:2px;background:var(--hover);border-radius:14px;padding:2px;border:1px solid var(--brd)}
.lang-btn{border:none;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;background:transparent;color:var(--mute);cursor:pointer;transition:all .15s;font-family:var(--f)}
.lang-btn.on{background:var(--wh);color:var(--teal);box-shadow:var(--sh1)}
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseCheck{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.quiz-slide{animation:fadeSlideIn .3s ease-out}
.lvl-card{transition:all .2s ease;cursor:pointer;position:relative;overflow:hidden;background:var(--wh)}
.lvl-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.lvl-card.selected{transform:scale(1.01);box-shadow:var(--sh2)}
.lvl-card.selected .check-anim{animation:pulseCheck .4s ease}
.lvl-expand{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0}
.lvl-expand.open{max-height:400px;opacity:1}
.auto-timer{height:3px;background:var(--tealL);border-radius:2px;transition:width .05s linear}
.db-sidebar{width:186px;flex-shrink:0;background:var(--wh);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow-y:auto;padding:12px 8px;gap:2px;box-shadow:1px 0 4px rgba(0,0,0,0.04)}
.db-sidebar-hdr{padding:8px 10px 12px;border-bottom:1px solid var(--brd);margin-bottom:8px}
.db-sidebar-brand{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1.2px}
.db-sidebar-org{font-size:10px;color:var(--mute);margin-top:3px}
.db-nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;font-size:12px;font-weight:500;transition:all .15s;color:var(--dim);user-select:none}
.db-nav-item:hover{background:var(--hover);color:var(--text)}
.db-nav-item.active{background:var(--hover2);border-color:var(--tealBrd);color:var(--teal);font-weight:700}
.db-nav-icon{font-size:14px;min-width:18px;text-align:center}
.db-nav-badge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:8px;background:rgba(220,38,38,0.1);color:var(--red);border:1px solid rgba(220,38,38,0.15);font-family:var(--fm)}
.db-content{flex:1;overflow-y:auto;padding:28px 32px 60px;background:var(--bg)}
.db-sec-title{font-size:20px;font-weight:800;letter-spacing:-0.4px;color:var(--text);margin-bottom:4px}
.db-sec-sub{font-size:12px;color:var(--mute);margin-bottom:22px}
.db-reg-banner{background:var(--wh);border:1px solid var(--brd);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--sh1)}
.db-reg-label{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:2px}
.db-reg-val{font-size:12px;color:var(--text);font-weight:600}
.db-donut-card{background:var(--wh);border:1px solid var(--brd);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:220px;box-shadow:var(--sh2)}
.db-maturity-card{flex:1;background:var(--wh);border:1px solid var(--brd);border-radius:14px;padding:24px;box-shadow:var(--sh1);min-width:240px}
.db-summary-card{background:var(--wh);border:1px solid var(--brd);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:box-shadow .15s,border-color .15s;box-shadow:var(--sh1)}
.db-summary-card:hover{box-shadow:var(--sh2);border-color:var(--brdL)}
.db-radar-card{background:var(--wh);border:1px solid var(--brd);border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--sh1)}
.db-pillar-card{background:var(--wh);border:1px solid var(--brd);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;box-shadow:var(--sh1);margin-bottom:10px}
.db-pillar-card:hover{box-shadow:var(--sh2)}
.db-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.35);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.db-modal-box{background:var(--wh);border:1px solid var(--brd);border-radius:16px;width:100%;max-width:700px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.12)}
.db-modal-hdr{padding:16px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;background:var(--wh)}
.db-hm-cell{border-radius:8px;padding:10px 10px 8px;cursor:default;transition:all .15s;position:relative;border:1px solid var(--brd);background:var(--wh)}
.db-hm-cell:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.db-tooltip{display:none;position:absolute;z-index:200;background:var(--wh);border:1px solid var(--brdL);border-radius:10px;padding:10px 13px;bottom:calc(100% + 8px);left:0;min-width:210px;max-width:270px;box-shadow:var(--sh3);font-size:11px;line-height:1.5;color:var(--dim);pointer-events:none}
.db-hm-cell:hover .db-tooltip{display:block}
.db-gap-card{border:1px solid var(--brd);border-left:4px solid;border-radius:9px;margin-bottom:8px;overflow:hidden;background:var(--wh);box-shadow:var(--sh1)}
.db-gap-expand{padding:16px;background:var(--bg);border-top:1px solid var(--brd)}
.db-dist-row{background:var(--wh);border:1px solid var(--brd);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh1);margin-bottom:10px}
.db-stat-mini{background:var(--wh);border:1px solid var(--brd);border-radius:10px;padding:14px;text-align:center;box-shadow:var(--sh1)}
.db-footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--brd);font-size:10px;color:var(--mute);text-align:center;line-height:1.8}
.ps-card{background:var(--wh);border:2px solid var(--brd);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:var(--sh1)}
.quiz-top{padding:16px 32px 14px;flex-shrink:0;border-bottom:1px solid var(--brd);background:var(--wh);box-shadow:var(--sh1)}
.quiz-nav{padding:14px 32px;border-top:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--wh);box-shadow:0 -1px 0 var(--brd)}
@media print{body{display:none!important}}
</style>

  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  kids.flat(9).forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
};

function sha256(str){const buf=new TextEncoder().encode(str);return crypto.subtle.digest('SHA-256',buf).then(h=>Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''));}
function checkEditorAuth(){
  if(IS_CLIENT)return;
  var stored=sessionStorage.getItem('fcma_editor_auth');if(stored==='ok')return;

  if(!pwd){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#94a3b8;font-family:system-ui">Access denied</div>';return;}

function parseMD(text){

function hashStr(x){var h=0,i;for(i=0;i<x.length;i++){h=((h<<5)-h+x.charCodeAt(i))|0;}return h;}
function regGet(){try{return JSON.parse(localStorage.getItem('cra_entities')||'{}');}catch(e){return {};}}
function regSave(r){try{localStorage.setItem('cra_entities',JSON.stringify(r));}catch(e){}}
function saveEntitySnapshot(){
  if(ACTIVE_NODE&&ACTIVE_NODE!=='inst')return;
  var entity=(REG_DATA&&REG_DATA.company)?REG_DATA.company.trim():'';
  if(!entity)return;
  var vals=[];for(var k in ANSWERS){if(ANSWERS[k]>0)vals.push(ANSWERS[k]);}
  if(!vals.length)return;
  var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
  var lvlNames=['','Non-existent','Reactive','Defined','Managed','Optimized'];
  var level=lvlNames[Math.round(avg)]||('Score '+avg.toFixed(1));
  var area=(META.assessmentName||META.title||'Assessment');
  var fwShort=(META.frameworkShort||'');
  var key=entity+'|'+area+'|'+fwShort;
  var snapId='snap_'+(hashStr(key)>>>0).toString(36);
  try{localStorage.setItem('cra_snap_'+snapId,JSON.stringify({data:DATA,core:[...CORE],meta:META,answers:ANSWERS,reg:REG_DATA}));}catch(e){}
  var reg=regGet();if(!reg[entity])reg[entity]=[];
  var rec={key:key,area:area,framework:fwShort,date:new Date().toISOString(),avg:parseFloat(avg.toFixed(2)),level:level,inverted:/INVERTED/i.test(META.scoreDirection||''),snapId:snapId};
  var ex=reg[entity].filter(function(a){return a.key===key;})[0];
  if(ex){Object.assign(ex,rec);}else{reg[entity].push(rec);}
  regSave(reg);
}
function goToReport(){
  try{if(typeof ANSWERS!=='undefined'&&Object.keys(ANSWERS).length>0)saveEntitySnapshot();}catch(e){}
  if(typeof ANSWERS!=='undefined'&&Object.keys(ANSWERS).length>0&&!window._answersSynced){window._answersSynced=true;sendAnswers();}
  window.location.href='fcma_report.html';
}
function openSnapshot(snapId){
  try{var snap=JSON.parse(localStorage.getItem('cra_snap_'+snapId));if(snap){localStorage.setItem('fcma_data',JSON.stringify(snap.data));localStorage.setItem('fcma_answers',JSON.stringify(snap.answers));localStorage.setItem('fcma_core',JSON.stringify(snap.core||[]));localStorage.setItem('fcma_meta',JSON.stringify(snap.meta||{}));if(snap.reg)localStorage.setItem('fcma_reg',JSON.stringify(snap.reg));}}catch(e){}
  window.location.href='fcma_report.html';
}

function renderResults(main) {
  var scores = getScores();
  var totalQ = 0, answered = Object.keys(ANSWERS).length;
  DATA.forEach(function(p){ p.subs.forEach(function(s){ totalQ += s.comps.length; }); });

  if (IS_CLIENT && answered > 0 && !window._answersSynced) {
    window._answersSynced = true;
    sendAnswers();
  }

  // ── helpers ──
  function scoreColor(s) {
    if (s <= 0)  return 'var(--mute)';
    if (s < 2)   return '#ef4444';
    if (s < 3)   return '#f97316';
    if (s < 3.5) return '#f59e0b';
    if (s < 4.25)return '#3b82f6';
    return '#22c55e';
  }
  function scoreBg(s) {
    if (s <= 0)  return 'rgba(100,116,139,0.08)';
    if (s < 2)   return 'rgba(239,68,68,0.10)';
    if (s < 3)   return 'rgba(249,115,22,0.10)';
    if (s < 3.5) return 'rgba(245,158,11,0.10)';
    if (s < 4.25)return 'rgba(59,130,246,0.10)';
    return 'rgba(34,197,94,0.10)';
  }
  function scoreBorder(s) {
    if (s <= 0)  return 'rgba(100,116,139,0.25)';
    if (s < 2)   return 'rgba(239,68,68,0.35)';
    if (s < 3)   return 'rgba(249,115,22,0.35)';
    if (s < 3.5) return 'rgba(245,158,11,0.35)';
    if (s < 4.25)return 'rgba(59,130,246,0.35)';
    return 'rgba(34,197,94,0.35)';
  }

  var MATURITY = [
    { min:0,    max:1.49,  label:'Non-Existent', labelEs:'Inexistente', labelPt:'Inexistente',
      color:'#ef4444', icon:'⚫',
      desc:'No formal fraud program structure. Decisions are reactive and ad hoc. Significant regulatory and financial exposure.',
      descEs:'Sin estructura formal. Las decisiones son reactivas. Exposición regulatoria y financiera significativa.',
      descPt:'Sem estrutura formal. Decisões reativas. Exposição regulatória e financeira significativa.' },
    { min:1.5,  max:2.49,  label:'Reactive',     labelEs:'Reactivo',    labelPt:'Reativo',
      color:'#f97316', icon:'🔴',
      desc:'Basic controls exist but informal and undocumented. Program responds to incidents rather than preventing them.',
      descEs:'Controles básicos informales. El programa responde a incidentes en lugar de prevenirlos.',
      descPt:'Controles básicos informais. Programa responde a incidentes em vez de preveni-los.' },
    { min:2.5,  max:3.49,  label:'Defined',      labelEs:'Definido',    labelPt:'Definido',
      color:'#f59e0b', icon:'🟡',
      desc:'Core processes documented and repeatable. Governance in place. Gaps remain in ML detection and cross-functional integration.',
      descEs:'Procesos documentados y repetibles. Gobernanza establecida. Brechas en ML y coordinación interfuncional.',
      descPt:'Processos documentados e repetíveis. Governança estabelecida. Lacunas em ML e integração interfuncional.' },
    { min:3.5,  max:4.24,  label:'Managed',      labelEs:'Gestionado',  labelPt:'Gerenciado',
      color:'#3b82f6', icon:'🔵',
      desc:'Metrics-driven and proactively managed. Detection includes ML models. Continuous improvement established.',
      descEs:'Impulsado por métricas y gestión proactiva. Detección con ML. Mejora continua establecida.',
      descPt:'Orientado por métricas e gestão proativa. Detecção com ML. Melhoria contínua estabelecida.' },
    { min:4.25, max:5.0,   label:'Optimized',    labelEs:'Optimizado',  labelPt:'Otimizado',
      color:'#22c55e', icon:'🟢',
      desc:'Best-in-class program with real-time adaptive controls, full cross-functional convergence, continuous optimization.',
      descEs:'Programa de clase mundial con controles adaptativos en tiempo real y convergencia interfuncional total.',
      descPt:'Programa de classe mundial com controles adaptativos em tempo real e convergência total interfuncional.' }
  ];
  function getMaturity(s) {
    for (var i = 0; i < MATURITY.length; i++) {
      if (s >= MATURITY[i].min && s <= MATURITY[i].max) return MATURITY[i];
    }
    return MATURITY[0];
  }
  function matLabel(m) {
    if (LANG === 'es') return m.labelEs;
    if (LANG === 'pt') return m.labelPt;
    return m.label;
  }
  function matDesc(m) {
    if (LANG === 'es') return m.descEs;
    if (LANG === 'pt') return m.descPt;
    return m.desc;
  }

  var tot = scores._total;

    };

  // sidebar footer actions
  sidebar.append(el('div', { style:{ flex:'1' }}));
  sidebar.append(el('div', { style:{ borderTop:'1px solid var(--brd)', paddingTop:'10px', marginTop:'4px',
    display:'flex', flexDirection:'column', gap:'4px' }}),

      padding:'7px 8px', gap:'4px' },

    }, '↓ ' + (LANG==='es'?'Exportar':LANG==='pt'?'Exportar':'Export'))
  );

  root.append(sidebar);

  // ── CONTENT AREA ──
  var content = el('div', { style:{ flex:'1', overflowY:'auto', padding:'28px 32px 60px' }});

  // ── helpers for section header ──

  // ══════════════════════════════════════════════════════
  // SECTION: OVERVIEW
  // ══════════════════════════════════════════════════════
  if (DASHBOARD_VIEW === 'overview') {
    content.append(sectionTitle(
      LANG==='es'?'Resumen Ejecutivo':LANG==='pt'?'Resumo Executivo':'Executive Overview',
      LANG==='es'?'Resultado consolidado del programa de prevención de crímenes financieros.':
      LANG==='pt'?'Resultado consolidado do programa de prevenção de crimes financeiros.':
      'Consolidated result of the financial crime prevention program.'
    ));

    // registration banner
    if (REG_DATA) {
      var regBanner = el('div', { style:{
        background:'var(--card)', border:'1px solid var(--brd)', borderRadius:'10px',
        padding:'14px 18px', marginBottom:'20px',

      [

      +(tot>0?'<circle cx="100" cy="100" r="'+donutR+'" fill="none" stroke="'+maturity.color+'" stroke-width="'+donutStroke
        +'" stroke-dasharray="'+donutFill.toFixed(2)+' '+(donutC-donutFill).toFixed(2)
        +'" stroke-linecap="round" transform="rotate(-90 100 100)"/>':'')
      +'<text x="100" y="92" text-anchor="middle" dominant-baseline="central" '
        +'font-size="38" font-weight="800" font-family="IBM Plex Mono,monospace" fill="'
        +(tot>0?maturity.color:'var(--mute)')+'">'+( tot>0?tot.toFixed(1):'—')+'</text>'
      +'<text x="100" y="118" text-anchor="middle" dominant-baseline="central" '
        +'font-size="11" font-family="IBM Plex Sans,sans-serif" fill="'+(tot>0?maturity.color+'99':'var(--mute)')+'">out of 5.0</text>'

    );
    heroRow.append(matCard);
    content.append(heroRow);

    // summary cards
    var summaryCards = [
      { label: LANG==='es'?'Respondidas':LANG==='pt'?'Respondidas':'Answered',

          (LANG==='es'?'completado':LANG==='pt'?'concluído':'complete') },

        val: tot>0?tot.toFixed(1)+'':( LANG==='es'?'Sin datos':LANG==='pt'?'Sem dados':'No data'),
        color: tot>0?maturity.color:'var(--mute)',
        sub: tot>0?matLabel(maturity):'—' },
      { label: LANG==='es'?'Mejor Pilar':LANG==='pt'?'Melhor Pilar':'Top Pillar',
        val: bestPilar ? bestScore.toFixed(1) : '—',
        color: bestPilar ? scoreColor(bestScore) : 'var(--mute)',
        sub: bestPilar ? bestPilar.id+': '+bestPilar.name.split(' ').slice(0,3).join(' ') : '—',
        clickSec: bestPilar?'pillar':null }

    var summaryRow = el('div', { style:{ display:'grid',

    summaryCards.forEach(function(sc) {
      var card = el('div', { style:{

      }});

        card.onmouseleave = function() { card.style.borderColor = 'var(--brd)'; };
      }
      card.append(
        el('div', { style:{ fontSize:'28px', fontWeight:'800', fontFamily:'var(--fm)',
          color:sc.color, marginBottom:'4px' }}, sc.val),
        el('div', { style:{ fontSize:'11px', fontWeight:'700', color:'var(--dim)',
          textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'3px' }}, sc.label),
        el('div', { style:{ fontSize:'11px', color:'var(--mute)' }}, sc.sub)
      );
      summaryRow.append(card);
    });
    content.append(summaryRow);

    // radar chart
    var radarDiv = el('div', { style:{
      background:'var(--card)', border:'1px solid var(--brd)', borderRadius:'12px',
      padding:'22px 24px', marginBottom:'20px'
    }});
    radarDiv.append(
      el('div', { style:{ fontSize:'14px', fontWeight:'700', marginBottom:'4px' }},
        LANG==='es'?'Perfil de Madurez por Pilar':LANG==='pt'?'Perfil de Maturidade por Pilar':'Maturity Profile by Pillar'),
      el('div', { style:{ fontSize:'11px', color:'var(--mute)', marginBottom:'20px' }},
        LANG==='es'?'Polígono coloreado = score actual · Anillo punteado = objetivo 4.0 · Escala 1–5':
        LANG==='pt'?'Polígono colorido = score atual · Anel tracejado = meta 4.0 · Escala 1–5':
        'Colored polygon = current score · Dashed ring = target 4.0 · Scale 1–5')
    );
    var N = DATA.length, rcx=280, rcy=220, maxR=140, aStep=(2*Math.PI)/N;
    function rpt(i, val, maxVal) {
      var a = aStep*i - Math.PI/2, r = (val/maxVal)*maxR;
      return { x: rcx+r*Math.cos(a), y: rcy+r*Math.sin(a) };
    }
    var sp = ['<svg width="100%" viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg">'];
    [1,2,3,4,5].forEach(function(lv) {
      var pts=[]; for(var i=0;i<N;i++){var p=rpt(i,lv,5);pts.push(p.x.toFixed(1)+','+p.y.toFixed(1));}
      var col = lv===4?'rgba(13,148,136,0.5)':'rgba(71,85,105,0.2)';
      var sw = lv===4?'1.5':'0.7';
      var da = lv===4?' stroke-dasharray="5,4"':'';
      sp.push('<polygon points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'"'+da+'/>');
      var lp=rpt(0,lv,5);
      sp.push('<text x="'+(lp.x+5).toFixed(1)+'" y="'+(lp.y+3).toFixed(1)+'" font-size="9" fill="rgba(100,116,139,0.6)" font-family="IBM Plex Mono,monospace">'+lv+'</text>');
    });
    for(var i=0;i<N;i++){var ep=rpt(i,5,5);sp.push('<line x1="'+rcx+'" y1="'+rcy+'" x2="'+ep.x.toFixed(1)+'" y2="'+ep.y.toFixed(1)+'" stroke="rgba(71,85,105,0.3)" stroke-width="0.7"/>');}
    var tpts=[]; for(var i=0;i<N;i++){var tp=rpt(i,4,5);tpts.push(tp.x.toFixed(1)+','+tp.y.toFixed(1));}
    sp.push('<polygon points="'+tpts.join(' ')+'" fill="rgba(13,148,136,0.04)" stroke="rgba(13,148,136,0.5)" stroke-width="1.5" stroke-dasharray="5,4"/>');
    var spts=[],hasData=false;
    for(var i=0;i<N;i++){var sv=scores[DATA[i].id]||0;if(sv>0)hasData=true;var pp=rpt(i,Math.max(sv,0.08),5);spts.push(pp.x.toFixed(1)+','+pp.y.toFixed(1));}
    if(hasData){
      sp.push('<polygon points="'+spts.join(' ')+'" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="2"/>');
      for(var i=0;i<N;i++){
        var sv=scores[DATA[i].id]||0;
        if(sv>0){var dp=rpt(i,sv,5);var dc=scoreColor(sv);sp.push('<circle cx="'+dp.x.toFixed(1)+'" cy="'+dp.y.toFixed(1)+'" r="4.5" fill="'+dc+'" stroke="var(--card)" stroke-width="2"/>');}
      }
    }
    for(var i=0;i<N;i++){

      var pN=DATA[i].id+': '+DATA[i].name.split(' ').slice(0,2).join(' ');
      var anchor='middle';
      if(lp.x<rcx-15)anchor='end';else if(lp.x>rcx+15)anchor='start';
      var sv=scores[DATA[i].id]||0;
      var lc=sv>0?scoreColor(sv):'var(--dim)';
      sp.push('<text x="'+lp.x.toFixed(1)+'" y="'+lp.y.toFixed(1)+'" text-anchor="'+anchor+'" font-size="10" font-weight="700" fill="'+lc+'" font-family="IBM Plex Sans,sans-serif">'+pN+'</text>');
      if(sv>0){var lp2=rpt(i,6.6,5);sp.push('<text x="'+lp2.x.toFixed(1)+'" y="'+lp2.y.toFixed(1)+'" text-anchor="'+anchor+'" font-size="9" fill="'+lc+'bb" font-family="IBM Plex Mono,monospace">'+sv.toFixed(1)+'</text>');}

  // ══════════════════════════════════════════════════════

  else if (DASHBOARD_VIEW === 'pillar') {

          el('div', { style:{ fontSize:'11px', color:'var(--mute)', marginTop:'2px', fontFamily:'var(--fm)' }},

    function buildModal() {

      if (existing) existing.remove();
      if (openPilarModal === null) return;

      var p = DATA[openPilarModal];

      var pScore = scores[p.id] || 0;

      }});
      mhdr.append(
        el('div', { style:{
          width:'38px', height:'38px', borderRadius:'9px',
          background:pColor+'18', border:'2px solid '+pColor+'44',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:'14px', fontWeight:'800', fontFamily:'var(--fm)', color:pColor
        }}, p.id.replace('P','')),
        el('div', { style:{ flex:'1' }},
          el('div', { style:{ fontSize:'15px', fontWeight:'700' }}, p.name),
          el('div', { style:{ fontSize:'11px', color:'var(--mute)', marginTop:'2px' }},
            LANG==='es'?'Score global: ':LANG==='pt'?'Score global: ':'Global score: '
            + (pScore>0?pScore.toFixed(1):'—'))
        ),
        el('button', { style:{
          background:'transparent', border:'none', fontSize:'20px', color:'var(--dim)',
          cursor:'pointer', padding:'4px 8px', borderRadius:'4px'
        }, onClick: function(){ openPilarModal=null; overlay.remove(); }}, '✕')
      );

      // modal body: sub-dimensions grid
      var mbody = el('div', { style:{ padding:'16px 20px', overflowY:'auto', display:'flex',
        flexDirection:'column', gap:'10px' }});

      p.subs.forEach(function(s) {
        var sSum=0, sCnt=0;
        s.comps.forEach(function(c){ if(ANSWERS[c.id]){ sSum+=ANSWERS[c.id]; sCnt++; }});
        var sAvg = sCnt>0 ? sSum/sCnt : 0;
        var sCol = sAvg>0 ? scoreColor(sAvg) : 'var(--mute)';

        var subCard = el('div', { style:{
          border:'1px solid '+(sAvg>0?scoreBorder(sAvg):'var(--brd)'),
          background: sAvg>0?scoreBg(sAvg):'var(--bg)',
          borderRadius:'8px', padding:'12px 14px'
        }});

        var subHeader = el('div', { style:{ display:'flex', alignItems:'center',
          gap:'10px', marginBottom:'8px' }});
        subHeader.append(
          el('span', { style:{ fontSize:'10px', fontFamily:'var(--fm)', color:'var(--mute)',
            minWidth:'40px' }}, s.id),
          el('span', { style:{ fontSize:'13px', fontWeight:'600', flex:'1',
            color:sAvg>0?'var(--text)':'var(--dim)' }}, s.name),
          el('span', { style:{ fontSize:'18px', fontWeight:'800', fontFamily:'var(--fm)',
            color:sAvg>0?sCol:'var(--mute)' }}, sAvg>0?sAvg.toFixed(1):'—')
        );
        subCard.append(subHeader);

        // component mini bars
        var compsGrid = el('div', { style:{ display:'flex', flexDirection:'column', gap:'3px' }});
        s.comps.forEach(function(c) {
          var ans = ANSWERS[c.id] || 0;
          var cRow = el('div', { style:{ display:'flex', alignItems:'center', gap:'8px' }});
          cRow.append(
            el('span', { style:{ fontSize:'9px', fontFamily:'var(--fm)', color:'var(--mute)',
              minWidth:'64px' }}, c.id),
            el('div', { style:{ flex:'1', height:'6px', background:'var(--bg)', borderRadius:'3px', overflow:'hidden' }},
              el('div', { style:{ width:(ans>0?(ans/5*100):0)+'%', height:'100%',
                background: ans>0?scoreColor(ans):'transparent', borderRadius:'3px' }})
            ),
            el('span', { style:{ fontSize:'9px', fontFamily:'var(--fm)',
              color:ans>0?scoreColor(ans):'var(--mute)', minWidth:'16px', textAlign:'right' }},
              ans>0?'L'+ans:'·')
          );
          compsGrid.append(cRow);
        });
        subCard.append(compsGrid);
        mbody.append(subCard);
      });

      modal.append(mbody);
      overlay.append(modal);
      content.append(overlay);
    }

    content.append(buildPilarCards());
  }

  // ══════════════════════════════════════════════════════
  // SECTION: HEATMAP
  // ══════════════════════════════════════════════════════
  else if (DASHBOARD_VIEW === 'heatmap') {
    content.append(sectionTitle(
      LANG==='es'?'Heatmap de Sub-dimensiones':LANG==='pt'?'Heatmap de Sub-dimensões':'Sub-dimension Heatmap',
      LANG==='es'?'Score promedio por sub-dimensión, agrupado por pilar. Hover para detalle.':
      LANG==='pt'?'Score médio por sub-dimensão, agrupado por pilar. Hover para detalhes.':
      'Average score per sub-dimension, grouped by pillar. Hover for detail.'
    ));

    // legend
    var legend = el('div', { style:{ display:'flex', alignItems:'center', gap:'14px',
      marginBottom:'20px', flexWrap:'wrap' }});
    [
      { label:'<2.0', color:'#ef4444' },
      { label:'2.0–2.9', color:'#f97316' },
      { label:'3.0–3.4', color:'#f59e0b' },
      { label:'3.5–4.2', color:'#3b82f6' },
      { label:'>4.2', color:'#22c55e' },
      { label: LANG==='es'?'Sin datos':LANG==='pt'?'Sem dados':'No data', color:'rgba(100,116,139,0.25)' }
    ].forEach(function(leg) {
      legend.append(el('div', { style:{ display:'flex', alignItems:'center', gap:'5px' }},
        el('div', { style:{ width:'14px', height:'14px', borderRadius:'3px',
          background:leg.color, flexShrink:'0' }}),
        el('span', { style:{ fontSize:'11px', color:'var(--mute)' }}, leg.label)
      ));
    });
    content.append(legend);

    DATA.forEach(function(p, pi) {
      var pColor = PILAR_CLR[pi % PILAR_CLR.length];
      var pillarBlock = el('div', { style:{ marginBottom:'20px' }});

      // pillar header
      var phdr = el('div', { style:{
        display:'flex', alignItems:'center', gap:'10px',
        padding:'8px 12px', borderRadius:'8px 8px 0 0',
        background:pColor+'18', borderBottom:'2px solid '+pColor+'44'
      }});
      phdr.append(
        el('span', { style:{ fontSize:'11px', fontWeight:'800', fontFamily:'var(--fm)',
          color:pColor }}, p.id),
        el('span', { style:{ fontSize:'13px', fontWeight:'700', color:'var(--text)' }}, p.name)
      );
      pillarBlock.append(phdr);

      // cells
      var cellsWrap = el('div', { style:{
        display:'grid',
        gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',
        gap:'4px', padding:'8px',
        background:'var(--card)', border:'1px solid var(--brd)',
        borderTop:'none', borderRadius:'0 0 8px 8px'
      }});

      p.subs.forEach(function(s) {
        var sSum=0, sCnt=0;
        s.comps.forEach(function(c){ if(ANSWERS[c.id]){ sSum+=ANSWERS[c.id]; sCnt++; }});
        var sAvg = sCnt>0 ? sSum/sCnt : 0;
        var sCol = sAvg>0 ? scoreColor(sAvg) : 'rgba(100,116,139,0.25)';
        var sBg = sAvg>0 ? scoreBg(sAvg) : 'rgba(100,116,139,0.06)';

        var cell = el('div', { style:{
          background:sBg,
          border:'1px solid '+(sAvg>0?sCol+'55':'rgba(100,116,139,0.2)'),
          borderRadius:'6px', padding:'10px 10px 8px',
          cursor:'default', transition:'all .15s', position:'relative'
        }});

        // tooltip
        var tooltipId = 'tt-'+s.id.replace('.','_');
        cell.onmouseenter = function() {
          cell.style.transform='translateY(-2px)';
          cell.style.boxShadow='0 6px 18px rgba(0,0,0,0.25)';
          var tt = document.getElementById(tooltipId);
          if (tt) tt.style.display='block';
        };
        cell.onmouseleave = function() {
          cell.style.transform='';
          cell.style.boxShadow='';
          var tt = document.getElementById(tooltipId);
          if (tt) tt.style.display='none';
        };

        cell.append(
          el('div', { style:{ fontSize:'9px', fontFamily:'var(--fm)', color:'var(--mute)',
            marginBottom:'4px' }}, s.id),
          el('div', { style:{ fontSize:'11px', fontWeight:'600', color:sAvg>0?'var(--text)':'var(--mute)',
            lineHeight:'1.35', marginBottom:'6px', overflow:'hidden', textOverflow:'ellipsis',
            display:'-webkit-box', WebkitLineClamp:'2', WebkitBoxOrient:'vertical' }}, s.name),
          el('div', { style:{ fontSize:'20px', fontWeight:'800', fontFamily:'var(--fm)',
            color:sAvg>0?sCol:'var(--mute)' }}, sAvg>0?sAvg.toFixed(1):'—'),
          el('div', { style:{ fontSize:'9px', color:'var(--mute)', marginTop:'2px' }},
            sCnt+'/'+s.comps.length+' comps')
        );

        // tooltip popup
        var tooltip = el('div', { id:tooltipId, style:{
          display:'none', position:'absolute', zIndex:'200',
          background:'var(--card)', border:'1px solid var(--brdL)',
          borderRadius:'8px', padding:'10px 12px', bottom:'calc(100% + 6px)', left:'0',
          minWidth:'200px', maxWidth:'280px', boxShadow:'0 8px 24px rgba(0,0,0,0.4)',
          fontSize:'11px', lineHeight:'1.5', color:'var(--dim)', pointerEvents:'none'
        }});
        tooltip.append(
          el('div', { style:{ fontWeight:'700', color:'var(--text)', marginBottom:'4px' }},
            s.id+' — '+s.name),
          el('div', null, (LANG==='es'?'Score: ':LANG==='pt'?'Score: ':'Score: ')
            +( sAvg>0?sAvg.toFixed(2):(LANG==='es'?'Sin respuestas':LANG==='pt'?'Sem respostas':'No answers'))),
          el('div', null, (LANG==='es'?'Evaluados: ':LANG==='pt'?'Avaliados: ':'Evaluated: ')
            +sCnt+'/'+s.comps.length+' componentes')
        );
        cell.append(tooltip);
        cellsWrap.append(cell);
      });

      pillarBlock.append(cellsWrap);
      content.append(pillarBlock);
    });
  }

  // ══════════════════════════════════════════════════════
  // SECTION: CRITICAL GAPS
  // ══════════════════════════════════════════════════════
  else if (DASHBOARD_VIEW === 'gaps') {
    content.append(sectionTitle(
      LANG==='es'?'⚠ Brechas Críticas — Nivel 1 y 2':
      LANG==='pt'?'⚠ Lacunas Críticas — Nível 1 e 2':
      '⚠ Critical Gaps — Level 1 & 2',
      gaps.length > 0
        ? (LANG==='es'?gaps.length+' componentes en nivel crítico de madurez.':
           LANG==='pt'?gaps.length+' componentes em nível crítico de maturidade.':
           gaps.length+' components at critical maturity level.')
        : (LANG==='es'?'Sin brechas críticas detectadas. ✓':
           LANG==='pt'?'Sem lacunas críticas detectadas. ✓':
           'No critical gaps detected. ✓')
    ));

    if (gaps.length === 0) {
      content.append(el('div', { style:{
        padding:'40px', textAlign:'center', background:'rgba(34,197,94,0.08)',
        border:'1px solid rgba(34,197,94,0.25)', borderRadius:'12px'
      }},
        el('div', { style:{ fontSize:'36px', marginBottom:'12px' }}, '✓'),
        el('div', { style:{ fontSize:'15px', fontWeight:'700', color:'#22c55e' }},
          LANG==='es'?'Sin brechas críticas':LANG==='pt'?'Sem lacunas críticas':'No critical gaps')));
    } else {
      var expandedGaps = {};

      function buildGapCard(g, idx) {
        var gCol = g.score===1?'#ef4444':'#f97316';
        var isExp = !!expandedGaps[g.comp.id];

        var gCard = el('div', { style:{
          border:'1px solid var(--brd)',
          borderLeft:'4px solid '+gCol,
          borderRadius:'8px', marginBottom:'8px',
          overflow:'hidden', background:'var(--card)'
        }});

        var gRow = el('div', { style:{
          display:'flex', alignItems:'center', gap:'12px', padding:'14px 16px',
          cursor:'pointer', transition:'background .15s'
        }});
        gRow.onmouseenter = function(){ gRow.style.background='var(--hover)'; };
        gRow.onmouseleave = function(){ gRow.style.background='transparent'; };
        gRow.onclick = function() {
          expandedGaps[g.comp.id] = !expandedGaps[g.comp.id];
          var newCard = buildGapCard(g, idx);
          gCard.replaceWith(newCard);
        };

        gRow.append(
          el('div', { style:{
            width:'34px', height:'34px', borderRadius:'50%',
            background:gCol+'18', border:'2px solid '+gCol+'44',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:'11px', fontWeight:'800', fontFamily:'var(--fm)', color:gCol, flexShrink:'0'
          }}, 'L'+g.score),
          el('div', { style:{ flex:'1', minWidth:'0' }},
            el('div', { style:{ fontSize:'13px', fontWeight:'600', color:'var(--text)',
              overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }},
              g.comp.id+' · '+g.comp.name),
            el('div', { style:{ fontSize:'11px', color:'var(--mute)', fontFamily:'var(--fm)',
              marginTop:'2px' }},
              g.pilar.id+': '+g.pilar.name+' › '+g.sub.id+' '+g.sub.name)
          )
        );
        if (CORE.has(g.comp.id)) {
          gRow.append(el('span', { style:{
            fontSize:'10px', fontWeight:'700', padding:'3px 9px', borderRadius:'8px',
            background:'rgba(13,148,136,0.15)', color:'var(--teal)', flexShrink:'0'
          }}, '🔷 CORE'));
        }
        gRow.append(el('span', { style:{
          fontSize:'18px', color:'var(--mute)', flexShrink:'0',
          transition:'transform .2s', transform:isExp?'rotate(90deg)':'rotate(0deg)'
        }}, '›'));

        gCard.append(gRow);

        if (isExp) {
          var curDesc = g.comp.L[g.score-1] || (LANG==='es'?'Sin descriptor':LANG==='pt'?'Sem descritor':'No descriptor');
          var tarDesc = g.comp.L[3] || (LANG==='es'?'Sin descriptor':LANG==='pt'?'Sem descritor':'No descriptor');
          var optDesc = g.comp.L[4] || (LANG==='es'?'Sin descriptor':LANG==='pt'?'Sem descritor':'No descriptor');

          var expand = el('div', { style:{
            padding:'16px', background:'var(--bg)', borderTop:'1px solid var(--brd)'
          }});
          var descGrid = el('div', { style:{
            display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:'10px'
          }});

          [
            { label:(LANG==='es'?'📍 Actual':LANG==='pt'?'📍 Atual':'📍 Current')+' — Nivel '+g.score,
              desc:curDesc, col:gCol },
            { label:(LANG==='es'?'🎯 Objetivo':LANG==='pt'?'🎯 Meta':'🎯 Target')+' — Nivel 4',
              desc:tarDesc, col:'#3b82f6' },
            { label:(LANG==='es'?'🏆 Optimizado':LANG==='pt'?'🏆 Otimizado':'🏆 Optimized')+' — Nivel 5',
              desc:optDesc, col:'#22c55e' }
          ].forEach(function(d) {
            var dd = el('div', { style:{
              border:'1px solid '+d.col+'33', background:d.col+'08',
              borderRadius:'8px', padding:'12px 14px'
            }});
            dd.append(
              el('div', { style:{ fontSize:'10px', fontWeight:'800', color:d.col,
                textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'7px' }}, d.label),
              el('div', { style:{ fontSize:'12px', color:'var(--dim)', lineHeight:'1.65' }}, d.desc)
            );
            descGrid.append(dd);
          });
          expand.append(descGrid);
          gCard.append(expand);
        }

        return gCard;
      }

      gaps.forEach(function(g, idx) { content.append(buildGapCard(g, idx)); });
    }
  }

  // ══════════════════════════════════════════════════════
  // SECTION: MATURITY DISTRIBUTION
  // ══════════════════════════════════════════════════════
  else if (DASHBOARD_VIEW === 'distribution') {
    content.append(sectionTitle(
      LANG==='es'?'Distribución de Madurez':LANG==='pt'?'Distribuição de Maturidade':'Maturity Distribution',
      LANG==='es'?'Cuántos componentes se evaluaron en cada nivel (L1–L5).':
      LANG==='pt'?'Quantos componentes foram avaliados em cada nível (L1–L5).':
      'How many components scored at each maturity level (L1–L5).'
    ));

    var lvlCounts = [0,0,0,0,0];
    Object.values(ANSWERS).forEach(function(v){ if(v>=1&&v<=5) lvlCounts[v-1]++; });
    var lvlNames_en = ['Non-Existent','Reactive / Informal','Defined','Managed','Optimized'];
    var lvlNames_es = ['Inexistente','Reactivo / Informal','Definido','Gestionado','Optimizado'];
    var lvlNames_pt = ['Inexistente','Reativo / Informal','Definido','Gerenciado','Otimizado'];
    var lvlNames = LANG==='es'?lvlNames_es:LANG==='pt'?lvlNames_pt:lvlNames_en;
    var lvlColors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];

    var distBlock = el('div', { style:{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'28px' }});
    lvlCounts.forEach(function(cnt, i) {
      var pct = answered>0 ? cnt/answered*100 : 0;
      var row = el('div', { style:{
        background:'var(--card)', border:'1px solid var(--brd)', borderRadius:'10px',
        padding:'14px 18px', display:'flex', alignItems:'center', gap:'14px'
      }});
      row.append(
        el('div', { style:{
          width:'40px', height:'40px', borderRadius:'50%', flexShrink:'0',
          background:lvlColors[i]+'18', border:'2px solid '+lvlColors[i]+'44',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:'14px', fontWeight:'800', fontFamily:'var(--fm)', color:lvlColors[i]
        }}, String(i+1)),
        el('div', { style:{ width:'180px', flexShrink:'0' }},
          el('div', { style:{ fontSize:'13px', fontWeight:'700', color:lvlColors[i] }},
            'L'+(i+1)+' — '+lvlNames[i]),
          el('div', { style:{ fontSize:'11px', color:'var(--mute)' }},
            cnt+(LANG==='es'?' componente'+(cnt!==1?'s':''):LANG==='pt'?' componente'+(cnt!==1?'s':''):' component'+(cnt!==1?'s':'')))
        )
      );
      var barOuter = el('div', { style:{
        flex:'1', height:'32px', background:'var(--bg)', borderRadius:'8px', overflow:'hidden'
      }});
      var barInner = el('div', { style:{
        width:pct+'%', height:'100%',
        background:'linear-gradient(90deg,'+lvlColors[i]+','+lvlColors[i]+'bb)',
        borderRadius:'8px', display:'flex', alignItems:'center',
        justifyContent:'flex-end', paddingRight:'12px', transition:'width .6s ease'
      }});
      if (cnt > 0) barInner.append(el('span', { style:{
        fontSize:'12px', fontWeight:'700', color:'#fff', fontFamily:'var(--fm)'
      }}, cnt));
      barOuter.append(barInner);
      row.append(barOuter);
      row.append(el('div', { style:{
        width:'44px', textAlign:'right', fontSize:'14px', fontWeight:'700',
        color:'var(--mute)', fontFamily:'var(--fm)'
      }}, Math.round(pct)+'%'));
      distBlock.append(row);
    });
    content.append(distBlock);

    // summary stats below bars
    if (answered > 0) {
      var dominant = lvlCounts.indexOf(Math.max(...lvlCounts));
      var statRow = el('div', { style:{
        display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',
        gap:'10px', marginTop:'8px'
      }});
      [
        { label:LANG==='es'?'Total respondidas':LANG==='pt'?'Total respondidas':'Total answered',
          val:String(answered), color:'var(--teal)' },
        { label:LANG==='es'?'Nivel dominante':LANG==='pt'?'Nível dominante':'Dominant level',
          val:'L'+(dominant+1)+' — '+lvlNames[dominant], color:lvlColors[dominant] },
        { label:LANG==='es'?'% en niveles 1-2':LANG==='pt'?'% nos níveis 1-2':'% at levels 1–2',
          val:answered>0?Math.round((lvlCounts[0]+lvlCounts[1])/answered*100)+'%':'—',
          color: (lvlCounts[0]+lvlCounts[1])/answered>0.3?'#ef4444':'var(--dim)' },
        { label:LANG==='es'?'% en niveles 4-5':LANG==='pt'?'% nos níveis 4-5':'% at levels 4–5',
          val:answered>0?Math.round((lvlCounts[3]+lvlCounts[4])/answered*100)+'%':'—',
          color: (lvlCounts[3]+lvlCounts[4])/answered>0.4?'#22c55e':'var(--dim)' }
      ].forEach(function(s) {
        statRow.append(el('div', { style:{
          background:'var(--card)', border:'1px solid var(--brd)', borderRadius:'10px',
          padding:'14px', textAlign:'center'
        }},
          el('div', { style:{ fontSize:'22px', fontWeight:'800', fontFamily:'var(--fm)',
            color:s.color, marginBottom:'4px' }}, s.val),
          el('div', { style:{ fontSize:'11px', color:'var(--mute)', lineHeight:'1.4' }}, s.label)
        ));
      });
      content.append(statRow);
    }
  }

  // footer legal
  content.append(el('div', { style:{
    marginTop:'40px', paddingTop:'16px', borderTop:'1px solid var(--brd)',
    fontSize:'10px', color:'var(--mute)', textAlign:'center', lineHeight:'1.8'
  }},
    '© '+new Date().getFullYear()+' Continental Risk Advisor — All rights reserved.',
    el('br'),
    'FCMA™ Framework is exclusive intellectual property of the author. CONFIDENTIAL.'
  ));

  root.append(content);
  main.innerHTML = '';
  main.append(root);
}


function renderEditor(main){
  const left=el('div',{className:'panel panel-l'});left.append(el('div',{className:'panel-hd'},t('pilars')));
  DATA.forEach((p,i)=>{const item=el('div',{className:`pitem${ACTIVE_P===i?' on':''}`,onClick:()=>{ACTIVE_P=i;ACTIVE_S=null;render()}},el('span',{className:'pid'},p.id),el('span',{className:'pn'},p.name),el('span',{className:'badge badge-t'},String(p.subs.length)),el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deletePilar',{id:p.id}))){DATA.splice(i,1);ACTIVE_P=Math.max(0,i-1);ACTIVE_S=null;save();render()}}},'✕'));left.append(item);});
  left.append(el('button',{className:'btn btn-t',style:{marginTop:'8px'},onClick:()=>{DATA.push({id:'P'+DATA.length,name:t('newPilar'),desc:'',subs:[]});ACTIVE_P=DATA.length-1;ACTIVE_S=null;save();render();}},'+ Pilar'));
  if(!DATA.length)left.append(el('div',{className:'empty-state'},t('noData')));
  main.append(left);
  const curP=DATA[ACTIVE_P];if(!curP)return;
  const mid=el('div',{className:'panel panel-m'});
  const pidInp=el('input',{className:'inp',value:curP.id,style:{width:'60px',fontFamily:'var(--fm)',fontSize:'12px',marginBottom:'4px'}});pidInp.addEventListener('input',()=>{curP.id=pidInp.value;save()});
  const pnInp=el('input',{className:'inp',value:curP.name,style:{fontSize:'13px',fontWeight:'600',marginBottom:'4px'}});pnInp.addEventListener('input',()=>{curP.name=pnInp.value;save()});
  const pdInp=el('textarea',{className:'inp',rows:'2',value:curP.desc||'',style:{fontSize:'11px',marginBottom:'10px'},placeholder:t('description')});pdInp.addEventListener('input',()=>{curP.desc=pdInp.value;save()});
