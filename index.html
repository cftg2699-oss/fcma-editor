ades."]},{"id":"4.6.2","name":"Herramientas de visualización de grafos","L":["No se usan herramientas de visualización de grafos.","Se usan herramientas genéricas (Excel, Gephi) para visualización ad-hoc durante investigaciones.","Se usa una herramienta dedicada de visualización de grafos (Linkurious, i2 Analyst's Notebook, o similar) integrada con los datos de fraude.","La herramienta está integrada con el case management: el investigador puede explorar la red de relaciones del sujeto directamente desde el caso.","La visualización de grafos se genera automáticamente para cada alerta de alto riesgo: el analista ve la red de relaciones del cliente, beneficiarios frecuentes, dispositivos compartidos, y anomalías de red antes de abrir el caso."]}]}]},{"id":"P5","name":"Investigación, Respuesta y Recuperación","desc":"Evalúa las capacidades de investigación, respuesta ante incidentes y recuperación de pérdidas. Anclado en COSO/ACFE Principio 4.","subs":[{"id":"5.1","name":"Case Management y Herramientas","comps":[{"id":"5.1.1","name":"Herramienta de case management","L":["Los casos se gestionan por email, spreadsheets o notas manuales. Sin herramienta dedicada.","Se usa ticketing genérico (ServiceNow, Jira) adaptado, sin flujos ni campos especializados de fraude.","Herramienta dedicada (NICE Actimize, Verafin, o similar) con workflows por tipo de caso y campos específicos.","Integrada con motor de detección (alertas → casos automáticamente), con sistemas core (consulta/bloqueo desde el caso), y reportes automáticos.","Full integration: recibe alertas, enriquece con datos del cliente, sugiere tipología y acciones basándose en histórico, cierra el loop con detección (feedback automático)."]},{"id":"5.1.2","name":"Workflow por tipo de caso","L":["No existen workflows diferenciados. Todos siguen el mismo proceso genérico.","Informalmente se sabe que un ATO se investiga diferente, pero sin documentación.","Workflows documentados para al menos 3 tipos: transaccional, ATO, y fraude interno. Cada uno con pasos, SLAs y escalamiento.","Workflows para 5+ tipos con SLAs diferenciados, checklists de evidencia, y criterios de escalamiento. Se mide cumplimiento de SLA.","Workflows dinámicos: el sistema adapta pasos según complejidad (simple: fast-track <2h; complejo: investigador senior). Se mide time-to-resolution y recovery rate por tipo."]},{"id":"5.1.3","name":"Asignación de casos (automática vs. manual)","L":["Los casos se asignan manualmente por un supervisor. No hay criterios documentados.","Se asignan por rotación o disponibilidad, sin considerar complejidad ni expertise del analista.","La asignación usa al menos 2 criterios: tipo de fraude y carga de trabajo del analista. Documentado.","La asignación es automática basada en tipo de fraude, complejidad, expertise del analista, y carga actual. Se balancea la carga en tiempo real.","La asignación usa ML: predice la complejidad del caso y lo asigna al analista con mayor probabilidad de resolución rápida y correcta. Se mide la eficiencia de la asignación."]}]},{"id":"5.2","name":"Metodología de Investigación","comps":[{"id":"5.2.1","name":"Metodología formal documentada","L":["No existe metodología. Cada investigador sigue su propio proceso.","Proceso informal transmitido verbalmente, no documentado ni auditado.","Metodología documentada con: pasos, criterios de tipificación, plantillas de informe, checklist de evidencia.","Alineada con estándares ACFE. Incluye cadena de custodia, criterios de escalamiento, y revisión periódica.","Se testea con casos simulados (tabletop exercises) anualmente. Se actualiza con lecciones aprendidas. Los investigadores se evalúan con métricas de calidad."]},{"id":"5.2.2","name":"Competencia de investigadores","L":["Sin formación específica en investigación de fraude.","Experiencia práctica pero sin certificaciones ni capacitación formal reciente.","Al menos 50% del equipo tiene capacitación formal. Se aspira a certificación CFE o equivalente.","Al menos 50% tiene CFE o CAMS. Plan de capacitación continua con presupuesto.","Certificaciones múltiples (CFE, CAMS, CISA), conferencias de industria, laboratorio forense digital. Peer reviews de investigaciones."]},{"id":"5.2.3","name":"Protocolos de manejo y preservación de evidencia","L":["No existen protocolos de manejo de evidencia. La evidencia se almacena ad-hoc.","Se guarda evidencia en carpetas compartidas o emails, sin cadena de custodia formal.","Existe un protocolo documentado de cadena de custodia: quién recopiló, cuándo, cómo se preservó, y dónde se almacena. Se aplica a casos significativos.","El protocolo se aplica a todos los casos. La evidencia se almacena en un repositorio seguro con control de acceso y audit trail. Se sigue para casos que pueden escalar a law enforcement.","La preservación de evidencia cumple con estándares forenses: hash de integridad de archivos digitales, preservación de metadata, y documentación que soporta admisibilidad en proceso judicial."]},{"id":"5.2.4","name":"Criterios de escalamiento y tipificación de casos","L":["No existen criterios de escalamiento. Los casos se manejan todos al mismo nivel.","Se escalan informalmente los casos de alto monto o alta visibilidad, sin criterios documentados.","Existen criterios documentados de escalamiento: por monto (>$X), por tipo (fraude interno, PEP, empleado), por complejidad, y por impacto reputacional.","Los criterios incluyen niveles de escalamiento (analista → supervisor → head → comité → Board) con tiempos máximos por nivel. Se mide el cumplimiento.","El sistema de case management aplica automáticamente los criterios de escalamiento. Los casos que no se resuelven dentro del SLA se escalan automáticamente al siguiente nivel."]}]},{"id":"5.3","name":"Recuperación y Mitigación de Pérdidas","comps":[{"id":"5.3.1","name":"Proceso de recovery","L":["No existe proceso de recovery. Las pérdidas se asumen completamente.","Se ejecutan chargebacks (tarjetas) pero no hay recovery para otros tipos.","Proceso incluye: chargebacks, recuperación judicial, y seguro de fraude. Se trackea recovery rate.","Recovery rate por tipo y canal. Se analiza mensualmente. Equipo o función dedicada.","Modelo de decisión: para cada caso se evalúa costo de recuperación vs. probabilidad de éxito. Se optimiza ROI del esfuerzo."]},{"id":"5.3.2","name":"Contabilización de pérdidas","L":["No hay metodología clara. Los números no son confiables.","Se registran en GL codes genéricos. No se distingue gross loss, recovered, y net loss.","GL codes específicos de fraude. Se registra gross, recovered, y net loss. Se reporta mensualmente.","Se diferencia por tipo, canal y producto. Se registra fecha de detección vs. ocurrencia. Conciliación trimestral con finanzas.","Metodología completa: fraud loss + costo operativo + costo de reposición + costo de fricción = 'costo total del fraude'."]},{"id":"5.3.3","name":"Decisiones de write-off","L":["No existe un proceso formal de write-off de pérdidas de fraude. Las pérdidas quedan indefinidamente como pendientes.","Las decisiones de write-off se toman ad-hoc por finanzas, sin input del área de fraude.","Existe un proceso documentado: umbrales de write-off, autoridad de aprobación por monto, y documentación requerida. Fraude participa en la decisión.","El proceso incluye análisis de recuperabilidad antes del write-off. Se documenta la justificación. Se reporta el volumen de write-offs al comité de fraude mensualmente.","Se usa un modelo de decisión que evalúa la probabilidad de recuperación vs. el costo de perseguir. Los write-offs se analizan por tipo y canal para identificar patrones sistémicos."]}]},{"id":"5.4","name":"Comunicación y Experiencia del Cliente","comps":[{"id":"5.4.1","name":"Protocolos de notificación al cliente","L":["No existen protocolos. El cliente se entera cuando ve la transacción o el bloqueo.","Se notifica por el canal disponible, sin scripting ni tiempos definidos.","Protocolos documentados: tiempos (<X horas), canales (SMS, email, push, llamada), y scripting.","Diferenciados por tipo de fraude y segmento. Se mide NPS post-notificación y tiempo de resolución percibido.","Notificación proactiva y personalizada en real-time por canal preferido, con información específica y timeline. Se mide customer effort score."]},{"id":"5.4.2","name":"Proceso de re-emisión y restitución","L":["No existe un proceso estandarizado de re-emisión de credenciales o restitución de fondos post-fraude.","Se re-emiten tarjetas y se restituyen fondos, pero el proceso es manual y los tiempos son inconsistentes.","Proceso documentado con SLAs: re-emisión de tarjeta <48h, crédito provisional <24h, y restauración de credenciales digitales <4h.","Los SLAs se miden y se reportan. Se diferencia el proceso por segmento de cliente (retail, commercial, wealth). Se mide la satisfacción del cliente post-restitución.","Proceso automatizado: el sistema ejecuta la restitución y re-emisión automáticamente al confirmar el fraude. Se minimiza el esfuerzo del cliente. Se mide el tiempo total desde detección hasta resolución completa."]},{"id":"5.4.3","name":"Políticas de limitación de responsabilidad del cliente","L":["No existen políticas documentadas sobre la responsabilidad del cliente en casos de fraude.","Se aplica la regulación mínima (ej: Reg E) pero no hay una política propia del banco.","Existe una política documentada que define la responsabilidad del cliente por tipo de fraude y canal, alineada con regulación (Reg E, Reg Z, o equivalente local).","La política se comunica proactivamente al cliente. Se diferencia por tipo de fraude (ATO vs. APP fraud vs. fraude con tarjeta). Se revisa anualmente.","La política incluye un framework de decisión que evalúa la responsabilidad caso a caso basándose en: nivel de negligencia del cliente, controles que el banco debió aplicar, y precedentes regulatorios. Se mide la consistencia de las decisiones."]}]},{"id":"5.5","name":"Reporte Regulatorio","comps":[{"id":"5.5.1","name":"Proceso de SARs relacionados con fraude","L":["No existe proceso de SARs para fraude, o fraude no está involucrado en el filing.","Fraude refiere a compliance para SAR, sin criterios claros ni tracking.","Criterios documentados de referral. Se trackea volumen de referrals y outcome.","SLAs de referral (<24h para urgentes), feedback de compliance, y métricas de calidad.","Proceso automatizado: los casos que cumplen criterios se refieren automáticamente con evidencia. Se mide tasa de aceptación y time-to-file."]},{"id":"5.5.2","name":"Currency Transaction Reports (CTRs)","L":["No se presentan CTRs relacionados con fraude, o el equipo de fraude no está involucrado en el proceso.","Los CTRs se procesan por compliance/AML sin input del equipo de fraude.","Fraude refiere a compliance las transacciones que podrían requerir CTR cuando se detectan patrones de structuring. Se documenta.","Existe un proceso integrado: el motor de fraude identifica automáticamente patrones de structuring y los refiere a compliance para CTR con la evidencia correspondiente.","El monitoreo de structuring está integrado entre fraude y AML: los modelos comparten features y las alertas se evalúan conjuntamente. Se mide la tasa de detección de structuring."]},{"id":"5.5.3","name":"Reporte a redes de pago","L":["No se reportan casos de fraude a las redes de pago (Visa, Mastercard) más allá de los chargebacks.","Se procesan chargebacks pero no se comparte inteligencia de fraude con las redes.","Se participa en los programas de reporte de las redes (Visa VALE, MC Safety Net). Se reportan merchants de alto riesgo y patrones de fraude.","Se consume y se contribuye activamente a la inteligencia de las redes. Se usan los datos de red para calibrar reglas y modelos. Se reportan BINs comprometidos.","Se tiene un equipo o función dedicada a la relación con redes de pago. Se participa en pilotos de nuevas herramientas de la red. Se mide el impacto de la inteligencia de red en la detección."]}]},{"id":"5.6","name":"Lecciones Aprendidas y Feedback Loop","comps":[{"id":"5.6.1","name":"Proceso de post-mortem","L":["No se hacen post-mortems. Los casos se cierran sin revisión.","Solo para incidentes de muy alto impacto, de forma ad-hoc.","Proceso documentado para casos >$X o tipología nueva. Incluye: qué pasó, por qué no se detectó, qué cambiar.","Template estándar, ejecución dentro de 5 días, action items con owners y deadlines trackeados en comité.","Alimentan automáticamente inventario de esquemas, equipo de reglas/modelos, y programa de controles. Se mide time-to-remediate."]},{"id":"5.6.2","name":"Retroalimentación a detección","L":["No existe feedback de investigación a detección.","Informalmente se comentan nuevos patrones, sin proceso.","Proceso documentado: investigador completa formulario de feedback, equipo de reglas evalúa.","El feedback es sistémico: cada caso cerrado genera registro de features que alimenta desarrollo de modelos/reglas. Se mide lead time.","Feedback automático: labels de investigadores (fraud confirmed / legitimate) se inyectan al dataset de reentrenamiento. Ciclo completo cada 30 días."]}]},{"id":"5.7","name":"Resolución de Disputas","comps":[{"id":"5.7.1","name":"Procedimientos de resolución de disputas","L":["No existen procedimientos formales de resolución de disputas de fraude.","Se resuelven caso a caso sin proceso estandarizado ni tracking de plazos.","Procedimientos documentados con plazos regulatorios, procesos de reembolso, y gestión de contracargos.","Los procedimientos incluyen SLAs por tipo de disputa, tracking de cumplimiento de plazos, y reportes de aging.","Resolución automatizada para disputas simples, con análisis de patrones de disputa para detectar friendly fraud. Se mide la tasa de resolución a favor del cliente vs. banco."]}]}]},{"id":"P6","name":"Datos, Analítica y Tecnología","desc":"Evalúa la infraestructura de datos, modelos, stack tecnológico e innovación que soporta el programa de fraude.","subs":[{"id":"6.1","name":"Calidad, Linaje y Gobernanza de Datos","comps":[{"id":"6.1.1","name":"Calidad de datos de entrada","L":["No se mide la calidad de datos de entrada al motor de fraude.","Se han identificado problemas de calidad pero sin proceso de medición ni remediación.","Se miden al menos 3 dimensiones (completitud, exactitud, oportunidad) para datos clave. Se documenta.","Dashboard de calidad con umbrales de alerta. Se mide impacto de mala calidad en detección.","Data quality monitoring en real-time por campo. Se cuantifica impacto financiero de mala calidad."]},{"id":"6.1.2","name":"Linaje de datos documentado","L":["No se conoce el linaje de los datos que alimentan el motor.","Se conoce la fuente principal pero no las transformaciones ni intermediarios.","Linaje documentado para campos principales: fuente, transformaciones, frecuencia, consumidor.","Linaje completo automatizado (herramienta de data lineage). Se actualiza ante cambios de esquema.","Linaje completo automatizado y activamente usado: ante incidente se traza a la fuente en minutos. Impact analysis pre-cambios."]},{"id":"6.1.3","name":"Governance de datos para fraude","L":["No existe governance de datos específica para fraude.","Se aplica la governance general del banco pero sin consideraciones específicas de fraude.","Existe data ownership y stewardship definido para los datasets de fraude. Diccionario de datos disponible.","Governance incluye procesos de remediación de calidad, aprobación de nuevos campos, y revisión periódica del diccionario.","Governance madura: data contracts con upstream, SLAs de calidad, y los data stewards participan en el comité de fraude."]},{"id":"6.1.4","name":"Procesos de remediación de calidad de datos","L":["No existen procesos de remediación cuando se identifican problemas de calidad.","Se remedian problemas de datos ad-hoc cuando causan errores visibles en el motor de fraude.","Existe un proceso documentado: identificación del problema, root cause, remediación, y validación. Se trackean los incidentes de calidad.","Los incidentes de calidad se clasifican por severidad, tienen SLA de remediación, y se escalan si no se resuelven a tiempo. Se mide la recurrencia.","Existe un programa de mejora continua de calidad de datos: se analizan patrones de incidentes, se implementan controles preventivos en los pipelines de datos, y se mide la mejora año a año."]}]},{"id":"6.2","name":"Arquitectura de Datos e Integración","comps":[{"id":"6.2.1","name":"Repositorio de datos de fraude","L":["Datos dispersos en múltiples sistemas sin repositorio centralizado.","Repositorio parcial (ej: base de alertas del vendor) que no consolida todas las fuentes.","Data warehouse o data lake que consolida alertas, investigaciones, pérdidas y reglas. Se usa para reporting.","Fuente de verdad: integra detección, investigación, pérdidas y recovery. Se usa para desarrollo de modelos y benchmark.","Data lake unificado en arquitectura moderna (cloud, lake house) con datos de fraude, AML y cyber. Feature store compartido."]},{"id":"6.2.2","name":"Enriquecimiento de datos","L":["No se enriquecen los datos de transacciones con fuentes externas.","Al menos una fuente de enriquecimiento (geolocalización de IP o device fingerprint).","3+ fuentes: device fingerprint, geolocalización, bureau, y al menos una de consortium.","Enriquecimiento en real-time para scoring. Se evalúa periódicamente el valor de cada fuente.","Stack completo: device intelligence, behavioral biometrics, email/phone risk scoring, dark web, consortium bidireccional. Se mide marginal lift de cada fuente."]},{"id":"6.2.3","name":"Integración cross-channel y cross-sistema","L":["Los datos de fraude vienen de sistemas aislados. No hay integración entre canales ni con sistemas core.","Hay integración parcial (ej: tarjetas + core bancario) pero canales digitales, call center u otros están desconectados.","Existe integración con al menos 4 fuentes: core bancario, canales digitales, tarjetas, y call center. Los datos fluyen al motor de fraude.","Integración completa cross-channel con latencia conocida y monitoreada. Se incluyen fuentes de open banking y APIs de terceros.","Integración en real-time con todas las fuentes vía event streaming (Kafka o similar). Cada evento del cliente llega al motor de fraude en <100ms independientemente del canal de origen."]},{"id":"6.2.4","name":"Disponibilidad de datos real-time vs. batch","L":["Todos los datos de fraude están disponibles solo en batch (D+1 o posterior).","Los datos transaccionales están en near-real-time (<1h) pero los datos de contexto (perfil, historial) solo en batch.","Los datos transaccionales y de perfil del cliente están disponibles en real-time para el scoring. Los datos analíticos están en batch.","Arquitectura dual: real-time para detección (transacciones + perfil + features) y batch para analytics/reporting. Se monitorea la latencia de cada pipeline.","Feature store unificado que sirve features tanto en real-time (<50ms) como en batch. Se garantiza feature consistency entre training (batch) e inference (real-time)."]}]},{"id":"6.3","name":"Ciclo de Vida de Modelos ML","comps":[{"id":"6.3.1","name":"Inventario de modelos","L":["No existe inventario. No se sabe cuántos modelos hay en producción.","Se conocen los principales informalmente pero sin inventario formal con metadata.","Inventario formal con: nombre, propósito, tipo, fecha de deployment, owner, y estado.","Además: performance metrics actuales, fecha de última validación, tiering, y próxima validación programada.","Model registry automatizado: se actualiza en cada deployment, integra métricas de producción en real-time, genera alertas de vencimiento. Se audita anualmente."]},{"id":"6.3.2","name":"Model risk tiering","L":["No se clasifican los modelos por nivel de riesgo.","Se reconoce informalmente que algunos son más críticos, pero sin clasificación formal.","Clasificados en al menos 3 tiers (alto, medio, bajo) basados en impacto financiero y alcance.","El tiering determina: frecuencia de validación, profundidad de documentación, nivel de aprobación, frecuencia de monitoring.","Se calibra anualmente con datos de impacto real. Se usa para priorizar recursos. Tier-1 tiene validación anual independiente obligatoria."]},{"id":"6.3.3","name":"Proceso de desarrollo estandarizado","L":["No existe proceso estandarizado. Cada data scientist desarrolla modelos a su manera.","Hay una guía informal pero no se sigue consistentemente ni se audita.","Proceso documentado con etapas: problem statement, data exploration, feature engineering, model selection, training, validation, documentation, deployment.","El proceso incluye peer review obligatorio, checklist de documentación (alineado con OCC/SR 11-7), testing con datos out-of-time, y sign-off de governance antes de producción.","MLOps pipeline automatizado: version control de datos y código, automated training, automated testing (performance, bias, stability), automated documentation, y CI/CD para deployment."]},{"id":"6.3.4","name":"Monitoreo continuo de modelos en producción","L":["No se monitorean los modelos una vez desplegados.","Se revisa performance manualmente de forma esporádica.","Se monitorea mensualmente: AUC, KS, detection rate, FP rate por modelo.","Monitoreo automatizado con alertas: feature drift (PSI >0.1), performance degradation (AUC drop >X%), data quality, y score distribution changes.","Framework completo de model monitoring con automated retraining triggers, A/B testing continuo, concept drift detection, y dashboards de health por modelo. Se ejecuta backtesting mensual automatizado."]},{"id":"6.3.5","name":"Proceso de retiro/reemplazo de modelos","L":["No existe proceso de retiro. Los modelos obsoletos quedan en producción indefinidamente.","Se retiran modelos ad-hoc cuando se reemplazan, pero sin proceso formal ni documentación.","Existe un proceso documentado de retiro: criterios de retiro (performance degradation, obsolescencia), aprobación, plan de transición, y documentación del retiro.","El retiro requiere aprobación de governance, un período de shadow scoring paralelo con el modelo sucesor, y validación de que el reemplazo no degrada la detección.","El ciclo de vida completo (desarrollo → deployment → monitoring → retiro) está gestionado en el model registry. Se mantiene un archive de modelos retirados con su performance histórica para auditoría."]}]},{"id":"6.4","name":"Stack Tecnológico y Gestión de Vendors","comps":[{"id":"6.4.1","name":"Inventario de herramientas","L":["No existe inventario de herramientas de fraude.","Se conocen las principales pero sin inventario formal con licenciamiento y soporte.","Inventario formal: herramienta, vendor, propósito, licencia, soporte, costo anual, fecha de renovación.","Incluye evaluación: performance, satisfacción del usuario, gaps funcionales, alternativas evaluadas.","Evaluación anual de vendors: performance vs. SLA, roadmap, costo-beneficio, benchmark vs. alternativas."]},{"id":"6.4.2","name":"Riesgo de concentración de vendor","L":["La dependencia de vendors no se evalúa como riesgo.","Se reconoce dependencia del vendor principal pero sin evaluación de alternativas.","Se ha evaluado el riesgo y existe plan de contingencia para el vendor principal.","Para cada vendor crítico: plan de contingencia, portabilidad evaluada, vendor alternativo identificado.","Vendor stress test anual. Contratos con cláusulas de portabilidad y código fuente en escrow."]},{"id":"6.4.3","name":"Gestión de contratos y SLAs con vendors de tecnología","L":["No se gestionan activamente los contratos con vendors de fraude.","Se renuevan contratos automáticamente sin evaluación de performance ni renegociación.","Los contratos tienen SLAs de performance documentados (uptime, latencia, soporte). Se revisan en cada renovación.","Se mide el cumplimiento de SLAs mensualmente. Los incumplimientos se escalan formalmente. Se negocia basándose en performance real.","Se usa un framework de evaluación de vendors que incluye: performance vs. SLA, roadmap alignment, costo total de ownership, riesgo de concentración, y benchmark vs. alternativas. Se presenta al comité anualmente."]}]},{"id":"6.5","name":"Infraestructura, Escalabilidad y Performance","comps":[{"id":"6.5.1","name":"Capacidad de escalar","L":["No se ha evaluado la capacidad de escalar ante picos.","Se sabe que hay limitaciones pero sin cuantificación ni pruebas.","Load testing ejecutado al menos una vez. Se conoce throughput máximo.","Load tests trimestrales. Soporta 2x pico normal. Se monitorea capacidad con alertas.","Stress tests 5–10x volumen normal. Auto-scaling configurado. Capacity planning a 12 meses."]},{"id":"6.5.2","name":"Disponibilidad y disaster recovery","L":["No se conoce RTO/RPO. No hay DR específico para el motor de fraude.","Se sabe que depende de la infraestructura general, pero no tiene DR propio.","Plan de DR con RTO y RPO definidos. Documentado.","DR testeado anualmente. RTO <4 horas. Failover automático o semi-automático.","RTO <1 hora, RPO <15 minutos. Failover automático probado trimestralmente. Modo degradado (reglas básicas) disponible."]},{"id":"6.5.3","name":"Monitoreo de performance en producción (latencia, throughput)","L":["No se monitorea la performance del motor de fraude en producción.","Se revisa performance cuando hay quejas o incidentes de lentitud.","Se monitorean métricas clave: latencia P50/P95/P99, throughput (TPS), y uptime. Se tienen umbrales de alerta.","Se monitorea en real-time con dashboards. Las alertas de performance se escalan automáticamente. Se ejecutan análisis de tendencia para capacity planning.","Se tienen SLOs (Service Level Objectives) por canal: ej. P99 latencia <100ms para PIX, <200ms para tarjetas. Se mide el error budget. Se ejecutan performance tests antes de cada release."]}]},{"id":"6.6","name":"Innovación y Tecnologías Emergentes","comps":[{"id":"6.6.1","name":"Proceso de evaluación de nuevas tecnologías","L":["No existe proceso de evaluación de nuevas tecnologías para fraude.","Se evalúan ad-hoc cuando un vendor las presenta.","Proceso documentado: identificación, evaluación de fit con POC, business case.","Fraud lab o sandbox con datos reales anonimizados. Al menos 2 POCs/año.","Roadmap de innovación con presupuesto. Se evalúan behavioral biometrics, GenAI, graph neural networks. Se mide ROI de cada POC."]},{"id":"6.6.2","name":"PCI y cifrado","L":["No se han evaluado los controles de cifrado de datos de fraude en tránsito y en reposo.","Se depende del cifrado general del banco sin validación específica para datos de fraude.","Los datos de fraude sensibles (PAN, tokens) están cifrados en tránsito y en reposo conforme a PCI DSS.","Se audita el cumplimiento PCI anualmente. Los controles de cifrado son específicos para el motor de fraude y se testean.","Cifrado end-to-end con gestión de llaves dedicada, tokenización de datos sensibles en el data lake de fraude, y auditoría PCI continua."]},{"id":"6.6.3","name":"Seguimiento de tendencias tecnológicas","L":["No se hace seguimiento de tendencias tecnológicas en fraude.","Se asiste a alguna conferencia o webinar, pero sin proceso de seguimiento.","Se mantiene un radar de tecnologías emergentes para fraude, actualizado semestralmente, con evaluación de relevancia para el banco.","El radar se presenta al comité de fraude. Se priorizan al menos 2 tecnologías por año para evaluación profunda (POC o pilot).","Se tiene un innovation council que incluye fraude, tecnología y data science. Se evalúan: GenAI adversarial (deepfakes, voice cloning), behavioral biometrics, graph ML, y privacy-enhancing technologies (PETs). Se asigna presupuesto de innovación."]}]}]},{"id":"P7","name":"Gestión de Desempeño, Reporte y Mejora Continua","desc":"Evalúa la medición de resultados, reporting, benchmarking y evolución del programa. Anclado en COSO/ACFE Principio 5.","subs":[{"id":"7.1","name":"Framework de KRIs, KPIs y Métricas","comps":[{"id":"7.1.1","name":"Set de métricas definidas","L":["No existe set definido de métricas. Se reportan números ad-hoc.","Se miden 1–2 métricas básicas (pérdidas totales y número de casos) sin formalización.","Set documentado de al menos 10 métricas: fraud loss rate, detection rate, FP rate, time-to-detect, time-to-resolve, recovery rate, etc.","Cubren 4 dimensiones: operativas, financieras, de cliente y cross-funcionales. Cada métrica con definición, fórmula, fuente, frecuencia, owner y umbral.","Dashboard automatizado actualizado diariamente. Se usan para gestión operativa. Revisión de relevancia anual."]},{"id":"7.1.2","name":"Traducción del riesgo en dinero","L":["No se cuantifica el impacto económico del programa.","Se reporta pérdida total pero sin conexión con ROI de controles ni impacto al cliente.","Se cuantifica: gross loss, net loss, y costo operativo del programa.","Además: pérdida evitada, costo de falsos positivos, y ROI del programa.","Modelo económico que traduce cada punto de madurez en impacto USD. Se presenta al CFO y Board con lenguaje financiero."]},{"id":"7.1.3","name":"KPIs operativos de fraude","L":["No se miden KPIs operativos de fraude.","Se mide solo el volumen de alertas y casos, sin desglose ni benchmark.","Se miden al menos: fraud loss rate (bps), detection rate, false positive rate, time-to-detect, y time-to-resolve. Con definición y fuente documentadas.","Los KPIs operativos se desglosan por canal, producto, tipo de fraude, y turno. Se establecen targets y se mide la desviación mensualmente.","Los KPIs operativos se monitorean en real-time con alertas automáticas ante desviaciones. Se usa SPC (Statistical Process Control) para distinguir variación normal de señales de alerta."]},{"id":"7.1.4","name":"KPIs financieros de fraude","L":["No se miden KPIs financieros del programa de fraude.","Se reporta la pérdida total de fraude (gross loss), pero sin desglose ni conexión con el programa.","Se miden: gross loss, net loss (post-recovery), costo operativo del programa (personal + tecnología + vendors), y pérdida evitada.","Se calcula el ROI del programa: (pérdida evitada - costo del programa) / costo del programa. Se reporta al CFO trimestralmente.","Se usa un modelo de costo total del fraude que incluye: fraud loss + costo operativo + costo de fricción (revenue perdido por FP) + costo reputacional. Se traduce cada punto de madurez en impacto USD."]},{"id":"7.1.5","name":"KPIs de cliente y experiencia","L":["No se miden KPIs de impacto al cliente del programa de fraude.","Se conocen las quejas de clientes por bloqueos, pero no se cuantifican como KPI del programa.","Se miden: transacciones legítimas declinadas (%), tasa de contacto por falso positivo, y NPS post-evento de fraude.","Se mide además: customer effort score post-fraude, tiempo total de resolución percibido, y revenue perdido por declinaciones legítimas. Se presenta al comité junto con métricas de detección.","Se usa un modelo de lifetime value impact: se cuantifica la pérdida de LTV por cliente afectado por un falso positivo vs. la pérdida por fraude no detectado. Se usa para calibrar umbrales de detección."]},{"id":"7.1.6","name":"KPIs cross-funcionales","L":["No se miden KPIs de colaboración entre fraude y otras áreas.","Se conocen informalmente los tiempos de respuesta de IT o de negocio, pero no se miden.","Se miden al menos 2 SLAs cross-funcionales: fraude-IT (tiempo de deployment de reglas) y fraude-ops (tiempo de resolución de alertas).","Se miden SLAs con todas las áreas clave: IT, operaciones, compliance, negocio, y legal. Se reportan al comité de fraude mensualmente.","Los KPIs cross-funcionales son bidireccionales: fraude mide a IT y IT mide a fraude. Se usan para mejora continua y se vinculan con la evaluación de desempeño de los líderes."]}]},{"id":"7.2","name":"Reporte a Management y Board","comps":[{"id":"7.2.1","name":"Frecuencia y formato de reporting","L":["No existe reporte periódico de fraude a management.","Reporte anual o ad-hoc, en formato de documento largo sin visualizaciones.","Reporte trimestral con dashboard visual, tendencias, y comparación con período anterior.","Reportes mensuales operativos + trimestrales ejecutivos. Dashboard interactivo, exception-based, action items.","Reporting continuo: dashboard real-time para operaciones, mensual para management, trimestral para Board. Se mide accionabilidad del reporte."]},{"id":"7.2.2","name":"Contenido y calidad del reporte","L":["Los reportes (si existen) contienen solo datos crudos sin análisis.","Los reportes muestran métricas básicas pero sin tendencias, comparación con períodos anteriores, ni action items.","Los reportes incluyen: métricas clave, tendencias (MoM, YoY), comparación con período anterior, top-N incidentes, y estado de iniciativas.","Los reportes son exception-based: destacan desviaciones vs. umbrales, incluyen root cause analysis de desviaciones, y terminan con action items asignados con deadline.","Los reportes son diferenciados por audiencia: operativo (diario, para el equipo), táctico (mensual, para management), estratégico (trimestral, para Board). Se mide la accionabilidad: % de action items implementados en el siguiente período."]},{"id":"7.2.3","name":"Reporte de incidentes significativos","L":["No existe un proceso de reporte de incidentes significativos de fraude.","Se reportan incidentes significativos ad-hoc, sin formato ni criterios de qué constituye 'significativo'.","Existen criterios documentados de incidente significativo (monto >$X, tipo, impacto reputacional) y un proceso de notificación con SLA (<24h a management, <48h a Board si aplica).","El reporte de incidente incluye: descripción, impacto financiero, root cause preliminary, acciones inmediatas, y plan de remediación. Se trackea hasta cierre.","Se ejecuta un post-incident review formal para cada incidente significativo. Los hallazgos alimentan: la evaluación de riesgo, las reglas/modelos, y la política de fraude. Se mide el time-to-remediate."]}]},{"id":"7.3","name":"Testing Independiente y Auditoría","comps":[{"id":"7.3.1","name":"Alcance de auditoría interna","L":["Auditoría interna no cubre el programa de fraude.","Fraude está en el universo de auditoría pero no se ha auditado en 2+ años.","Se audita al menos cada 2 años con alcance definido.","Auditoría anual que cubre governance, detección, investigación, reporting y 3LoD. Se trackean hallazgos.","Auditoría continua: además de periódica, 2LoD testea controles trimestralmente. Hallazgos con aging reports y escalamiento al Board si >90 días."]},{"id":"7.3.2","name":"Auditorías externas o revisiones independientes","L":["No se han realizado auditorías externas del programa de fraude.","Se ha incluido fraude en el alcance de una auditoría regulatoria, pero no se ha solicitado una revisión externa voluntaria.","Se ha ejecutado al menos una revisión externa del programa de fraude en los últimos 3 años (consultora, firma de auditoría, o regulador).","Se ejecutan revisiones externas bienales. Los hallazgos se trackean y se reportan al comité de fraude y al Board.","Se ejecutan revisiones externas anuales que incluyen: assessment de madurez, benchmark vs. peers, y recomendaciones priorizadas. Los resultados se usan para actualizar el roadmap."]},{"id":"7.3.3","name":"Tracking de hallazgos y remediación","L":["No se trackean los hallazgos de auditoría de fraude de forma centralizada.","Se trackean los hallazgos de la auditoría más reciente, pero no hay un histórico ni aging report.","Existe un tracker centralizado con: hallazgo, severidad, owner, plan de remediación, fecha comprometida, y estado.","El tracker se reporta mensualmente al comité de fraude. Se mide: aging (días abierto), closure rate, y recurrencia de hallazgos. Los >90 días se escalan al Board.","El tracker está integrado con el sistema de auditoría del banco. Se ejecuta root cause analysis de hallazgos recurrentes. Los patrones de hallazgos alimentan la priorización del roadmap."]}]},{"id":"7.4","name":"Benchmarking Externo Multi-Nivel","comps":[{"id":"7.4.1","name":"Benchmark por peer group","L":["No se hace benchmark contra peers. No se conoce la posición relativa.","Datos anecdóticos de peers (conferencias) pero sin benchmark estructurado.","Se participa en al menos una encuesta de industria (ACFE, Gartner, FEBRABAN) y se comparan resultados.","Benchmark multi-dimensional: fraud loss rate, detection rate, FP rate, costo operativo vs. peers del mismo tamaño.","Benchmark multi-nivel: peers regionales, globales (G-SIBs), target regulatorio, y best-in-class por pilar. Se usa para target-setting."]},{"id":"7.4.2","name":"Benchmark interno (tendencia temporal propia)","L":["No se trackea la evolución temporal de las métricas de fraude del banco.","Se comparan resultados vs. el año anterior, pero sin análisis de tendencia ni visualización.","Se mantiene un histórico de al menos 3 años de las métricas principales. Se visualiza la tendencia y se analizan los drivers de cambio.","El benchmark interno se desglosa por pilar, producto, canal y tipo de fraude. Se identifican áreas de mejora y de deterioro. Se presenta al comité trimestralmente.","Se usa análisis estadístico de tendencia (ej: control charts, regression) para distinguir variación normal de cambios estructurales. Se proyectan métricas a 12 meses y se ajustan targets."]},{"id":"7.4.3","name":"Participación en encuestas y datos de industria","L":["No se participa en encuestas de industria sobre fraude.","Se consumen reportes públicos de industria (ACFE Report to the Nations) pero no se participa activamente.","Se participa en al menos 1 encuesta de industria (ACFE, ABA, FEBRABAN, Gartner) y se comparan los resultados del banco vs. el benchmark.","Se participa en múltiples encuestas y se consume benchmark de vendors (FICO consortium, Actimize, Visa/MC network data). Se usan los datos para target-setting.","Se es contribuidor activo en la comunidad: se comparten datos (anonimizados), se participa en paneles, y se usan múltiples fuentes de benchmark para triangular la posición del banco."]}]},{"id":"7.5","name":"Evolución del Programa y Roadmap","comps":[{"id":"7.5.1","name":"Roadmap plurianual","L":["No existe roadmap. Se opera año a año sin visión de largo plazo.","Lista de proyectos para el año, sin dependencias, priorización ni vinculación estratégica.","Roadmap a 2+ años con iniciativas priorizadas, timeline, presupuesto estimado y owners.","Vinculado con estrategia de negocio y gap analysis del assessment. Se revisa semestralmente con comité.","Se gestiona como programa con PMO: tracking de avance, budget vs. actual, risk register, y beneficios realizados vs. proyectados. Se reporta al Board."]},{"id":"7.5.2","name":"Gestión del cambio y comunicación de la evolución","L":["No existe gestión del cambio para las iniciativas del programa de fraude.","Los cambios se implementan sin plan de comunicación ni gestión de impacto.","Existe un plan de comunicación para cambios mayores del programa. Se notifica a las áreas impactadas con anticipación.","Se ejecuta gestión del cambio formal para cada iniciativa del roadmap: stakeholder analysis, plan de comunicación, capacitación, y medición de adopción.","Se usa un framework de change management (ej: ADKAR) para las transformaciones del programa. Se mide la adopción post-cambio y se ajusta la estrategia de comunicación basándose en feedback."]}]}]},{"id":"P8","name":"Integración Cross-Funcional e Inteligencia","desc":"Evalúa la convergencia entre fraude, ciberseguridad, AML, legal e IT. Anclado en McKinsey Fraud-Cyber convergence models.","subs":[{"id":"8.1","name":"Convergencia Fraude-Ciberseguridad","comps":[{"id":"8.1.1","name":"Modelo operativo actual","L":["Silos completos. No comparten información, herramientas ni procesos.","Reuniones esporádicas pero sin compartición sistemática de datos ni procesos conjuntos.","Compartición de inteligencia: alertas de cyber se refieren a fraude cuando tienen componente financiero, y viceversa. Documentado.","Feeds bidireccionales, reuniones semanales, y al menos 2 casos de uso compartidos (ej: ATO).","Equipo o función de cyber-fraud fusion con personal dedicado. Plataforma compartida, data lake, y KPIs conjuntos."]},{"id":"8.1.2","name":"Compartición de inteligencia fraude-cyber","L":["No se comparte inteligencia entre fraude y ciberseguridad.","Se comparten informalmente hallazgos cuando alguien considera relevante, sin proceso.","Existe un proceso documentado de compartición: alertas de phishing/malware se refieren a fraude, y alertas de ATO se refieren a cyber.","Se comparten feeds de inteligencia bidireccionales: IoCs de cyber se integran como features en el scoring de fraude, y patrones de fraude se comparten con el SOC.","Se tiene un threat intelligence platform compartido que correlaciona señales de fraude y cyber en tiempo real. Se mide la detección conjunta que ninguna función lograría sola."]},{"id":"8.1.3","name":"Casos de uso compartidos y operaciones conjuntas","L":["No existen casos de uso compartidos entre fraude y cyber.","Se reconoce que ATO tiene componente de fraude y cyber, pero se investiga en silos.","Se han definido al menos 3 casos de uso compartidos (ej: ATO, phishing→fraude, malware→credential theft) con protocolos de coordinación.","Se ejecutan operaciones conjuntas para casos complejos: un investigador de fraude y uno de cyber trabajan el mismo caso. Se tienen war rooms conjuntos para incidentes.","Existe un equipo de cyber-fraud fusion con personal dedicado de ambas funciones. Se tienen métricas de detección conjunta y se ejecutan threat hunting exercises combinados."]}]},{"id":"8.2","name":"Coordinación Fraude-AML/BSA","comps":[{"id":"8.2.1","name":"Compartición de alertas y datos","L":["No comparten alertas ni datos. Sistemas y bases completamente separados.","Se refieren casos manualmente para SAR, sin compartición sistemática.","Proceso de referral documentado con criterios claros. Se comparten alertas con componente cruzado (ej: mule accounts).","Se comparten datos, alertas y tipologías. Comité conjunto de financial crime. Tipologías compartidas.","Convergencia FRAML: data lake compartido, modelos con features fraude + AML, scoring conjunto, governance unificada."]},{"id":"8.2.2","name":"Tipologías compartidas y data sharing","L":["Fraude y AML no comparten tipologías ni datos.","Se refieren casos manualmente cuando se sospecha lavado vinculado a fraude.","Se comparten tipologías documentadas: mule accounts, structuring post-fraude, fraud proceeds laundering. Se documenta.","Existe data sharing automatizado: las alertas de fraude que involucran mule accounts se refieren automáticamente a AML con la evidencia. Se usan tipologías compartidas para calibrar modelos.","Data lake compartido de financial crime: los modelos de fraude y AML consumen features comunes. Se ejecutan modelos FRAML que detectan patrones que ninguna función detecta sola."]},{"id":"8.2.3","name":"Comité conjunto de financial crime","L":["No existe un espacio conjunto entre fraude y AML.","Se tienen reuniones ad-hoc cuando surge un caso cruzado.","Existe una reunión mensual conjunta fraude-AML para revisar casos cruzados, compartir inteligencia, y coordinar acciones.","Existe un comité formal de financial crime que incluye fraude, AML, compliance, y cyber. Con charter, actas, y action items tracked.","El comité de financial crime tiene poder de decisión sobre la estrategia integrada de financial crime. Se reporta al Board como una función unificada."]}]},{"id":"8.3","name":"Alineación Fraude-Legal y Compliance","comps":[{"id":"8.3.1","name":"Marco legal para acción de fraude","L":["No existe coordinación con Legal para casos de fraude.","Se involucra a Legal solo en casos de muy alto impacto, reactivamente.","Protocolo documentado de cuándo involucrar a Legal con umbrales y pasos a seguir.","Legal participa en comité. Marco de decisión para: denuncia penal, acción civil, recovery judicial, reporte regulatorio. Se trackean outcomes.","Playbook de acciones legales por tipo con análisis costo-beneficio. Se mide recovery legal. Legal participa en diseño de controles para admisibilidad de evidencia."]},{"id":"8.3.2","name":"Compliance review del programa de fraude","L":["Compliance no revisa el programa de fraude.","Compliance revisa aspectos regulatorios cuando hay una auditoría, pero no de forma proactiva.","Compliance ejecuta una revisión anual del programa de fraude para validar cumplimiento regulatorio.","La revisión de compliance incluye: mapeo de requisitos regulatorios, testing de controles clave, y recomendaciones. Los hallazgos se trackean.","Compliance participa como 2LoD activa: ejecuta challenge independiente de las decisiones de fraude, valida la adherencia a la política, y reporta al Board su assessment independiente."]}]},{"id":"8.4","name":"Alineación Fraude-IT/Tecnología","comps":[{"id":"8.4.1","name":"Fraud by design en desarrollo de productos","L":["IT/Producto no involucra a fraude en desarrollo de productos digitales.","Fraude se involucra después del diseño, generalmente en testing o post-lanzamiento.","Fraude participa en fase de requerimientos. Se documenta assessment pre-lanzamiento.","Checklist de 'fraud by design' en cada sprint/release. Es un gate obligatorio.","Fraude embebido en equipo de producto (embedded SME). Controles como parte del producto. Se mide fraude a 90 días post-lanzamiento."]},{"id":"8.4.2","name":"SLAs de IT para soporte del motor de fraude","L":["No existen SLAs de IT para el soporte del motor de fraude.","IT soporta el motor de fraude 'best effort', sin SLAs formales.","Existen SLAs documentados: tiempo de deployment de reglas (<24h urgente, <5 días normal), soporte de incidentes (P1 <1h, P2 <4h), y disponibilidad (99.9%).","Los SLAs se miden mensualmente y se reportan al comité de fraude. Los incumplimientos se escalan formalmente.","Los SLAs incluyen: deployment pipeline automatizado (CI/CD para reglas y modelos), monitoring proactivo con alertas a IT y fraude simultáneamente, y postmortem conjunto para cada incidente P1."]},{"id":"8.4.3","name":"Participación de fraude en evaluación de nuevas tecnologías","L":["Fraude no participa en la evaluación de nuevas tecnologías o canales del banco.","Fraude es notificado después de que se selecciona una nueva tecnología, sin poder de input.","Fraude participa en el proceso de evaluación de nuevas tecnologías que impactan canales de pago o acceso a cuentas.","Fraude tiene un checklist de evaluación de riesgo que se aplica a cada nueva tecnología o canal. Es un gate obligatorio antes de implementación.","Fraude tiene un 'technology risk radar' que evalúa proactivamente el riesgo de fraude de tecnologías emergentes (biometría, open banking APIs, IoT payments) antes de que el banco las adopte."]}]},{"id":"8.5","name":"Inteligencia Externa y Compartición de Información","comps":[{"id":"8.5.1","name":"Participación en consorcios","L":["No participa en consorcios de intercambio de información.","Consume información de una fuente externa pero no participa activamente.","Participa en al menos 1 consorcio (FS-ISAC, consortium del vendor, asociación local) y consume activamente.","Participa y contribuye: comparte datos anonimizados, participa en grupos de trabajo.","Contribuidor activo en múltiples consorcios. Se mide valor recibido vs. aportado. La inteligencia alimenta directamente reglas y modelos."]},{"id":"8.5.2","name":"Relación con law enforcement","L":["No existe relación formal con law enforcement para fraude.","Se contacta solo ante casos de muy alto impacto, ad-hoc.","Relación documentada con al menos una agencia, con contactos y protocolo de comunicación.","Relaciones con múltiples agencias. Referrals regulares con tracking de outcomes. Participación en task forces.","Relación bidireccional activa: el banco comparte inteligencia proactivamente, law enforcement comparte alertas tempranas. Se miden outcomes (arrestos, recuperaciones)."]},{"id":"8.5.3","name":"Contribución activa vs. consumo pasivo de inteligencia","L":["El banco solo consume inteligencia. No contribuye a la comunidad.","El banco comparte información mínima requerida (ej: chargebacks obligatorios a la red).","El banco contribuye datos anonimizados a al menos un consorcio y participa en grupos de trabajo de la industria.","El banco es reconocido como contribuidor activo: lidera o co-lidera grupos de trabajo, presenta en conferencias de industria, y comparte inteligencia proactivamente.","El banco opera un programa de contribución estructurado: mide el ratio contribución/consumo, tiene un budget de comunidad, y sus contribuciones han generado mejoras documentadas en la detección de la industria."]}]}]}];

var LOADED_LANG = null; // tracks which language content is currently loaded
var BASE_URL = window.location.href.replace(/\/[^\/]*$/,'/'); // base URL for fetching .md files

function loadLangContent(lang, callback) {
  // In editor mode (?mode != assess), don't auto-fetch — use whatever is loaded
  if(!IS_CLIENT) { if(callback) callback(); return; }
  // If already loaded for this lang, skip
  if(LOADED_LANG === lang) { if(callback) callback(); return; }
  // Try to fetch the .md for this language from the repo
  var mdFile = lang === 'en' ? 'fcma_en.md' : lang === 'pt' ? 'fcma_pt.md' : 'fcma_es.md';
  fetch(BASE_URL + mdFile)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(text){
      importMD(text);
      LOADED_LANG = lang;
      if(callback) callback();
    })
    .catch(function(){
      // Fallback: if no translated .md exists, use INIT_DATA (Spanish)
      if(LOADED_LANG !== 'es') {
        DATA = JSON.parse(JSON.stringify(INIT_DATA));
        CORE = new Set(INIT_CORE_ARR);
        LOADED_LANG = 'es';
      }
      if(callback) callback();
    });
}

function switchLang(lng) {
  LANG = lng;
  localStorage.setItem('fcma_lang', lng);
  if(IS_CLIENT) {
    loadLangContent(lng, function(){ render(); });
  } else {
    render();
  }
}

// ── IMPORT MD ──
function importMD(text) {
  const pilars = [];
  let curP = null, curS = null, curC = null;
  const newCore = new Set();
  for (const line of text.split('\n')) {
    const pm = line.match(/^# (P\d+):\s*(.+)/);
    if (pm) { curP = { id: pm[1], name: pm[2].trim(), desc: '', subs: [] }; pilars.push(curP); curS = curC = null; continue; }
    if (curP && !curP.desc && line.startsWith('*') && line.endsWith('*')) { curP.desc = line.slice(1,-1); continue; }
    const sm = line.match(/^## (\d+\.\d+)\s*[—–-]\s*(.+)/);
    if (sm && curP) { curS = { id: sm[1], name: sm[2].trim(), comps: [] }; curP.subs.push(curS); curC = null; continue; }
    const cm = line.match(/^### (?:🔷\s*CORE\s*·\s*)?(\d+\.\d+\.\d+)\s*·\s*(.+)/);
    if (cm && curS) {
      if (line.includes('🔷 CORE')) newCore.add(cm[1]);
      curC = { id: cm[1], name: cm[2].trim(), L: [] }; curS.comps.push(curC); continue;
    }
    const lm = line.match(/^\|\s*\*\*(\d)\*\*\s*\|\s*(.+?)\s*\|$/);
    if (lm && curC) { curC.L.push(lm[2]); continue; }
  }
  pilars.forEach(p => p.subs.forEach(s => s.comps.forEach(c => { while (c.L.length < 5) c.L.push(''); })));
  DATA = pilars;
  CORE = newCore;
  ACTIVE_P = pilars.length > 0 ? 0 : null;
  ACTIVE_S = null;
  save();
  render();
}

// ── EXPORT MD ──
function exportMD() {
  let md = '# FINANCIAL CRIME MATURITY ASSESSMENT\n\n## MÓDULO A: FRAUD RISK MANAGEMENT PROGRAM\n\n---\n\n';
  let tC=0, tS=0;
  DATA.forEach(p=>{tS+=p.subs.length;p.subs.forEach(s=>tC+=s.comps.length)});
  md += `**${DATA.length} Pilares · ${tS} Sub-dimensiones · ${tC} Componentes · ${CORE.size} Core**\n\n---\n\n`;
  DATA.forEach(p=>{
    md += `# ${p.id}: ${p.name}\n\n`;
    if(p.desc)md+=`*${p.desc}*\n\n`;
    p.subs.forEach(s=>{
      md+=`## ${s.id} — ${s.name}\n\n`;
      s.comps.forEach(c=>{
        md+=`### ${CORE.has(c.id)?'🔷 CORE · ':''}${c.id} · ${c.name}\n\n`;
        md+='| Nivel | Descriptor |\n|:---:|:---|\n';
        c.L.forEach((l,i)=>{md+=`| **${i+1}** | ${l} |\n`});
        md+='\n';
      });
    });
    md+='---\n\n';
  });
  downloadFile(md, 'FCMA_Assessment.md', 'text/markdown');
}

function exportJSON() {
  var payload = {version:'2.0',data:DATA,core:[...CORE],answers:ANSWERS};
  if(REG_DATA) payload.registration = REG_DATA;
  downloadFile(JSON.stringify(payload,null,2), 'FCMA_Assessment.json', 'application/json');
}

function downloadFile(content, name, type) {
  const b = new Blob([content],{type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

function getScores() {
  const sc = {};
  DATA.forEach(p => {
    let sum = 0, cnt = 0;
    p.subs.forEach(s => s.comps.forEach(c => {
      if (ANSWERS[c.id]) { sum += ANSWERS[c.id]; cnt++; }
    }));
    sc[p.id] = cnt > 0 ? sum / cnt : 0;
  });
  let tSum = 0, tCnt = 0;
  Object.values(sc).forEach(v => { if (v > 0) { tSum += v; tCnt++; } });
  sc._total = tCnt > 0 ? tSum / tCnt : 0;
  return sc;
}

    wrap.append(regBanner);

  // Big score with ring
  var bigRingR=52, bigRingC=2*Math.PI*bigRingR, bigRingOff=bigRingC*(1-(tot/5));
  var bigRing = '<svg width="140" height="140" viewBox="0 0 140 140" style="margin:0 auto 16px;display:block"><circle cx="70" cy="70" r="'+bigRingR+'" fill="none" stroke="'+totCol+'18" stroke-width="8"/><circle cx="70" cy="70" r="'+bigRingR+'" fill="none" stroke="'+totCol+'" stroke-width="8" stroke-dasharray="'+bigRingC+'" stroke-dashoffset="'+bigRingOff+'" stroke-linecap="round" transform="rotate(-90 70 70)" class="progress-ring"/><text x="70" y="78" text-anchor="middle" font-size="42" font-weight="800" font-family="var(--fm)" fill="'+totCol+'">'+(tot>0?tot.toFixed(1):'—')+'</text></svg>';
  sc.append(el('div',{innerHTML:bigRing,style:{position:'relative'}}));
  sc.append(el('div',{style:{fontSize:'16px',color:'var(--dim)',position:'relative'}},answered+' '+t('of')+' '+totalQ+' '+t('evaluated')+' ('+Math.round(answered/totalQ*100)+'%)'));
  if(answered>0)sc.append(el('div',{style:{marginTop:'18px',position:'relative'}},el('button',{className:'btn btn-r',style:{padding:'10px 24px'},onClick:function(){if(confirm(t('deleteAllShort'))){ANSWERS={};AQ_IDX=0;AQ_HIGHEST=0;AQ_VIEW='quiz';AQ_STARTED=false;save();render()}}},'🗑 '+t('restart'))));

  rd.append(el('p',{style:{fontSize:'13px',color:'var(--mute)',marginBottom:'24px'}},t('pillarBarDesc')));

      cell.onmouseenter=function(){cell.style.transform='translateY(-2px)'};
      cell.onmouseleave=function(){cell.style.transform=''};
      cell.append(el('div',{style:{fontSize:'11px',color:'var(--mute)',marginBottom:'5px',lineHeight:'1.3'}},s.id+' '+s.name));
      cell.append(el('div',{style:{fontSize:'22px',fontWeight:'800',fontFamily:'var(--fm)',color:avg>0?col:'var(--mute)'}},avg>0?avg.toFixed(1):'—'));
      cell.append(el('div',{style:{fontSize:'10px',color:'var(--mute)',marginTop:'2px'}},cnt+'/'+s.comps.length+' '+t('evaluated')));
      grid.append(cell);
    });
    hm.append(grid);
  });
  wrap.append(hm);

  // GAPS
  var gaps=[];
  DATA.forEach(function(p){p.subs.forEach(function(s){s.comps.forEach(function(c2){ if(ANSWERS[c2.id]&&ANSWERS[c2.id]<=2)gaps.push({comp:c2,score:ANSWERS[c2.id],pilar:p.id,pname:p.name,sub:s.id+' '+s.name}) })})});
  gaps.sort(function(a,b){return a.score-b.score});
  if(gaps.length>0){
    var gd=el('div',{className:'stat-card-anim',style:{background:'var(--card)',border:'1px solid var(--brd)',borderRadius:'16px',padding:'32px',marginBottom:'28px',animationDelay:'.3s'}});
    gd.append(el('h3',{style:{fontSize:'22px',fontWeight:'800',marginBottom:'6px',color:CLR[0],letterSpacing:'-0.3px'}},t('criticalGaps')));
    gd.append(el('p',{style:{fontSize:'13px',color:'var(--mute)',marginBottom:'20px'}},tf('criticalGapsDesc',{n:gaps.length})));
    gaps.slice(0,20).forEach(function(g){
      var col2=g.score===1?CLR[0]:CLR[1];
      gd.append(el('div',{style:{display:'flex',alignItems:'center',gap:'14px',padding:'14px 0',borderBottom:'1px solid var(--brd)'}},
        el('div',{style:{minWidth:'42px',height:'42px',borderRadius:'50%',background:col2+'20',border:'2px solid '+col2+'44',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',fontWeight:'800',color:col2}},String(g.score)),
        el('div',{style:{flex:'1'}},el('div',{style:{fontSize:'15px',fontWeight:'600'}},g.comp.id+' · '+g.comp.name),el('div',{style:{fontSize:'13px',color:'var(--mute)',marginTop:'2px'}},g.pilar+' '+g.pname+' › '+g.sub))
      ));
    });
    wrap.append(gd);
  }

  // MATURITY DISTRIBUTION
  var lvls=[0,0,0,0,0];
  Object.values(ANSWERS).forEach(function(v){if(v>=1&&v<=5)lvls[v-1]++});
  if(answered>0){
    var md2=el('div',{className:'stat-card-anim',style:{background:'var(--card)',border:'1px solid var(--brd)',borderRadius:'16px',padding:'32px',marginBottom:'28px',animationDelay:'.4s'}});
    md2.append(el('h3',{style:{fontSize:'22px',fontWeight:'800',marginBottom:'20px',letterSpacing:'-0.3px'}},t('maturityDist')));
    lvls.forEach(function(cnt,i){
      var pct2=answered>0?cnt/answered*100:0;
      md2.append(el('div',{style:{display:'flex',alignItems:'center',gap:'14px',marginBottom:'12px'}},
        el('div',{style:{width:'140px',textAlign:'right',fontSize:'13px',color:CLR[i],fontWeight:'700'}},'L'+(i+1)+' — '+getLBL()[i]),
        el('div',{style:{flex:'1',height:'28px',background:'var(--bg)',borderRadius:'8px',overflow:'hidden'}},el('div',{style:{height:'100%',borderRadius:'8px',width:pct2+'%',background:CLR[i],display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'10px',fontSize:'12px',fontWeight:'700',color:'var(--wh)'}},cnt>0?String(cnt):'')),
        el('div',{style:{width:'55px',textAlign:'center',fontSize:'14px',color:'var(--mute)',fontWeight:'600'}},Math.round(pct2)+'%')
      ));
    });
    wrap.append(md2);
  }

  wrap.append(el('div',{style:{textAlign:'center',marginTop:'24px'}},el('button',{className:'btn btn-t',style:{padding:'16px 40px',fontSize:'16px',fontWeight:'700',borderRadius:'10px',boxShadow:'0 4px 20px rgba(13,148,136,0.2)'},onClick:exportJSON},t('exportResults'))));
  wrap.append(el('div',{style:{textAlign:'center',marginTop:'28px',padding:'16px',fontSize:'10px',color:'var(--mute)',borderTop:'1px solid var(--brd)'}},tf('copyright',{y:new Date().getFullYear()})));
  main.append(wrap);
}

function renderEditor(main) {
  // LEFT PANEL - Pilars
  const left = el('div',{className:'panel panel-l'});
  left.append(el('div',{className:'panel-hd'},t('pilars')));
  DATA.forEach((p,i) => {
    const item = el('div',{className:`pitem${ACTIVE_P===i?' on':''}`,onClick:()=>{ACTIVE_P=i;ACTIVE_S=null;render()}},
      el('span',{className:'pid'},p.id),
      el('span',{className:'pn'},p.name),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deletePilar',{id:p.id}))){DATA.splice(i,1);ACTIVE_P=Math.max(0,i-1);ACTIVE_S=null;save();render()}}},'✕')
    );
    left.append(item);
  });
  left.append(el('button',{className:'btn btn-t',style:{marginTop:'8px'},onClick:()=>{
    DATA.push({id:'P'+DATA.length,name:t('newPilar'),desc:'',subs:[]});
    ACTIVE_P=DATA.length-1;ACTIVE_S=null;save();render();
  }},'+ Pilar'));
  if(!DATA.length) left.append(el('div',{className:'empty-state'},
    el('div',{style:{fontSize:'13px',color:'var(--dim)',marginBottom:'8px'}},t('noData')),
    el('div',{style:{fontSize:'11px',color:'var(--mute)'}},t('import'))
  ));
  main.append(left);

  const curP = DATA[ACTIVE_P];
  if (!curP) return;

  // MIDDLE PANEL - Subs
  const mid = el('div',{className:'panel panel-m'});
  // Pilar editable
  const pidInp = el('input',{className:'inp',value:curP.id,style:{width:'60px',fontFamily:'var(--fm)',fontSize:'12px',marginBottom:'4px'}});
  pidInp.addEventListener('input',()=>{curP.id=pidInp.value;save()});
  const pnInp = el('input',{className:'inp',value:curP.name,style:{fontSize:'13px',fontWeight:'600',marginBottom:'4px'}});
  pnInp.addEventListener('input',()=>{curP.name=pnInp.value;save()});
  const pdInp = el('textarea',{className:'inp',rows:'2',value:curP.desc||'',style:{fontSize:'11px',marginBottom:'10px'},placeholder:t('description')});
  pdInp.addEventListener('input',()=>{curP.desc=pdInp.value;save()});
  mid.append(pidInp,pnInp,pdInp);
  mid.append(el('div',{className:'panel-hd'},'Sub-dimensiones ('+curP.subs.length+')'));

  curP.subs.forEach((s,i) => {
    const item = el('div',{className:`pitem${ACTIVE_S===i?' on':''}`,onClick:()=>{ACTIVE_S=i;render()}},
      el('span',{style:{fontSize:'10px',fontFamily:'var(--fm)',color:'var(--tealL)',minWidth:'24px'}},s.id),
      el('span',{className:'pn'},s.name),
      el('span',{className:'badge badge-t'},String(s.comps.length)),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deleteSub',{id:s.id}))){curP.subs.splice(i,1);ACTIVE_S=null;save();render()}}},'✕')
    );
    mid.append(item);
  });
  mid.append(el('button',{className:'btn btn-t',style:{marginTop:'8px'},onClick:()=>{
    const sid=curP.id.replace('P','')+'.'+String(curP.subs.length+1);
    curP.subs.push({id:sid,name:t('newSub'),comps:[]});
    ACTIVE_S=curP.subs.length-1;save();render();
  }},'+ Sub-dimensión'));
  main.append(mid);

  // RIGHT PANEL - Components
  const right = el('div',{className:'panel-r'});
  const curS = curP.subs[ACTIVE_S];

  if (!curS) {
    right.append(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'var(--mute)'}},t('selectSub')));
    main.append(right);
    return;
  }

  // Sub header
  const shdr = el('div',{style:{display:'flex',gap:'10px',alignItems:'center',marginBottom:'10px'}});
  const sidI = el('input',{className:'inp',value:curS.id,style:{width:'60px',fontFamily:'var(--fm)'}});
  sidI.addEventListener('input',()=>{curS.id=sidI.value;save()});
  const snI = el('input',{className:'inp',value:curS.name,style:{flex:'1',fontWeight:'600'}});
  snI.addEventListener('input',()=>{curS.name=snI.value;save()});
  shdr.append(sidI,snI,el('span',{className:'badge badge-b'},curS.comps.length+' comps'));
  right.append(shdr);

  // Search
  const srch = el('input',{className:'inp',placeholder:t('searchComp'),value:SEARCH,style:{marginBottom:'12px'}});
  srch.addEventListener('input',()=>{SEARCH=srch.value;render()});
  right.append(srch);

  // Components
  const colors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];
  const labels = getLBL();

  curS.comps.forEach((c,ci) => {
    if (SEARCH && !c.id.toLowerCase().includes(SEARCH.toLowerCase()) && !c.name.toLowerCase().includes(SEARCH.toLowerCase())) return;
    const isCore = CORE.has(c.id);
    const isExp = EXPANDED.has(c.id);
    const card = el('div',{className:`ccard${isCore?' core':''}`});

    // Header
    const chd = el('div',{className:'ccard-hd',onClick:()=>{if(EXPANDED.has(c.id))EXPANDED.delete(c.id);else EXPANDED.add(c.id);render()}},
      el('span',{className:'cid'},c.id),
      ...(isCore?[el('span',{className:'badge badge-t'},'CORE')]:[]),
      el('span',{className:'cn'},c.name),
      el('button',{className:'btn btn-g btn-sm',onClick:e=>{e.stopPropagation();if(CORE.has(c.id))CORE.delete(c.id);else CORE.add(c.id);save();render()}},isCore?'★':'☆'),
      el('button',{className:'btn btn-r btn-sm',onClick:e=>{e.stopPropagation();if(confirm(tf('deleteComp',{id:c.id}))){curS.comps.splice(ci,1);save();render()}}},'✕'),
      el('span',{className:`arrow${isExp?' open':''}`},'▾')
    );
    card.append(chd);

    if (isExp) {
      const body = el('div',{className:'ccard-body'});
      const row1 = el('div',{style:{display:'flex',gap:'10px',margin:'10px 0 12px'}});
      const ciI = el('input',{className:'inp',value:c.id,style:{width:'90px',fontFamily:'var(--fm)'}});
      ciI.addEventListener('input',()=>{c.id=ciI.value;save()});
      const cnI = el('input',{className:'inp',value:c.name,style:{flex:'1'}});
      cnI.addEventListener('input',()=>{c.name=cnI.value;save()});
      row1.append(ciI,cnI);
      body.append(row1);

      // Levels
      c.L.forEach((lv,li) => {
        const lvDiv = el('div',{className:'lvl'});
        lvDiv.append(el('div',{className:'lvl-n',style:{background:colors[li]}},String(li+1)));
        const lvRight = el('div',{style:{flex:'1'}});
        lvRight.append(el('div',{className:'lvl-label',style:{color:colors[li]}},'L'+(li+1)+' — '+labels[li]));
        const ta = el('textarea',{className:'inp',rows:'2',value:lv,placeholder:tf('descLevel',{n:li+1})});
        ta.addEventListener('input',()=>{c.L[li]=ta.value;save()});
        lvRight.append(ta);
        lvDiv.append(lvRight);
        body.append(lvDiv);
      });
      card.append(body);
    }
    right.append(card);
  });

  right.append(el('button',{className:'btn btn-t',style:{marginTop:'12px'},onClick:()=>{
    const cid=curS.id+'.'+(curS.comps.length+1);
    curS.comps.push({id:cid,name:t('newComp'),L:['','','','','']});
    EXPANDED.add(cid);save();render();
  }},'+ Componente'));

  main.append(right);
}

function renderPreview(main) {
  const pv = el('div',{className:'preview'});
  pv.append(el('h1',null,'Financial Crime Maturity Assessment'));
  const st = getStats();
  pv.append(el('p',{style:{color:'var(--dim)',fontSize:'14px',marginBottom:'24px'}},
    `${st.pilars} Pilares · ${st.subs} Sub-dimensiones · ${st.comps} Componentes · ${st.core} Core`));

  const colors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];
  DATA.forEach(p => {
    pv.append(el('h2',null,p.id+': '+p.name));
    if(p.desc) pv.append(el('p',{style:{color:'var(--mute)',fontSize:'13px',fontStyle:'italic',margin:'0 0 12px'}},p.desc));
    p.subs.forEach(s => {
      pv.append(el('h3',null,s.id+' — '+s.name));
      s.comps.forEach(c => {
        const isCore = CORE.has(c.id);
        const div = el('div',{className:`comp${isCore?' core':''}`});
        div.append(el('div',{className:'comp-hd'},
          ...(isCore?[el('span',{style:{color:'var(--teal)',marginRight:'6px'}},'🔷 CORE')]:[]),
          el('span',{style:{fontFamily:'var(--fm)',color:'var(--mute)',marginRight:'8px'}},c.id),
          c.name
        ));
        const tbl = el('table'); const tb = el('tbody');
        c.L.forEach((l,i) => {
          tb.append(el('tr',null,
            el('td',{className:'ln',style:{color:colors[i]}},String(i+1)),
            el('td',{style:{color:'var(--dim)'}},l)
          ));
        });
        tbl.append(tb); div.append(tbl); pv.append(div);
      });
    });
  });
  main.append(pv);
}

function renderStats(main) {
  const sv = el('div',{className:'stats'});
  sv.append(el('h2',null,t('statsTitle')));
  const st = getStats();
  const grid = el('div',{className:'sgrid'});
  [[t('pilars'),st.pilars,'var(--teal)'],[t('subs'),st.subs,'var(--tealL)'],[t('comps'),st.comps,'#3b82f6'],[t('core'),st.core,'var(--amb)']].forEach(([l,v,c])=>{
    grid.append(el('div',{className:'scard',style:{borderTop:`3px solid ${c}`}},
      el('div',{className:'sv',style:{color:c}},String(v)),
      el('div',{className:'sl'},l)
    ));
  });
  sv.append(grid);

  sv.append(el('h3',{style:{fontSize:'16px',fontWeight:'600',margin:'0 0 12px'}},t('detailByPillar')));
  const tbl = el('table',{className:'stable'});
  const thead = el('thead');
  const thr = el('tr');
  [t('pilar'),t('name'),t('subs'),t('comps'),t('core'),t('completeness')].forEach((h,i)=>{
    thr.append(el('th',{style:{textAlign:i>1?'center':'left'}},h));
  });
  thead.append(thr); tbl.append(thead);
  const tbody = el('tbody');
  DATA.forEach(p=>{
    let pc=0,pcr=0,filled=0,total=0;
    p.subs.forEach(s=>s.comps.forEach(c=>{pc++;if(CORE.has(c.id))pcr++;c.L.forEach(l=>{total++;if(l.trim())filled++})}));
    const pct=total?Math.round(filled/total*100):0;
    const tr=el('tr');
    tr.append(
      el('td',{style:{fontFamily:'var(--fm)',color:'var(--teal)',fontWeight:'700'}},p.id),
      el('td',null,p.name),
      el('td',{style:{textAlign:'center'}},String(p.subs.length)),
      el('td',{style:{textAlign:'center'}},String(pc)),
      el('td',{style:{textAlign:'center'}},el('span',{className:'badge badge-t'},String(pcr))),
      el('td',{style:{textAlign:'center'}},
        el('div',{className:'pbar'},el('div',{className:'pbar-fill',style:{width:pct+'%',background:pct===100?'var(--grn)':pct>80?'var(--teal)':'var(--amb)'}})),
        el('div',{style:{fontSize:'10px',color:'var(--mute)',marginTop:'2px'}},pct+'%')
      )
    );
    tbody.append(tr);
  });
  tbl.append(tbody); sv.append(tbl);

  sv.append(el('div',{style:{marginTop:'28px',padding:'16px',background:'var(--card)',borderRadius:'var(--r)',border:'1px solid var(--brd)'}},
    el('h4',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'6px'}},t('totalDesc')),
    el('p',{style:{fontSize:'13px',color:'var(--dim)'},innerHTML:
      tf('totalDescText',{c:st.comps,t:st.comps*5})
    })
  ));
  main.append(sv);
}

// ── INIT ──
load();
if(IS_CLIENT) {
  loadLangContent(LANG, function(){ render(); });
} else {
  render();
}
</script>
