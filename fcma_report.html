<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FCMA Executive Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        slate: { 850: '#1a2744' }
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');
  * { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .font-mono, .mono { font-family: 'IBM Plex Mono', monospace !important; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  @media print { .no-print { display: none !important; } body { background: white !important; } }
  .watermark-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    opacity: 0.025; overflow: hidden;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 100px; transform: rotate(-25deg);
    font-size: 26px; font-weight: 800; letter-spacing: 6px;
    font-family: 'IBM Plex Mono', monospace; color: #e2e8f0;
  }
  .sidebar-item { transition: all 0.15s ease; }
  .sidebar-item.active { border-left: 3px solid #10b981; }
  .animate-fade { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .donut-arc { transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1); }
  .bar-fill { transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ── CONSTANTS ──────────────────────────────────────────────
const MATURITY_LEVELS = [
  { min:0,    max:1.49, level:1, name:'Non-Existent',  color:'#ef4444', bg:'rgba(239,68,68,0.12)',  desc:'The fraud program has no formal structure. Decisions are reactive and ad hoc. Significant regulatory and financial exposure.' },
  { min:1.5,  max:2.49, level:2, name:'Reactive',      color:'#f97316', bg:'rgba(249,115,22,0.12)', desc:'Basic controls exist but are informal and undocumented. The program responds to incidents rather than preventing them.' },
  { min:2.5,  max:3.49, level:3, name:'Defined',       color:'#f59e0b', bg:'rgba(245,158,11,0.12)', desc:'Core processes are documented and repeatable. Governance structures are in place. Gaps remain in ML detection and threat intelligence.' },
  { min:3.5,  max:4.24, level:4, name:'Managed',       color:'#3b82f6', bg:'rgba(59,130,246,0.12)', desc:'The program is metrics-driven and proactively managed. Detection includes ML models. Benchmarking and continuous improvement are established.' },
  { min:4.25, max:5.0,  level:5, name:'Optimized',     color:'#22c55e', bg:'rgba(34,197,94,0.12)',  desc:'Best-in-class program with real-time adaptive controls, full cross-functional convergence, and continuous optimization.' },
];
const PILAR_COLORS = ['#0d9488','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#ef4444','#22c55e','#06b6d4','#6366f1'];

function getMaturity(s) {
  return MATURITY_LEVELS.find(m => s >= m.min && s <= m.max) || MATURITY_LEVELS[0];
}
function scoreColor(s) {
  if (!s || s <= 0) return '#64748b';
  if (s < 2) return '#ef4444';
  if (s < 3) return '#f97316';
  if (s < 3.5) return '#f59e0b';
  if (s < 4.25) return '#3b82f6';
  return '#22c55e';
}
function scoreBg(s) {
  if (!s || s <= 0) return 'rgba(100,116,139,0.08)';
  if (s < 2) return 'rgba(239,68,68,0.1)';
  if (s < 3) return 'rgba(249,115,22,0.1)';
  if (s < 3.5) return 'rgba(245,158,11,0.1)';
  if (s < 4.25) return 'rgba(59,130,246,0.1)';
  return 'rgba(34,197,94,0.1)';
}
function levelBadge(s) {
  const c = scoreColor(s);
  return { color: c, bg: scoreBg(s), border: c + '44' };
}

// ── DATA LOADER ────────────────────────────────────────────
function loadFCMAData() {
  try {
    const data    = JSON.parse(localStorage.getItem('fcma_data')  || 'null');
    const answers = JSON.parse(localStorage.getItem('fcma_answers') || '{}');
    const core    = JSON.parse(localStorage.getItem('fcma_core')  || '[]');
    const reg     = JSON.parse(localStorage.getItem('fcma_reg')   || 'null');
    return { data, answers, core: new Set(core), reg };
  } catch(e) {
    return { data: null, answers: {}, core: new Set(), reg: null };
  }
}

// ── SCORE ENGINE ───────────────────────────────────────────
function computeScores(data, answers) {
  if (!data) return { pillarScores: {}, globalScore: 0, totalQ: 0, answered: 0 };
  let totalQ = 0, answeredCount = 0, globalSum = 0, globalCnt = 0;
  const pillarScores = {};
  data.forEach(p => {
    let pSum = 0, pCnt = 0;
    p.subs.forEach(s => s.comps.forEach(c => {
      totalQ++;
      if (answers[c.id]) { answeredCount++; pSum += answers[c.id]; pCnt++; }
    }));
    pillarScores[p.id] = pCnt > 0 ? pSum / pCnt : 0;
    if (pCnt > 0) { globalSum += pillarScores[p.id]; globalCnt++; }
  });
  return {
    pillarScores,
    globalScore: globalCnt > 0 ? globalSum / globalCnt : 0,
    totalQ,
    answered: answeredCount,
  };
}

// ── COMPONENTS ─────────────────────────────────────────────

function Donut({ score, color, size = 180 }) {
  const r = size * 0.38, stroke = size * 0.065;
  const C = 2 * Math.PI * r;
  const fill = score > 0 ? C * (score / 5) : 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color+'18'} strokeWidth={stroke}/>
      {score > 0 && (
        <circle
          cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
          strokeWidth={stroke}
          strokeDasharray={`${fill.toFixed(2)} ${(C-fill).toFixed(2)}`}
          strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}
          filter="url(#glow)"
          className="donut-arc"
        />
      )}
      <text x={size/2} y={size/2 - size*0.05} textAnchor="middle"
        fontSize={size*0.22} fontWeight="800" fill={score > 0 ? color : '#64748b'}
        style={{fontFamily:'IBM Plex Mono,monospace'}}>
        {score > 0 ? score.toFixed(1) : '—'}
      </text>
      <text x={size/2} y={size/2 + size*0.09} textAnchor="middle"
        fontSize={size*0.065} fill="#64748b" fontWeight="600">
        out of 5.0
      </text>
      <text x={size/2} y={size/2 + size*0.18} textAnchor="middle"
        fontSize={size*0.058} fill="#475569">
        {score > 0 ? `${Math.round((score/5)*100)}% capacity` : 'No data'}
      </text>
    </svg>
  );
}

function PillarBar({ pillar, score, answered, total, color, onClick }) {
  const pct = score > 0 ? (score / 5) * 100 : 0;
  return (
    <div
      onClick={onClick}
      className="group p-3 rounded-xl border border-slate-700 hover:border-slate-500 bg-slate-800/40 hover:bg-slate-800 cursor-pointer transition-all"
    >
      <div className="flex justify-between items-center mb-2 gap-2">
        <span className="text-xs font-bold text-slate-200 group-hover:text-white truncate flex-1" style={{maxWidth:'70%'}}>
          {pillar.id}: {pillar.name.split(' ').slice(0,4).join(' ')}{pillar.name.split(' ').length > 4 ? '…' : ''}
        </span>
        <span className="text-sm font-extrabold mono shrink-0" style={{color: score > 0 ? color : '#475569'}}>
          {score > 0 ? score.toFixed(1) : '—'}
        </span>
      </div>
      <div className="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden mb-1.5">
        <div className="h-full rounded-full bar-fill" style={{width:`${pct}%`, background:`linear-gradient(90deg,${color},${color}bb)`}}/>
      </div>
      <div className="flex justify-between text-[10px] text-slate-500">
        <span>Target 4.0+</span>
        <span>{answered}/{total} evaluated</span>
      </div>
    </div>
  );
}

function ScoreChip({ val }) {
  if (!val || val <= 0) return <span className="inline-block px-2 py-0.5 text-xs mono font-bold rounded border border-slate-600 text-slate-500 bg-slate-800">—</span>;
  const c = scoreColor(val);
  return (
    <span className="inline-block px-2.5 py-1 text-xs mono font-bold rounded border"
      style={{color: c, background: scoreBg(val), borderColor: c+'44'}}>
      {val.toFixed(1)}
    </span>
  );
}

// ── PAGES ──────────────────────────────────────────────────

function PageOverview({ data, answers, scores, reg, core, onDrillPillar }) {
  const { pillarScores, globalScore, totalQ, answered } = scores;
  const maturity = getMaturity(globalScore);
  const completionPct = totalQ > 0 ? Math.round(answered / totalQ * 100) : 0;

  // Response distribution
  const dist = [0,0,0,0,0];
  Object.values(answers).forEach(v => { if(v>=1&&v<=5) dist[v-1]++; });
  const distLabels = ['L1 — Non-Existent','L2 — Reactive','L3 — Defined','L4 — Managed','L5 — Optimized'];
  const distColors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];

  // Radar SVG
  const N = data.length;
  const aStep = (2 * Math.PI) / N;
  const SW=480, SH=420, cx=SW/2, cy=SH/2-10, maxR=135;
  function rPt(i, val, maxVal) {
    const a = aStep * i - Math.PI/2;
    const r = (val / maxVal) * maxR;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  const rings = [1,2,3,4,5].map(lv => {
    const pts = data.map((_,i) => { const p=rPt(i,lv,5); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ');
    const isTarget = lv === 4;
    return <polygon key={lv} points={pts} fill="none"
      stroke={isTarget ? 'rgba(13,148,136,0.5)' : 'rgba(71,85,105,0.3)'}
      strokeWidth={isTarget ? '1.5' : '0.8'}
      strokeDasharray={isTarget ? '5,4' : undefined}/>;
  });
  const axes = data.map((_,i) => {
    const ep = rPt(i,5,5);
    return <line key={i} x1={cx} y1={cy} x2={ep.x.toFixed(1)} y2={ep.y.toFixed(1)}
      stroke="rgba(71,85,105,0.35)" strokeWidth="0.8"/>;
  });
  const targetPts = data.map((_,i) => { const p=rPt(i,4,5); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ');
  const hasData = Object.keys(answers).length > 0;
  const scorePts = data.map((p,i) => { const s=pillarScores[p.id]||0; const pp=rPt(i,Math.max(s,0.05),5); return `${pp.x.toFixed(1)},${pp.y.toFixed(1)}`; }).join(' ');
  const dots = data.map((p,i) => {
    const s = pillarScores[p.id]||0;
    if(!s) return null;
    const dp = rPt(i,s,5);
    return <circle key={p.id} cx={dp.x.toFixed(1)} cy={dp.y.toFixed(1)} r="5"
      fill={scoreColor(s)} stroke="#0f172a" strokeWidth="2"/>;
  });
  const labels = data.map((p,i) => {
    const lp = rPt(i, 5.75, 5);
    let anchor = 'middle';
    if (lp.x < cx - 12) anchor = 'end';
    else if (lp.x > cx + 12) anchor = 'start';
    const s = pillarScores[p.id]||0;
    const lc = s > 0 ? scoreColor(s) : '#64748b';
    const short = p.id + ': ' + p.name.split(' ').slice(0,2).join(' ');
    return (
      <g key={p.id}>
        <text x={lp.x.toFixed(1)} y={lp.y.toFixed(1)} textAnchor={anchor}
          fontSize="9.5" fontWeight="700" fill={lc} fontFamily="IBM Plex Sans,sans-serif">{short}</text>
        {s>0 && <text x={rPt(i,5.75+0.5,5).x.toFixed(1)} y={rPt(i,5.75+0.5,5).y.toFixed(1)}
          textAnchor={anchor} fontSize="8.5" fill={lc+'bb'}
          fontFamily="IBM Plex Mono,monospace">{s.toFixed(1)}</text>}
      </g>
    );
  });

  return (
    <div className="space-y-6 animate-fade">
      {/* Hero row */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Score card */}
        <div className="lg:col-span-4 bg-slate-900 rounded-2xl border border-slate-700 p-6 flex flex-col justify-between relative overflow-hidden">
          <div className="absolute inset-0 opacity-5 flex items-center justify-center">
            <div className="text-8xl">🛡</div>
          </div>
          <div className="relative z-10">
            <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest block">Evaluation Target</span>
            <h4 className="font-extrabold text-white text-lg mt-0.5">
              {reg ? reg.company : 'Assessment Results'}
            </h4>
            {reg && <p className="text-slate-400 text-xs mt-1">{reg.contact} · {reg.role}</p>}
          </div>
          <div className="flex flex-col items-center my-4 relative z-10">
            <Donut score={globalScore} color={maturity.color} size={180}/>
            <div className="mt-3 px-4 py-1.5 rounded-full font-bold text-sm border-2"
              style={{color: maturity.color, background: maturity.bg, borderColor: maturity.color+'44'}}>
              {maturity.name}
            </div>
          </div>
          <p className="text-slate-400 text-xs italic leading-relaxed relative z-10 border-t border-slate-700 pt-3">
            "{maturity.desc}"
          </p>
        </div>

        {/* Pillar bars */}
        <div className="lg:col-span-8 bg-slate-900 rounded-2xl border border-slate-700 p-6">
          <div className="flex justify-between items-center mb-4">
            <div>
              <h3 className="font-bold text-white text-lg">Maturity Score by Pillar</h3>
              <p className="text-slate-400 text-xs">Click any pillar to inspect sub-dimensions</p>
            </div>
            <span className="text-[10px] bg-slate-800 border border-slate-600 px-2.5 py-1 rounded font-bold uppercase tracking-wider text-slate-400">
              {answered}/{totalQ} answered · {completionPct}%
            </span>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {data.map((p,i) => {
              const s = pillarScores[p.id]||0;
              let pAns=0,pTot=0;
              p.subs.forEach(sub => sub.comps.forEach(c => { pTot++; if(answers[c.id]) pAns++; }));
              return (
                <PillarBar key={p.id} pillar={p} score={s}
                  answered={pAns} total={pTot}
                  color={PILAR_COLORS[i % PILAR_COLORS.length]}
                  onClick={() => onDrillPillar(p)}/>
              );
            })}
          </div>
          {/* Legend */}
          <div className="flex flex-wrap gap-4 mt-4 pt-3 border-t border-slate-700 text-[10px] text-slate-500 justify-center">
            {[['#ef4444','L1 < 2.0'],['#f97316','L2 2.0–2.9'],['#f59e0b','L3 3.0–3.4'],['#3b82f6','L4 3.5–4.2'],['#22c55e','L5 > 4.2']].map(([c,l]) => (
              <div key={l} className="flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-full" style={{background:c}}/>
                <span>{l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Radar + Distribution */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        {/* Radar */}
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
          <h4 className="font-bold text-white text-base mb-1">Maturity Profile Radar</h4>
          <p className="text-slate-500 text-xs mb-4">Current score vs. target 4.0 · Scale 1–5</p>
          <div className="flex justify-center overflow-x-auto">
            <svg width={SW} height={SH} viewBox={`0 0 ${SW} ${SH}`} className="max-w-full">
              {rings}{axes}
              <polygon points={targetPts} fill="rgba(13,148,136,0.05)"
                stroke="rgba(13,148,136,0.55)" strokeWidth="1.5" strokeDasharray="5,4"/>
              {hasData && <>
                <polygon points={scorePts} fill="rgba(59,130,246,0.12)"
                  stroke="#3b82f6" strokeWidth="2"/>
                {dots}
              </>}
              {labels}
              {/* Legend */}
              <rect x="16" y={SH-36} width="14" height="3" rx="1.5" fill="#3b82f6"/>
              <text x="36" y={SH-30} fontSize="9" fill="#94a3b8">Current Score</text>
              <line x1="16" y1={SH-18} x2="30" y2={SH-18} stroke="rgba(13,148,136,0.7)" strokeWidth="1.5" strokeDasharray="4,3"/>
              <text x="36" y={SH-14} fontSize="9" fill="#94a3b8">Target 4.0</text>
            </svg>
          </div>
        </div>

        {/* Distribution */}
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
          <h4 className="font-bold text-white text-base mb-1">Response Distribution</h4>
          <p className="text-slate-500 text-xs mb-6">Distribution of {answered} answered components across maturity levels</p>
          <div className="space-y-4">
            {dist.map((cnt, i) => {
              const pct = answered > 0 ? Math.round(cnt/answered*100) : 0;
              return (
                <div key={i} className="flex items-center gap-3">
                  <span className="w-36 text-xs font-bold shrink-0" style={{color: distColors[i]}}>
                    {distLabels[i]}
                  </span>
                  <div className="flex-1 bg-slate-700 rounded-full h-4 overflow-hidden">
                    <div className="h-full rounded-full bar-fill flex items-center justify-end pr-2"
                      style={{width:`${pct}%`, background:`${distColors[i]}`}}>
                      {cnt > 0 && <span className="text-white text-[10px] font-bold">{cnt}</span>}
                    </div>
                  </div>
                  <span className="w-10 text-right text-xs mono font-bold text-slate-400">{pct}%</span>
                </div>
              );
            })}
          </div>
          {/* Stats row */}
          <div className="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-700">
            {[
              {v: answered, l: 'Answered', c:'#0d9488'},
              {v: totalQ, l: 'Total Comps', c:'#3b82f6'},
              {v: completionPct+'%', l: 'Complete', c:'#8b5cf6'},
            ].map(s => (
              <div key={s.l} className="text-center bg-slate-800 rounded-xl p-3 border border-slate-700">
                <div className="text-2xl font-extrabold mono" style={{color:s.c}}>{s.v}</div>
                <div className="text-[10px] text-slate-500 mt-1 uppercase tracking-wider font-bold">{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PageHeatmap({ data, answers, scores }) {
  const { pillarScores } = scores;
  return (
    <div className="animate-fade space-y-6">
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <h3 className="font-bold text-white text-lg mb-1">Sub-Dimension Heatmap</h3>
        <p className="text-slate-400 text-xs mb-6">Average score per sub-dimension. Click pillar headers to collapse.</p>
        {data.map((p, pi) => {
          const pColor = PILAR_COLORS[pi % PILAR_COLORS.length];
          return (
            <div key={p.id} className="mb-8">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-extrabold mono"
                  style={{background: pColor+'18', color: pColor, border:`2px solid ${pColor}44`}}>
                  {p.id.replace('P','')}
                </div>
                <div>
                  <span className="font-bold text-sm" style={{color: pColor}}>{p.id}: {p.name}</span>
                  <span className="ml-3 text-xs text-slate-500">{p.subs.length} sub-dimensions</span>
                </div>
                <div className="ml-auto">
                  <ScoreChip val={pillarScores[p.id]}/>
                </div>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2">
                {p.subs.map(s => {
                  let sum=0, cnt=0;
                  s.comps.forEach(c => { if(answers[c.id]){sum+=answers[c.id];cnt++;} });
                  const avg = cnt > 0 ? sum/cnt : 0;
                  const c = scoreColor(avg);
                  return (
                    <div key={s.id} className="rounded-lg p-3 border transition-transform hover:-translate-y-0.5"
                      style={{background: avg > 0 ? scoreBg(avg) : 'rgba(30,41,59,0.5)', borderColor: avg > 0 ? c+'33' : '#334155'}}>
                      <div className="text-[9px] mono text-slate-500 mb-1">{s.id}</div>
                      <div className="text-xs font-semibold text-slate-300 leading-tight mb-2" style={{fontSize:'10px'}}>
                        {s.name.length > 30 ? s.name.slice(0,30)+'…' : s.name}
                      </div>
                      <div className="text-xl font-extrabold mono" style={{color: avg > 0 ? c : '#475569'}}>
                        {avg > 0 ? avg.toFixed(1) : '—'}
                      </div>
                      <div className="text-[9px] text-slate-500 mt-1">{cnt}/{s.comps.length} comps</div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PageMaturityScale() {
  return (
    <div className="animate-fade space-y-6">
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <h3 className="font-bold text-white text-xl mb-2">FCMA™ Maturity Scale</h3>
        <p className="text-slate-400 text-sm max-w-2xl mb-6">
          The Financial Crime Maturity Assessment uses a 5-tier evaluation framework measuring program
          maturity across 9 pillars, 49 sub-dimensions, and 175 components.
        </p>
        <div className="space-y-4">
          {MATURITY_LEVELS.map(m => (
            <div key={m.level} className="p-5 rounded-xl border flex flex-col md:flex-row gap-4 items-start md:items-center"
              style={{background: m.bg, borderColor: m.color+'44'}}>
              <div className="flex items-center gap-4 md:w-56 shrink-0">
                <span className="text-3xl font-extrabold mono" style={{color: m.color}}>L{m.level}</span>
                <div className="h-8 w-px bg-slate-600 hidden md:block"/>
                <h4 className="font-bold text-white text-base">{m.name}</h4>
              </div>
              <p className="text-slate-300 text-sm leading-relaxed flex-1">{m.desc}</p>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6">
        <div className="flex items-center gap-2 text-emerald-400 mb-2">
          <span className="text-lg">ℹ</span>
          <span className="font-bold text-xs uppercase tracking-wider">Methodology Note</span>
        </div>
        <h4 className="font-bold text-lg text-white mb-2">How Scores Are Calculated</h4>
        <p className="text-slate-400 text-sm leading-relaxed">
          Each component is evaluated on a 1–5 scale by the respondent. Sub-dimension scores are
          the arithmetic mean of their components. Pillar scores average across all evaluated
          sub-dimensions. The global score is the mean of pillar scores with at least one answer.
          CORE components (61 of 175) represent the most critical capabilities per the FCMA™ framework.
        </p>
      </div>
    </div>
  );
}

function PageGaps({ data, answers, core }) {
  const [expanded, setExpanded] = useState({});
  const gaps = useMemo(() => {
    const g = [];
    if (!data) return g;
    data.forEach(p => p.subs.forEach(s => s.comps.forEach(c => {
      if (answers[c.id] && answers[c.id] <= 2) {
        g.push({ comp: c, score: answers[c.id], pillar: p, sub: s, isCore: core.has(c.id) });
      }
    })));
    return g.sort((a,b) => a.score - b.score || a.comp.id.localeCompare(b.comp.id));
  }, [data, answers, core]);

  const toggle = id => setExpanded(e => ({...e, [id]: !e[id]}));

  if (gaps.length === 0) {
    return (
      <div className="animate-fade flex items-center justify-center h-64">
        <div className="text-center">
          <div className="text-5xl mb-4">✅</div>
          <h3 className="text-white font-bold text-xl">No Critical Gaps Found</h3>
          <p className="text-slate-400 text-sm mt-2">All answered components are at Level 3 or above.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="animate-fade space-y-4">
      <div className="bg-slate-900 rounded-2xl border border-red-900/40 p-6">
        <div className="flex items-center gap-3 mb-2">
          <span className="text-2xl">⚠</span>
          <h3 className="font-bold text-white text-xl">Critical Gaps — Level 1–2</h3>
        </div>
        <p className="text-slate-400 text-sm mb-6">
          {gaps.length} component{gaps.length > 1 ? 's' : ''} at critical maturity.
          Expand each to see current state vs. target Level 4 and optimal Level 5.
        </p>
        <div className="space-y-3">
          {gaps.map(g => {
            const gCol = g.score === 1 ? '#ef4444' : '#f97316';
            const isOpen = expanded[g.comp.id];
            const curDesc = g.comp.L[g.score-1] || '(No descriptor available)';
            const tarDesc = g.comp.L[3] || '(No descriptor available)';
            const optDesc = g.comp.L[4] || '(No descriptor available)';
            return (
              <div key={g.comp.id} className="rounded-xl overflow-hidden border"
                style={{borderColor: gCol+'55', borderLeftWidth:'4px'}}>
                <div className="flex items-center gap-3 p-4 cursor-pointer hover:bg-slate-800/50 transition"
                  onClick={() => toggle(g.comp.id)}>
                  <div className="w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-extrabold mono shrink-0"
                    style={{color: gCol, borderColor: gCol+'66', background: gCol+'12'}}>
                    L{g.score}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-white truncate">{g.comp.id} · {g.comp.name}</div>
                    <div className="text-xs mono text-slate-500 mt-0.5">{g.pillar.id}: {g.pillar.name} › {g.sub.id}</div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {g.isCore && (
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded"
                        style={{background:'rgba(13,148,136,0.15)', color:'#0d9488'}}>🔷 CORE</span>
                    )}
                    <span className="text-slate-500 text-lg transition-transform duration-200"
                      style={{transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}}>▾</span>
                  </div>
                </div>
                {isOpen && (
                  <div className="px-4 pb-4 bg-slate-950/40 border-t border-slate-700">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
                      <div className="rounded-lg p-3 border" style={{borderColor: gCol+'44', background: gCol+'08'}}>
                        <div className="text-[10px] font-extrabold uppercase tracking-wider mb-2" style={{color: gCol}}>
                          📍 Current — Level {g.score}
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{curDesc}</p>
                      </div>
                      <div className="rounded-lg p-3 border border-blue-500/30 bg-blue-500/06">
                        <div className="text-[10px] font-extrabold text-blue-400 uppercase tracking-wider mb-2">
                          🎯 Target — Level 4
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{tarDesc}</p>
                      </div>
                      <div className="rounded-lg p-3 border border-emerald-500/30 bg-emerald-500/06">
                        <div className="text-[10px] font-extrabold text-emerald-400 uppercase tracking-wider mb-2">
                          🏆 Optimized — Level 5
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{optDesc}</p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PageRoadmap({ data, answers, scores }) {
  const { pillarScores } = scores;
  // Build roadmap: pillars sorted by score asc (worst first)
  const pillarsRanked = useMemo(() => {
    if (!data) return [];
    return [...data]
      .map(p => ({ ...p, score: pillarScores[p.id] || 0 }))
      .filter(p => p.score > 0)
      .sort((a,b) => a.score - b.score);
  }, [data, pillarScores]);

  const priorityLabel = score => {
    if (score < 2) return { label:'Immediate Priority', color:'#ef4444', bg:'rgba(239,68,68,0.12)' };
    if (score < 3) return { label:'Short-Term (3–6 months)', color:'#f97316', bg:'rgba(249,115,22,0.12)' };
    if (score < 3.5) return { label:'Medium-Term (6–12 months)', color:'#f59e0b', bg:'rgba(245,158,11,0.12)' };
    return { label:'Continuous Improvement', color:'#3b82f6', bg:'rgba(59,130,246,0.12)' };
  };

  // Find worst 3 comps per pillar
  function worstComps(p, n=3) {
    const comps = [];
    p.subs.forEach(s => s.comps.forEach(c => {
      if (answers[c.id]) comps.push({ ...c, score: answers[c.id], sub: s.name });
    }));
    return comps.sort((a,b) => a.score - b.score).slice(0, n);
  }

  return (
    <div className="animate-fade space-y-6">
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <h3 className="font-bold text-white text-xl mb-1">Actionable Roadmap</h3>
        <p className="text-slate-400 text-sm mb-6">
          Pillars ranked from lowest to highest maturity. Focus investment on the top sections first.
        </p>
        {pillarsRanked.length === 0 && (
          <p className="text-slate-500 text-center py-12">Complete the assessment to generate a roadmap.</p>
        )}
        {pillarsRanked.map((p, idx) => {
          const pi = data.findIndex(d => d.id === p.id);
          const pColor = PILAR_COLORS[pi % PILAR_COLORS.length];
          const priority = priorityLabel(p.score);
          const worst = worstComps(p);
          return (
            <div key={p.id} className="mb-6 last:mb-0 rounded-xl border border-slate-700 overflow-hidden">
              <div className="flex items-center gap-3 p-4 bg-slate-800/50">
                <span className="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs font-extrabold mono text-slate-300">
                  {idx+1}
                </span>
                <div className="w-9 h-9 rounded-lg flex items-center justify-center font-extrabold mono text-sm"
                  style={{background: pColor+'18', color: pColor, border:`2px solid ${pColor}44`}}>
                  {p.id.replace('P','')}
                </div>
                <div className="flex-1">
                  <div className="font-bold text-white">{p.name}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded"
                      style={{color: priority.color, background: priority.bg}}>
                      {priority.label}
                    </span>
                  </div>
                </div>
                <div className="text-2xl font-extrabold mono" style={{color: scoreColor(p.score)}}>
                  {p.score.toFixed(1)}
                </div>
              </div>
              {worst.length > 0 && (
                <div className="p-4 space-y-2 bg-slate-900/60">
                  <div className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-3">
                    Top components to address:
                  </div>
                  {worst.map(c => (
                    <div key={c.id} className="flex items-start gap-3 py-2 border-b border-slate-800 last:border-0">
                      <span className="text-[10px] font-extrabold mono px-1.5 py-0.5 rounded mt-0.5 shrink-0"
                        style={{color: scoreColor(c.score), background: scoreBg(c.score)}}>
                        L{c.score}
                      </span>
                      <div className="flex-1">
                        <div className="text-xs font-semibold text-slate-200">{c.id} · {c.name}</div>
                        <div className="text-[10px] text-slate-500 mono mt-0.5">{c.sub}</div>
                        {c.L[3] && (
                          <div className="mt-1.5 p-2 rounded bg-blue-500/06 border border-blue-500/20">
                            <div className="text-[9px] font-bold text-blue-400 uppercase tracking-wider mb-1">Target Level 4:</div>
                            <p className="text-[10px] text-slate-400 leading-relaxed line-clamp-2">{c.L[3]}</p>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PagePillarDetail({ pillar, answers, scores, core, onBack }) {
  const pi = parseInt(pillar.id.replace('P',''));
  const pColor = PILAR_COLORS[pi % PILAR_COLORS.length];
  const pScore = scores.pillarScores[pillar.id] || 0;
  return (
    <div className="animate-fade space-y-4">
      <button onClick={onBack} className="flex items-center gap-2 text-sm text-slate-400 hover:text-white transition mb-2">
        ← Back to Overview
      </button>
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <div className="flex items-center gap-4 mb-2">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center font-extrabold mono text-lg"
            style={{background: pColor+'18', color: pColor, border:`2px solid ${pColor}44`}}>
            {pillar.id.replace('P','')}
          </div>
          <div>
            <h3 className="font-bold text-white text-xl">{pillar.name}</h3>
            {pillar.desc && <p className="text-slate-400 text-xs mt-0.5">{pillar.desc}</p>}
          </div>
          <div className="ml-auto text-3xl font-extrabold mono" style={{color: scoreColor(pScore)}}>
            {pScore > 0 ? pScore.toFixed(1) : '—'}
          </div>
        </div>
      </div>
      {pillar.subs.map(s => {
        let sSum=0, sCnt=0;
        s.comps.forEach(c => { if(answers[c.id]){sSum+=answers[c.id];sCnt++;} });
        const sAvg = sCnt > 0 ? sSum/sCnt : 0;
        return (
          <div key={s.id} className="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden">
            <div className="flex items-center justify-between p-4 border-b border-slate-700">
              <div>
                <span className="text-xs mono text-slate-500">{s.id}</span>
                <h4 className="font-bold text-white text-sm">{s.name}</h4>
              </div>
              <ScoreChip val={sAvg}/>
            </div>
            <div className="divide-y divide-slate-800">
              {s.comps.map(c => {
                const ans = answers[c.id];
                const isCore = core.has(c.id);
                const cColor = ans ? scoreColor(ans) : '#475569';
                return (
                  <div key={c.id} className="p-4">
                    <div className="flex items-start gap-3">
                      <div className="w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-extrabold mono shrink-0 mt-0.5"
                        style={{color: cColor, borderColor: cColor+'55', background: ans ? scoreBg(ans) : 'transparent'}}>
                        {ans || '—'}
                      </div>
                      <div className="flex-1">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="text-xs mono text-slate-500">{c.id}</span>
                          <span className="text-sm font-semibold text-slate-200">{c.name}</span>
                          {isCore && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded"
                            style={{background:'rgba(13,148,136,0.15)', color:'#0d9488'}}>CORE</span>}
                        </div>
                        {ans && c.L[ans-1] && (
                          <div className="mt-2 p-2.5 rounded-lg text-xs text-slate-400 leading-relaxed"
                            style={{background: scoreBg(ans), borderLeft:`3px solid ${cColor}`}}>
                            <span className="font-bold" style={{color: cColor}}>L{ans} ({['Non-Existent','Reactive','Defined','Managed','Optimized'][ans-1]}): </span>
                            {c.L[ans-1]}
                          </div>
                        )}
                        {!ans && <p className="text-xs text-slate-600 mt-1">Not evaluated</p>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('overview');
  const [drillPillar, setDrillPillar] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const { data, answers, core, reg } = useMemo(() => loadFCMAData(), []);
  const scores = useMemo(() => computeScores(data, answers), [data, answers]);

  const handleDrillPillar = (p) => { setDrillPillar(p); setPage('pillar'); };
  const handleBack = () => { setDrillPillar(null); setPage('overview'); };

  const maturity = getMaturity(scores.globalScore);

  const NAV = [
    { id:'overview',    label:'Executive Overview',      icon:'📊' },
    { id:'heatmap',     label:'Pillars Heatmap',         icon:'🗂' },
    { id:'maturity',    label:'Maturity Scale',          icon:'📐' },
    { id:'gaps',        label:'Critical Gaps',           icon:'⚠',
      badge: data ? (() => { let n=0; data.forEach(p=>p.subs.forEach(s=>s.comps.forEach(c=>{ if(answers[c.id]&&answers[c.id]<=2)n++; }))); return n; })() : 0 },
    { id:'roadmap',     label:'Actionable Roadmap',      icon:'🗺' },
  ];

  if (!data) {
    return (
      <div className="min-h-screen bg-slate-950 flex items-center justify-center">
        <div className="text-center max-w-md p-8">
          <div className="text-6xl mb-6">📋</div>
          <h1 className="text-white text-2xl font-extrabold mb-3">No Assessment Data Found</h1>
          <p className="text-slate-400 text-sm leading-relaxed mb-6">
            Complete the FCMA Assessment first, then open this report.
            Data is loaded from your browser's localStorage.
          </p>
          <button onClick={() => window.close()}
            className="bg-teal-600 hover:bg-teal-500 text-white font-bold px-6 py-3 rounded-xl transition">
            Close Report
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
      {/* Watermark */}
      <div className="watermark-bg no-print" aria-hidden="true">
        {Array(16).fill('FCMA™ · CONFIDENTIAL').map((t,i) => <span key={i}>{t}</span>)}
      </div>

      {/* Header */}
      <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <button onClick={() => setSidebarOpen(!sidebarOpen)}
              className="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white transition no-print">
              ☰
            </button>
            <div className="w-9 h-9 rounded-lg flex items-center justify-center font-extrabold text-white"
              style={{background:'linear-gradient(135deg,#0d9488,#14b8a6)'}}>F</div>
            <div>
              <div className="text-sm font-extrabold tracking-tight">FCMA™ Executive Report</div>
              <div className="text-[10px] text-slate-400 uppercase tracking-wider">Financial Crime Maturity Assessment</div>
            </div>
          </div>
          <div className="flex items-center gap-4">
            {reg && (
              <div className="hidden md:block text-right">
                <div className="text-sm font-bold text-white">{reg.company}</div>
                <div className="text-xs text-slate-400">{reg.contact} · {new Date(reg.ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}</div>
              </div>
            )}
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg border"
              style={{color: maturity.color, background: maturity.bg, borderColor: maturity.color+'44'}}>
              <span className="text-sm font-extrabold mono">{scores.globalScore > 0 ? scores.globalScore.toFixed(1) : '—'}</span>
              <span className="text-xs font-bold hidden sm:block">{maturity.name}</span>
            </div>
            <button
              onClick={() => {
                const d = {
                  version:'2.0', data,
                  answers, core:[...core],
                  registration: reg,
                  globalScore: scores.globalScore,
                  pillarScores: scores.pillarScores,
                  exportedAt: new Date().toISOString()
                };
                const b = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = `FCMA_Report_${reg?.company?.replace(/\s+/g,'_')||'Assessment'}_${new Date().toISOString().slice(0,10)}.json`;
                a.click(); URL.revokeObjectURL(a.href);
              }}
              className="no-print flex items-center gap-2 bg-teal-700 hover:bg-teal-600 text-white font-bold text-xs px-3 py-2 rounded-lg transition">
              💾 Export
            </button>
          </div>
        </div>
      </header>

      <div className="flex flex-1 max-w-screen-2xl mx-auto w-full">
        {/* Sidebar */}
        {sidebarOpen && (
          <aside className="no-print w-56 shrink-0 sticky top-[57px] h-[calc(100vh-57px)] bg-slate-900 border-r border-slate-800 flex flex-col py-4 overflow-y-auto">
            <div className="px-3 space-y-1">
              {NAV.map(n => {
                const isActive = page === n.id || (n.id === 'overview' && page === 'pillar');
                return (
                  <button key={n.id}
                    onClick={() => { setPage(n.id); setDrillPillar(null); }}
                    className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left ${
                      isActive ? 'active bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                    }`}>
                    <span>{n.icon}</span>
                    <span className="flex-1">{n.label}</span>
                    {n.badge > 0 && (
                      <span className="px-1.5 py-0.5 text-[9px] font-extrabold bg-red-500/20 border border-red-500/30 text-red-400 rounded">
                        {n.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            <div className="mt-auto px-3 pt-4 border-t border-slate-800">
              <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700 text-center">
                <div className="text-[9px] text-slate-500 uppercase tracking-wider font-bold mb-1">Framework</div>
                <div className="text-xs font-bold text-teal-400">FCMA™ v2.0</div>
                <div className="text-[9px] text-slate-600 mt-1">© Continental Risk Partners</div>
              </div>
            </div>
          </aside>
        )}

        {/* Main content */}
        <main className="flex-1 min-w-0 overflow-y-auto p-6">
          {page === 'overview' && !drillPillar && (
            <PageOverview data={data} answers={answers} scores={scores}
              reg={reg} core={core} onDrillPillar={handleDrillPillar}/>
          )}
          {page === 'pillar' && drillPillar && (
            <PagePillarDetail pillar={drillPillar} answers={answers}
              scores={scores} core={core} onBack={handleBack}/>
          )}
          {page === 'heatmap' && (
            <PageHeatmap data={data} answers={answers} scores={scores}/>
          )}
          {page === 'maturity' && <PageMaturityScale/>}
          {page === 'gaps' && <PageGaps data={data} answers={answers} core={core}/>}
          {page === 'roadmap' && <PageRoadmap data={data} answers={answers} scores={scores}/>}
        </main>
      </div>

      {/* Footer */}
      <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-[10px] text-slate-600">
        © {new Date().getFullYear()} Continental Risk Partners — All rights reserved.
        FCMA™ Framework is exclusive intellectual property of the author.
        Reproduction, distribution, or use without written authorization is prohibited.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
