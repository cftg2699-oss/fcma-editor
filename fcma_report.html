<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FCMA Executive Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        slate: { 850: '#1a2744' }
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');
  * { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .font-mono, .mono { font-family: 'IBM Plex Mono', monospace !important; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  @media print { .no-print { display: none !important; } body { background: white !important; } }
  .watermark-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    opacity: 0.025; overflow: hidden;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 100px; transform: rotate(-25deg);
    font-size: 26px; font-weight: 800; letter-spacing: 6px;
    font-family: 'IBM Plex Mono', monospace; color: #e2e8f0;
  }
  .sidebar-item { transition: all 0.15s ease; }
  .sidebar-item.active { border-left: 3px solid #10b981; }
  .animate-fade { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .donut-arc { transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1); }
  .bar-fill { transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ── CONSTANTS ──────────────────────────────────────────────
const MATURITY_LEVELS = [
  { min:0,    max:1.49, level:1, name:'Non-Existent',  color:'#ef4444', bg:'rgba(239,68,68,0.12)',  desc:'No formal structure or documented processes. Activities are reactive and ad hoc, creating significant risk exposure.' },
  { min:1.5,  max:2.49, level:2, name:'Reactive',      color:'#f97316', bg:'rgba(249,115,22,0.12)', desc:'Basic controls exist but are informal and undocumented. The program reacts to issues rather than preventing them.' },
  { min:2.5,  max:3.49, level:3, name:'Defined',       color:'#f59e0b', bg:'rgba(245,158,11,0.12)', desc:'Core processes are documented, repeatable, and governed. Practices are consistent, though gaps in measurement and coverage remain.' },
  { min:3.5,  max:4.24, level:4, name:'Managed',       color:'#3b82f6', bg:'rgba(59,130,246,0.12)', desc:'The program is metrics-driven and proactively managed, with monitoring, benchmarking, and continuous improvement established.' },
  { min:4.25, max:5.0,  level:5, name:'Optimized',     color:'#22c55e', bg:'rgba(34,197,94,0.12)',  desc:'Best-in-class capability with real-time adaptive controls, full integration across functions, and continuous optimization.' },
];
const PILAR_COLORS = ['#0d9488','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#ef4444','#22c55e','#06b6d4','#6366f1'];

function getMaturity(s) {
  return MATURITY_LEVELS.find(m => s >= m.min && s <= m.max) || MATURITY_LEVELS[0];
}
function scoreColor(s) {
  if (!s || s <= 0) return '#64748b';
  if (s < 2) return '#ef4444';
  if (s < 3) return '#f97316';
  if (s < 3.5) return '#f59e0b';
  if (s < 4.25) return '#3b82f6';
  return '#22c55e';
}
function scoreBg(s) {
  if (!s || s <= 0) return 'rgba(100,116,139,0.08)';
  if (s < 2) return 'rgba(239,68,68,0.1)';
  if (s < 3) return 'rgba(249,115,22,0.1)';
  if (s < 3.5) return 'rgba(245,158,11,0.1)';
  if (s < 4.25) return 'rgba(59,130,246,0.1)';
  return 'rgba(34,197,94,0.1)';
}
function levelBadge(s) {
  const c = scoreColor(s);
  return { color: c, bg: scoreBg(s), border: c + '44' };
}

// ── DATA LOADER ────────────────────────────────────────────
const FMETA=(function(){var d={assessmentName:'Financial Crime Maturity Assessment',frameworkShort:'FCMA\u2122 v2.0',org:'Continental Risk Advisor',framework:'FCMA\u2122',version:'',scoreDirection:null};try{var m=JSON.parse(localStorage.getItem('fcma_meta')||'null')||{};return{assessmentName:m.assessmentName||m.title||d.assessmentName,frameworkShort:m.frameworkShort||d.frameworkShort,org:m.org||d.org,framework:m.framework||d.framework,version:m.version||d.version,scoreDirection:m.scoreDirection||null};}catch(e){return d;}})();
const TOOL={name:'RiskAtlas',version:'1.0'};
const RESIDUAL_MATRIX=[[1,1,2,2,3],[1,2,2,3,3],[2,2,3,3,4],[2,3,3,4,5],[3,3,4,5,5]];
const RES_INFO={0:{label:'\u2014',color:'#475569',auth:'Not yet computed'},1:{label:'Very Low',color:'#22c55e',auth:'Business unit management'},2:{label:'Low',color:'#84cc16',auth:'Business unit management'},3:{label:'Moderate',color:'#f59e0b',auth:'Business unit + TPRM office sign-off'},4:{label:'High',color:'#f97316',auth:'Senior management approval; documented risk acceptance'},5:{label:'Critical',color:'#ef4444',auth:'Senior management + board approval'}};
const IS_SCORECARD=/INVERTED/i.test(FMETA.scoreDirection||'');
const DOMAIN_WEIGHTS=[1,1.2,1.1,1,0.9,0.9,0.8,1.1,1,1.2];
const BRANCH_WEIGHTS={provider:0.6,entity:0.4};
const PORTFOLIO_DATA=(function(){try{var pf=JSON.parse(localStorage.getItem('tprm_portfolio')||'null');var fw=JSON.parse(localStorage.getItem('tprm_fw_vendor')||'null');if(!pf||!fw||!fw.data||!pf.providers)return null;return {pf:pf,fw:fw};}catch(e){return null;}})();
const IS_PORTFOLIO=!!(PORTFOLIO_DATA&&PORTFOLIO_DATA.pf.providers&&PORTFOLIO_DATA.pf.providers.length);
function computeProviderRisk(fw, answers){
  var data=fw.data; var inhPillar=data[0];
  var inhComps=inhPillar?inhPillar.subs.reduce(function(a,x){return a.concat(x.comps);},[]):[];
  var controlPillars=data.slice(1);
  var domains=controlPillars.map(function(cp,i){
    var inhComp=inhComps[i]; var inh=inhComp?(answers[inhComp.id]||0):0;
    var cComps=cp.subs.reduce(function(a,x){return a.concat(x.comps);},[]);
    var scored=cComps.map(function(c){return answers[c.id];}).filter(function(v){return v>0;});
    var ctrl=scored.length?Math.round(scored.reduce(function(a,b){return a+b;},0)/scored.length):0;
    var res=(inh&&ctrl)?RESIDUAL_MATRIX[inh-1][ctrl-1]:0;
    return {name:cp.name.replace(/^Control Effectiveness\s*[—-]\s*/,''),inh:inh,ctrl:ctrl,res:res};
  });
  var overallMax=domains.reduce(function(m,d){return Math.max(m,d.res);},0);
  var wsum=0,w=0; domains.forEach(function(d,i){if(d.res>0){var wt=DOMAIN_WEIGHTS[i]||1;wsum+=d.res*wt;w+=wt;}});
  var weightedIndex=w>0?parseFloat((wsum/w).toFixed(2)):0;
  var inhVals=domains.map(function(d){return d.inh;}).filter(function(v){return v>0;});
  var inhAvg=inhVals.length?parseFloat((inhVals.reduce(function(a,b){return a+b;},0)/inhVals.length).toFixed(2)):0;
  var weakest=null; domains.forEach(function(d){if(d.res>0&&(!weakest||d.res>weakest.res))weakest=d;});
  var coverage=domains.filter(function(d){return d.res>0;}).length;
  return {domains:domains,overallMax:overallMax,weightedIndex:weightedIndex,inhAvg:inhAvg,weakest:weakest,coverage:coverage};
}
function loadFCMAData() {
  try {
    const data    = JSON.parse(localStorage.getItem('fcma_data')  || 'null');
    const answers = JSON.parse(localStorage.getItem('fcma_answers') || '{}');
    const core    = JSON.parse(localStorage.getItem('fcma_core')  || '[]');
    const reg     = JSON.parse(localStorage.getItem('fcma_reg')   || 'null');
    return { data, answers, core: new Set(core), reg };
  } catch(e) {
    return { data: null, answers: {}, core: new Set(), reg: null };
  }
}

// ── SCORE ENGINE ───────────────────────────────────────────
function computeScores(data, answers) {
  if (!data) return { pillarScores: {}, globalScore: 0, totalQ: 0, answered: 0 };
  let totalQ = 0, answeredCount = 0, globalSum = 0, globalCnt = 0;
  const pillarScores = {};
  data.forEach(p => {
    let pSum = 0, pCnt = 0;
    p.subs.forEach(s => s.comps.forEach(c => {
      totalQ++;
      if (answers[c.id]) { answeredCount++; pSum += answers[c.id]; pCnt++; }
    }));
    pillarScores[p.id] = pCnt > 0 ? pSum / pCnt : 0;
    if (pCnt > 0) { globalSum += pillarScores[p.id]; globalCnt++; }
  });
  return {
    pillarScores,
    globalScore: globalCnt > 0 ? globalSum / globalCnt : 0,
    totalQ,
    answered: answeredCount,
  };
}


// ── THREAT & INITIATIVE ENGINE (added) ─────────────────────
// Top banking cyber threats mapped to the CMA components that mitigate them.
// Control maturity per threat = avg score of its answered mitigating components.
const THREATS = [
  { name:'Ransomware',                 icon:'\u{1F512}', inherent:5, comps:['10.2.2','10.1.1','7.1.2','9.2.1','6.1.2','8.1.2','5.2.1'] },
  { name:'Phishing & Social Engineering', icon:'\u{1F3A3}', inherent:5, comps:['8.1.2','8.1.1','5.2.2','9.1.1'] },
  { name:'Account Takeover (ATO)',     icon:'\u{1F464}', inherent:4, comps:['5.2.2','5.1.1','11.2.1','9.1.1'] },
  { name:'Insider Threat',             icon:'\u{1F575}', inherent:4, comps:['8.2.1','5.1.3','5.2.1','6.1.2'] },
  { name:'Third-Party / Supply Chain', icon:'\u{1F517}', inherent:5, comps:['3.1.1','3.1.2','3.2.1','3.2.2'] },
  { name:'Data Breach / Exfiltration', icon:'\u{1F4BE}', inherent:5, comps:['6.1.2','6.1.1','6.2.1','5.1.2','7.3.1'] },
  { name:'Cloud Misconfiguration',     icon:'\u2601',    inherent:4, comps:['7.2.1','4.1.1','5.2.1'] },
  { name:'DDoS / Availability',        icon:'\u{1F30A}', inherent:3, comps:['7.1.1','10.2.1','3.2.2'] },
  { name:'Vulnerability Exploitation', icon:'\u{1F41B}', inherent:4, comps:['9.2.1','9.2.2','4.2.2','7.1.2'] },
  { name:'Identity / Synthetic Fraud', icon:'\u{1F3AD}', inherent:4, comps:['11.2.1','5.1.1','5.2.2'] },
  { name:'Advanced Persistent Threat', icon:'\u{1F3AF}', inherent:4, comps:['9.1.1','9.1.2','9.2.2','5.2.1'] },
];
// Effort/complexity judgment per component (1=Low,2=Med,3=High). Default 2. Editable.
const EFFORT = {
  '1.1.1':1,'1.2.1':1,'1.2.2':1,'1.2.3':1,'2.1.2':1,'2.2.1':1,'2.2.3':1,'3.1.2':1,'8.1.1':1,'8.1.2':1,
  '5.1.1':2,'5.1.3':2,'5.2.2':2,'4.1.2':2,'4.2.1':2,'6.1.2':2,'6.2.1':2,'6.2.2':2,'8.2.1':2,'9.1.2':2,'10.1.1':2,'10.2.2':2,'3.1.1':2,'3.1.3':2,'11.2.1':2,
  '5.1.2':3,'5.2.1':3,'6.1.1':3,'7.1.1':3,'7.1.2':3,'7.2.1':3,'7.3.1':3,'9.1.1':3,'9.2.2':3,'10.2.1':3,'11.1.1':3,'11.1.2':3
};
const riskColor  = r => r>=3.5?'#ef4444':r>=2.5?'#f97316':r>=1.5?'#f59e0b':'#22c55e';
const riskLabel  = r => r>=3.5?'Critical':r>=2.5?'High':r>=1.5?'Medium':'Low';
const effLabel   = e => e>=3?'High':e>=2?'Medium':'Low';

function PageThreats({ answers }) {
  const rows = THREATS.map(t => {
    const scored = t.comps.map(id=>answers[id]).filter(v=>v>0);
    const maturity = scored.length ? scored.reduce((a,b)=>a+b,0)/scored.length : null;
    const residual = maturity==null ? t.inherent : t.inherent*(1-maturity/5);
    return { ...t, maturity, residual, coverage:scored.length };
  }).sort((a,b)=>b.residual-a.residual);
  return (
    <div className="animate-fade">
      <div className="mb-5">
        <h2 className="text-xl font-extrabold text-white mb-1">Threat Exposure</h2>
        <p className="text-xs text-slate-400 max-w-3xl">Top banking cyber threats. <b>Residual risk = Inherent × (1 − control maturity/5)</b>, where control maturity is the average of the CMA components that mitigate each threat. Unanswered components are excluded; low coverage means the residual is an estimate.</p>
      </div>
      <div className="space-y-2">
        {rows.map(r=>(
          <div key={r.name} className="p-3 rounded-xl border border-slate-700 bg-slate-800/40 flex items-center gap-4">
            <div className="text-2xl w-8 text-center shrink-0">{r.icon}</div>
            <div className="flex-1 min-w-0">
              <div className="flex justify-between items-center mb-1.5">
                <span className="text-sm font-bold text-slate-100 truncate">{r.name}</span>
                <span className="text-[10px] mono px-2 py-0.5 rounded-full shrink-0"
                  style={{color:riskColor(r.residual),background:riskColor(r.residual)+'1a',border:'1px solid '+riskColor(r.residual)+'55'}}>
                  {riskLabel(r.residual)} · {r.residual.toFixed(2)}
                </span>
              </div>
              <div className="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
                <div className="h-full rounded-full bar-fill" style={{width:`${(r.residual/5)*100}%`,background:riskColor(r.residual)}}/>
              </div>
              <div className="flex gap-4 mt-1.5 text-[10px] text-slate-400 mono">
                <span>Inherent: <b className="text-slate-200">{r.inherent}/5</b></span>
                <span>Control maturity: <b className="text-slate-200">{r.maturity==null?'—':r.maturity.toFixed(1)+'/5'}</b></span>
                <span>Coverage: <b className="text-slate-200">{r.coverage}/{r.comps.length}</b></span>
              </div>
            </div>
          </div>
        ))}
      </div>
      <p className="text-[10px] text-slate-600 mt-4 italic">Inherent-risk values and threat→component mappings are judgment defaults; validate against your institution’s risk assessment before use with a client.</p>
    </div>
  );
}

function PageInitiatives({ data, answers, core }) {
  const items=[];
  (data||[]).forEach(p=>p.subs.forEach(s=>s.comps.forEach(c=>{
    const sc=answers[c.id];
    if(sc>0 && sc<=2){
      const isCore=core.has(c.id);
      const benefit=(5-sc)*(isCore?1.25:1);
      const effort=EFFORT[c.id]||2;
      const pn=parseInt(c.id.split('.')[0],10)||1;
      items.push({id:c.id,name:c.name,score:sc,next:(c.L&&c.L[sc])||'',effort,benefit,isCore,
        color:PILAR_COLORS[(pn-1)%PILAR_COLORS.length],
        quick: effort<=2 && benefit>=3});
    }
  })));
  items.sort((a,b)=>b.benefit-a.benefit);
  // scatter geometry
  const W=560,H=360,mL=60,mR=24,mT=24,mB=48;
  const px=e=>mL+((e-1)/2)*(W-mL-mR);
  const maxB=5;
  const py=b=>mT+(1-(b/maxB))*(H-mT-mB);
  const jitter=i=>((i%3)-1)*10;
  return (
    <div className="animate-fade">
      <div className="mb-5">
        <h2 className="text-xl font-extrabold text-white mb-1">Initiatives — Effort × Benefit</h2>
        <p className="text-xs text-slate-400 max-w-3xl">Every component scored ≤ 2 becomes an improvement initiative. <b>Benefit = maturity uplift (5 − current), weighted ×1.25 for Core components. Effort</b> is a complexity judgment. Top-left = <b className="text-emerald-400">Quick Wins</b> (high benefit, low effort).</p>
      </div>
      {items.length===0 ? (
        <div className="p-8 text-center text-slate-500 border border-slate-700 rounded-xl">No initiatives — no component is currently scored at level 2 or below. Answer more questions or improve coverage.</div>
      ) : (
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div className="border border-slate-700 rounded-xl p-3 bg-slate-900/40">
          <svg viewBox={`0 0 ${W} ${H}`} width="100%">
            <line x1={mL} y1={mT+(H-mT-mB)/2} x2={W-mR} y2={mT+(H-mT-mB)/2} stroke="#334155" strokeDasharray="4 4"/>
            <line x1={mL+(W-mL-mR)/2} y1={mT} x2={mL+(W-mL-mR)/2} y2={H-mB} stroke="#334155" strokeDasharray="4 4"/>
            <line x1={mL} y1={mT} x2={mL} y2={H-mB} stroke="#475569"/>
            <line x1={mL} y1={H-mB} x2={W-mR} y2={H-mB} stroke="#475569"/>
            <text x={mL-8} y={mT+6} textAnchor="end" fontSize="9" fill="#64748b">High</text>
            <text x={mL-8} y={H-mB} textAnchor="end" fontSize="9" fill="#64748b">Low</text>
            <text x={mL-40} y={(H)/2} textAnchor="middle" fontSize="10" fill="#94a3b8" transform={`rotate(-90 ${mL-40} ${H/2})`}>Benefit →</text>
            <text x={mL} y={H-mB+16} textAnchor="middle" fontSize="9" fill="#64748b">Low</text>
            <text x={W-mR} y={H-mB+16} textAnchor="end" fontSize="9" fill="#64748b">High</text>
            <text x={(mL+W-mR)/2} y={H-8} textAnchor="middle" fontSize="10" fill="#94a3b8">Effort →</text>
            <text x={mL+6} y={mT+14} fontSize="9" fill="#22c55e" fontWeight="700">⚡ QUICK WINS</text>
            {items.map((it,i)=>(
              <g key={it.id}>
                <circle cx={px(it.effort)+jitter(i)} cy={py(it.benefit)} r="13"
                  fill={it.color+'cc'} stroke={it.quick?'#22c55e':'#0f172a'} strokeWidth={it.quick?2:1}>
                  <title>{it.id} · {it.name} (benefit {it.benefit.toFixed(1)}, effort {effLabel(it.effort)})</title>
                </circle>
                <text x={px(it.effort)+jitter(i)} y={py(it.benefit)+3} textAnchor="middle" fontSize="7.5" fill="#fff" fontWeight="700" style={{pointerEvents:'none'}}>{it.id}</text>
              </g>
            ))}
          </svg>
        </div>
        <div className="space-y-2 max-h-[520px] overflow-y-auto pr-1">
          {items.map(it=>(
            <div key={it.id} className="p-3 rounded-xl border border-slate-700 bg-slate-800/40">
              <div className="flex justify-between items-start gap-2 mb-1">
                <span className="text-xs font-bold text-slate-100">
                  {it.quick && <span className="text-emerald-400">⚡ </span>}
                  <span className="mono" style={{color:it.color}}>{it.id}</span> · {it.name}
                  {it.isCore && <span className="ml-1 text-[9px] px-1 rounded bg-slate-700 text-slate-300">CORE</span>}
                </span>
                <span className="text-[10px] mono text-slate-400 shrink-0">L{it.score}→L{it.score+1}</span>
              </div>
              <div className="flex gap-3 text-[10px] mono text-slate-400 mb-1.5">
                <span>Effort: <b className="text-slate-200">{effLabel(it.effort)}</b></span>
                <span>Benefit: <b className="text-slate-200">{it.benefit.toFixed(1)}</b></span>
              </div>
              {it.next && <p className="text-[10px] text-slate-400 leading-snug"><b className="text-slate-300">To reach level {it.score+1}:</b> {it.next.length>180?it.next.slice(0,180)+'\u2026':it.next}</p>}
            </div>
          ))}
        </div>
      </div>
      )}
    </div>
  );
}

// ── COMPONENTS ─────────────────────────────────────────────

function Donut({ score, color, size = 180 }) {
  const r = size * 0.38, stroke = size * 0.065;
  const C = 2 * Math.PI * r;
  const fill = score > 0 ? C * (score / 5) : 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color+'18'} strokeWidth={stroke}/>
      {score > 0 && (
        <circle
          cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
          strokeWidth={stroke}
          strokeDasharray={`${fill.toFixed(2)} ${(C-fill).toFixed(2)}`}
          strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}
          filter="url(#glow)"
          className="donut-arc"
        />
      )}
      <text x={size/2} y={size/2 - size*0.05} textAnchor="middle"
        fontSize={size*0.22} fontWeight="800" fill={score > 0 ? color : '#64748b'}
        style={{fontFamily:'IBM Plex Mono,monospace'}}>
        {score > 0 ? score.toFixed(1) : '—'}
      </text>
      <text x={size/2} y={size/2 + size*0.09} textAnchor="middle"
        fontSize={size*0.065} fill="#64748b" fontWeight="600">
        out of 5.0
      </text>
      <text x={size/2} y={size/2 + size*0.18} textAnchor="middle"
        fontSize={size*0.058} fill="#475569">
        {score > 0 ? `${Math.round((score/5)*100)}% capacity` : 'No data'}
      </text>
    </svg>
  );
}

function PillarBar({ pillar, score, answered, total, color, onClick }) {
  const pct = score > 0 ? (score / 5) * 100 : 0;
  return (
    <div
      onClick={onClick}
      className="group p-3 rounded-xl border border-slate-700 hover:border-slate-500 bg-slate-800/40 hover:bg-slate-800 cursor-pointer transition-all"
    >
      <div className="flex justify-between items-center mb-2 gap-2">
        <span className="text-xs font-bold text-slate-200 group-hover:text-white truncate flex-1" style={{maxWidth:'70%'}}>
          {pillar.id}: {pillar.name.split(' ').slice(0,4).join(' ')}{pillar.name.split(' ').length > 4 ? '…' : ''}
        </span>
        <span className="text-sm font-extrabold mono shrink-0" style={{color: score > 0 ? color : '#475569'}}>
          {score > 0 ? score.toFixed(1) : '—'}
        </span>
      </div>
      <div className="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden mb-1.5">
        <div className="h-full rounded-full bar-fill" style={{width:`${pct}%`, background:`linear-gradient(90deg,${color},${color}bb)`}}/>
      </div>
      <div className="flex justify-between text-[10px] text-slate-500">
        <span>Target 4.0+</span>
        <span>{answered}/{total} evaluated</span>
      </div>
    </div>
  );
}

function ScoreChip({ val }) {
  if (!val || val <= 0) return <span className="inline-block px-2 py-0.5 text-xs mono font-bold rounded border border-slate-600 text-slate-500 bg-slate-800">—</span>;
  const c = scoreColor(val);
  return (
    <span className="inline-block px-2.5 py-1 text-xs mono font-bold rounded border"
      style={{color: c, background: scoreBg(val), borderColor: c+'44'}}>
      {val.toFixed(1)}
    </span>
  );
}

function PageOverview({ data, answers, scores, reg, core, onDrillPillar }) {
  const { pillarScores, globalScore, totalQ, answered } = scores;
  const maturity = getMaturity(globalScore);
  const completionPct = totalQ > 0 ? Math.round(answered / totalQ * 100) : 0;

  // Response distribution
  const dist = [0,0,0,0,0];
  Object.values(answers).forEach(v => { if(v>=1&&v<=5) dist[v-1]++; });
  const distLabels = ['L1 — Non-Existent','L2 — Reactive','L3 — Defined','L4 — Managed','L5 — Optimized'];
  const distColors = ['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e'];

  // Radar SVG
  const N = data.length;
  const aStep = (2 * Math.PI) / N;
  const SW=480, SH=420, cx=SW/2, cy=SH/2-10, maxR=135;
  function rPt(i, val, maxVal) {
    const a = aStep * i - Math.PI/2;
    const r = (val / maxVal) * maxR;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  const rings = [1,2,3,4,5].map(lv => {
    const pts = data.map((_,i) => { const p=rPt(i,lv,5); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ');
    const isTarget = lv === 4;

      stroke={isTarget ? 'rgba(13,148,136,0.5)' : 'rgba(71,85,105,0.3)'}
      strokeWidth={isTarget ? '1.5' : '0.8'}
      strokeDasharray={isTarget ? '5,4' : undefined}/>;
  });
  const axes = data.map((_,i) => {
    const ep = rPt(i,5,5);
    return <line key={i} x1={cx} y1={cy} x2={ep.x.toFixed(1)} y2={ep.y.toFixed(1)}
      stroke="rgba(71,85,105,0.35)" strokeWidth="0.8"/>;

  const targetPts = data.map((_,i) => { const p=rPt(i,4,5); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ');
  const hasData = Object.keys(answers).length > 0;

  const dots = data.map((p,i) => {
    const s = pillarScores[p.id]||0;
    if(!s) return null;
    const dp = rPt(i,s,5);
    return <circle key={p.id} cx={dp.x.toFixed(1)} cy={dp.y.toFixed(1)} r="5"
      fill={scoreColor(s)} stroke="#0f172a" strokeWidth="2"/>;
  });
  const labels = data.map((p,i) => {
    const lp = rPt(i, 5.75, 5);
    let anchor = 'middle';
    if (lp.x < cx - 12) anchor = 'end';
    else if (lp.x > cx + 12) anchor = 'start';
    const s = pillarScores[p.id]||0;
    const lc = s > 0 ? scoreColor(s) : '#64748b';

      <g key={p.id}>
        <text x={lp.x.toFixed(1)} y={lp.y.toFixed(1)} textAnchor={anchor}
          fontSize="9.5" fontWeight="700" fill={lc} fontFamily="IBM Plex Sans,sans-serif">{short}</text>
        {s>0 && <text x={rPt(i,5.75+0.5,5).x.toFixed(1)} y={rPt(i,5.75+0.5,5).y.toFixed(1)}
          textAnchor={anchor} fontSize="8.5" fill={lc+'bb'}

  return (
    <div className="space-y-6 animate-fade">
      {/* Hero row */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Score card */}
        <div className="lg:col-span-4 bg-slate-900 rounded-2xl border border-slate-700 p-6 flex flex-col justify-between relative overflow-hidden">
          <div className="absolute inset-0 opacity-5 flex items-center justify-center">

          </div>
          <div className="relative z-10">

            <h4 className="font-extrabold text-white text-lg mt-0.5">

            {reg && <p className="text-slate-400 text-xs mt-1">{reg.contact} · {reg.role}</p>}
          </div>
          <div className="flex flex-col items-center my-4 relative z-10">
            <Donut score={globalScore} color={maturity.color} size={180}/>
            <div className="mt-3 px-4 py-1.5 rounded-full font-bold text-sm border-2"
              style={{color: maturity.color, background: maturity.bg, borderColor: maturity.color+'44'}}>

          <div className="flex justify-center overflow-x-auto">

                </div>
              );
            })}
          </div>
          {/* Stats row */}
          <div className="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-700">
            {[

function PageVendorRisk({ data, answers }) {
  const inhPillar = data[0];
  const inhComps = inhPillar ? inhPillar.subs.reduce((a,s)=>a.concat(s.comps),[]) : [];
  const controlPillars = data.slice(1);
  const invColor = v => v>=5?'#ef4444':v>=4?'#f97316':v>=3?'#f59e0b':v>=2?'#84cc16':v>=1?'#22c55e':'#475569';
  const rows = controlPillars.map((cp, i) => {
    const inhComp = inhComps[i];
    const inh = inhComp ? (answers[inhComp.id]||0) : 0;
    const cComps = cp.subs.reduce((a,s)=>a.concat(s.comps),[]);
    const scoredArr = cComps.map(c=>answers[c.id]).filter(v=>v>0);
    const ctrl = scoredArr.length ? Math.round(scoredArr.reduce((a,b)=>a+b,0)/scoredArr.length) : 0;
    const res = (inh&&ctrl) ? RESIDUAL_MATRIX[inh-1][ctrl-1] : 0;
    return { domain: cp.name.replace(/^Control Effectiveness\s*[—-]\s*/,''), inh, ctrl, res, cov: scoredArr.length, tot: cComps.length };
  });
  const overall = rows.reduce((m,r)=>Math.max(m,r.res),0);
  const oinfo = RES_INFO[overall];
  return (
    <div className="animate-fade space-y-6">
      <div className="mb-2">
        <h2 className="text-2xl font-extrabold text-white mb-1">Vendor Risk — Residual</h2>
        <p className="text-sm text-slate-400 max-w-3xl">Residual risk per domain = matrix lookup of <b>inherent exposure</b> against <b>control effectiveness</b> (rounded average of the domain's controls). Scoring is inverted: 1 = best, 5 = worst. Overall residual = the highest domain, so one critical domain is not diluted.</p>
      </div>
      <div className="rounded-2xl border p-6 flex flex-col md:flex-row md:items-center gap-6" style={{background: oinfo.color+'14', borderColor: oinfo.color+'55'}}>
        <div className="text-center md:border-r md:border-slate-700 md:pr-6">
          <div className="text-6xl font-extrabold mono" style={{color: oinfo.color}}>{overall||'\u2014'}</div>
          <div className="text-sm font-bold mt-1" style={{color: oinfo.color}}>{oinfo.label}</div>
          <div className="text-[10px] text-slate-500 uppercase tracking-wider mt-1">Overall Residual</div>
        </div>
        <div className="flex-1">
          <div className="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Required Approval Authority</div>
          <div className="text-base font-semibold text-slate-100">{oinfo.auth}</div>
        </div>
      </div>
      <div className="bg-slate-900 rounded-2xl border border-slate-700 overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-slate-800 text-slate-300 text-xs uppercase tracking-wider">
            <th className="text-left p-3">Domain</th>
            <th className="text-center p-3">Inherent</th>
            <th className="text-center p-3">Control</th>
            <th className="text-center p-3">Residual</th>
            <th className="text-center p-3">Coverage</th>
          </tr></thead>
          <tbody>
            {rows.map((r,i)=>(
              <tr key={i} className="border-t border-slate-800">
                <td className="p-3 text-slate-200 font-medium">{r.domain}</td>
                <td className="text-center p-3"><span className="font-bold mono" style={{color:invColor(r.inh)}}>{r.inh||'\u2014'}</span></td>
                <td className="text-center p-3"><span className="font-bold mono" style={{color:invColor(r.ctrl)}}>{r.ctrl||'\u2014'}</span></td>
                <td className="text-center p-3"><span className="px-2 py-0.5 rounded-full text-xs font-bold mono" style={{color:RES_INFO[r.res].color,background:RES_INFO[r.res].color+'1f',border:'1px solid '+RES_INFO[r.res].color+'55'}}>{r.res? r.res+' \u00B7 '+RES_INFO[r.res].label : '\u2014'}</span></td>
                <td className="text-center p-3 text-slate-500 mono text-xs">{r.cov}/{r.tot}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-[10px] text-slate-600 italic">Residual matrix and rating labels per the CRA TPRM methodology. Vendor criticality tier is assigned during vendor profiling and is not derived from these scores.</p>
    </div>
  );
}

function PagePortfolio(){
  var pf=PORTFOLIO_DATA.pf, fw=PORTFOLIO_DATA.fw;
  var entMat=0, entRisk=0;
  try{var ifw=JSON.parse(localStorage.getItem('tprm_fw_inst')||'null');var ians=JSON.parse(localStorage.getItem('tprm_ans_inst')||'{}');if(ifw&&ifw.data){var iv=[];ifw.data.forEach(function(pp){pp.subs.forEach(function(sd){sd.comps.forEach(function(c){if(ians[c.id]>0)iv.push(ians[c.id]);});});});if(iv.length){entMat=parseFloat((iv.reduce(function(a,b){return a+b;},0)/iv.length).toFixed(2));entRisk=parseFloat((6-entMat).toFixed(2));}}}catch(e){}
  function branchTotal(res){if(!res)return 0;if(!entRisk)return res;return Math.round(res*BRANCH_WEIGHTS.provider+entRisk*BRANCH_WEIGHTS.entity);}
  var provs=(pf.providers||[]).map(function(pv){
    var ans={}; try{ans=JSON.parse(localStorage.getItem('tprm_ans_'+pv.id)||'{}');}catch(e){}
    var r=computeProviderRisk(fw,ans);
    return Object.assign({},pv,r,{answered:Object.keys(ans).length});
  });
  var assessed=provs.filter(function(p){return p.coverage>0;});
  var critCount=assessed.filter(function(p){return p.overallMax>=4;}).length;
  var avgIdx=assessed.length?parseFloat((assessed.reduce(function(a,p){return a+p.weightedIndex;},0)/assessed.length).toFixed(2)):0;
  var domNames=fw.data.slice(1).map(function(cp){return cp.name.replace(/^Control Effectiveness\s*[—-]\s*/,'');});
  var domAvgs=domNames.map(function(nm,i){
    var vals=assessed.map(function(p){return p.domains[i]&&p.domains[i].res;}).filter(function(v){return v>0;});
    return {name:nm,avg:vals.length?parseFloat((vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(2)):0,count:vals.length};
  });
  var worstDomain=domAvgs.reduce(function(m,d){return d.avg>((m&&m.avg)||0)?d:m;},null);
  var worstCell=null;
  assessed.forEach(function(p){p.domains.forEach(function(d){if(d.res>=4&&(!worstCell||d.res>worstCell.res))worstCell={prov:p.name,domain:d.name,res:d.res};});});
  var sorted=assessed.slice().sort(function(a,b){return b.overallMax-a.overallMax||b.weightedIndex-a.weightedIndex;});
  // scatter geom
  var W=620,H=400,mL=54,mR=20,mT=20,mB=46;
  var px=function(v){return mL+((v-1)/4)*(W-mL-mR);};
  var py=function(v){return mT+(1-((v-1)/4))*(H-mT-mB);};
  return (

        <div className="text-2xl text-slate-600">→</div>
        <div className="text-center"><div className="text-4xl font-extrabold mono" style={{color:RES_INFO[Math.round(entRisk)||1].color}}>{entRisk}</div><div className="text-[10px] text-slate-400 uppercase tracking-wide mt-1">Entity Risk (6−maturity)</div></div>
        <div className="flex-1 min-w-[220px] text-xs text-slate-400 leading-relaxed">The institution program's maturity is converted to a risk counterpart. Each branch total below combines this with the provider's residual, weighted {Math.round(BRANCH_WEIGHTS.provider*100)}% provider / {Math.round(BRANCH_WEIGHTS.entity*100)}% entity (editable in BRANCH_WEIGHTS).</div>

        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-4 text-center"><div className="text-3xl font-extrabold mono" style={{color:critCount>0?'#ef4444':'#22c55e'}}>{critCount}</div><div className="text-[11px] text-slate-400 uppercase tracking-wide mt-1">High / Critical</div></div>
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-4 text-center"><div className="text-3xl font-extrabold text-white mono">{avgIdx||'—'}</div><div className="text-[11px] text-slate-400 uppercase tracking-wide mt-1">Avg Weighted Idx</div></div>
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-4 text-center"><div className="text-sm font-bold text-white leading-tight mt-1">{worstDomain?worstDomain.name:'—'}</div><div className="text-[11px] text-slate-400 uppercase tracking-wide mt-1">Weakest Domain</div></div>
      </div>
      {worstCell && <div className="rounded-xl border p-4" style={{background:RES_INFO[worstCell.res].color+'14',borderColor:RES_INFO[worstCell.res].color+'55'}}><span className="text-xs uppercase tracking-wide font-bold" style={{color:RES_INFO[worstCell.res].color}}>Worst cell · </span><span className="text-sm text-slate-200"><b>{worstCell.prov}</b> — {worstCell.domain} at residual {worstCell.res} ({RES_INFO[worstCell.res].label})</span></div>}
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-4">
          <h3 className="text-sm font-bold text-white mb-1">Criticality vs. Residual Risk</h3>
          <p className="text-[11px] text-slate-500 mb-2">X: inherent criticality · Y: residual (max). Top-right = highest priority.</p>
          <svg viewBox={`0 0 ${W} ${H}`} width="100%">
            <line x1={mL} y1={py(3)} x2={W-mR} y2={py(3)} stroke="#334155" strokeDasharray="4 4"/>
            <line x1={px(3)} y1={mT} x2={px(3)} y2={H-mB} stroke="#334155" strokeDasharray="4 4"/>
            <line x1={mL} y1={mT} x2={mL} y2={H-mB} stroke="#475569"/>

            {[1,2,3,4,5].map(function(t){return (<text key={'x'+t} x={px(t)} y={H-mB+16} textAnchor="middle" fontSize="9" fill="#64748b">{t}</text>);})}
            {[1,2,3,4,5].map(function(t){return (<text key={'y'+t} x={mL-8} y={py(t)+3} textAnchor="end" fontSize="9" fill="#64748b">{t}</text>);})}
            <text x={(mL+W-mR)/2} y={H-6} textAnchor="middle" fontSize="10" fill="#94a3b8">Inherent Criticality →</text>
            <text x={16} y={(H)/2} textAnchor="middle" fontSize="10" fill="#94a3b8" transform={`rotate(-90 16 ${H/2})`}>Residual (max) →</text>
            {sorted.map(function(p,i){var col=RES_INFO[p.overallMax||0].color;var jx=((i%3)-1)*7;return (<g key={p.id}><circle cx={px(p.inhAvg||1)+jx} cy={py(p.overallMax||1)} r="9" fill={col+'cc'} stroke={col} strokeWidth="1.5"><title>{p.name+' · inherent '+p.inhAvg+' · residual '+p.overallMax}</title></circle></g>);})}
          </svg>
        </div>
        <div className="bg-slate-900 rounded-2xl border border-slate-700 p-4">
          <h3 className="text-sm font-bold text-white mb-3">Portfolio Domain Averages</h3>
          <div className="space-y-2">
            {domAvgs.map(function(d,i){var col=d.avg>=4?'#ef4444':d.avg>=3?'#f59e0b':d.avg>=2?'#84cc16':d.avg>=1?'#22c55e':'#475569';return (<div key={i} className="flex items-center gap-2"><span className="text-[11px] text-slate-300 w-40 truncate">{d.name}</span><div className="flex-1 bg-slate-800 rounded-full h-2.5 overflow-hidden"><div className="h-full rounded-full bar-fill" style={{width:((d.avg/5)*100)+'%',background:col}}/></div><span className="text-[11px] mono w-8 text-right" style={{color:col}}>{d.avg||'—'}</span></div>);})}

      </div>
      <div className="bg-slate-900 rounded-2xl border border-slate-700 overflow-hidden">
        <table className="w-full text-sm">
          <thead><tr className="bg-slate-800 text-slate-300 text-xs uppercase tracking-wider">
            <th className="text-left p-3">Provider</th>
            <th className="text-center p-3">Inherent</th>
            <th className="text-center p-3">Residual (official)</th>
            <th className="text-center p-3">Weighted idx</th>
            <th className="text-center p-3">Branch total</th>
            <th className="text-left p-3">Weakest domain</th>
            <th className="text-center p-3">Coverage</th>

          <tbody>
            {sorted.map(function(p){return (<tr key={p.id} className="border-t border-slate-800">
              <td className="p-3 text-slate-200 font-medium">{p.name}</td>
              <td className="text-center p-3 mono text-slate-300">{p.inhAvg||'—'}</td>
              <td className="text-center p-3"><span className="px-2 py-0.5 rounded-full text-xs font-bold mono" style={{color:RES_INFO[p.overallMax].color,background:RES_INFO[p.overallMax].color+'1f',border:'1px solid '+RES_INFO[p.overallMax].color+'55'}}>{p.overallMax?p.overallMax+' · '+RES_INFO[p.overallMax].label:'—'}</span></td>
              <td className="text-center p-3 mono text-slate-400">{p.weightedIndex||'—'}</td>
              <td className="text-center p-3">{(function(){var bt=branchTotal(p.overallMax);return bt?(<span className="px-2 py-0.5 rounded-full text-xs font-bold mono" style={{color:RES_INFO[bt].color,background:RES_INFO[bt].color+'1f',border:'1px solid '+RES_INFO[bt].color+'55'}}>{bt+' · '+RES_INFO[bt].label}</span>):(<span className="text-slate-600">—</span>);})()}</td>
              <td className="p-3 text-slate-400 text-xs">{p.weakest?p.weakest.name+' ('+p.weakest.res+')':'—'}</td>
              <td className="text-center p-3 mono text-slate-500 text-xs">{p.coverage}/{domNames.length}</td>
            </tr>);})}
            {assessed.length===0 && <tr><td colSpan="7" className="p-6 text-center text-slate-500">No providers assessed yet. Assess providers from the Portfolio screen.</td></tr>}
          </tbody>
        </table>
      </div>
      <p className="text-[10px] text-slate-600 italic">Official residual = worst domain (weakest link), per CRA methodology. Weighted index uses domain weights (Cyber/AI 1.2, Privacy/Resilience 1.1, Financial/Concentration 0.9, Reputational 0.8) — editable in DOMAIN_WEIGHTS. Weights are a judgment default and should be validated before use with a client.</p>
    </div>
  );
}

function PageMaturityScale({ data, core }) {
  const P = data ? data.length : 0;
  let S = 0, C = 0;
  if (data) data.forEach(p => { S += p.subs.length; p.subs.forEach(s => C += s.comps.length); });
  const coreCount = core ? core.size : 0;
  return (
    <div className="animate-fade space-y-6">
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <h3 className="font-bold text-white text-xl mb-2">Maturity Scale</h3>
        <p className="text-slate-400 text-sm max-w-2xl mb-6">
          {FMETA.assessmentName} uses a 5-tier evaluation framework measuring maturity across {P} pillars, {S} sub-dimensions, and {C} components.
        </p>
        <div className="space-y-4">
          {MATURITY_LEVELS.map(m => (
            <div key={m.level} className="p-5 rounded-xl border flex flex-col md:flex-row gap-4 items-start md:items-center"
              style={{background: m.bg, borderColor: m.color+'44'}}>
              <div className="flex items-center gap-4 md:w-56 shrink-0">
                <span className="text-3xl font-extrabold mono" style={{color: m.color}}>L{m.level}</span>
                <div className="h-8 w-px bg-slate-600 hidden md:block"/>
                <h4 className="font-bold text-white text-base">{m.name}</h4>
              </div>
              <p className="text-slate-300 text-sm leading-relaxed flex-1">{m.desc}</p>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6">
        <div className="flex items-center gap-2 text-emerald-400 mb-2">
          <span className="text-lg">ℹ</span>
          <span className="font-bold text-xs uppercase tracking-wider">Methodology Note</span>
        </div>
        <h4 className="font-bold text-lg text-white mb-2">How Scores Are Calculated</h4>
        <p className="text-slate-400 text-sm leading-relaxed">
          Each component is evaluated on a 1–5 scale by the respondent. Sub-dimension scores are
          the arithmetic mean of their components. Pillar scores average across all evaluated
          sub-dimensions. The global score is the mean of pillar scores with at least one answer.
          CORE components ({coreCount} of {C}) represent the most critical capabilities of the framework.
        </p>
      </div>
    </div>
  );
}

function PageGaps({ data, answers, core }) {
  const [expanded, setExpanded] = useState({});
  const gaps = useMemo(() => {
    const g = [];
    if (!data) return g;
    data.forEach(p => p.subs.forEach(s => s.comps.forEach(c => {
      if (answers[c.id] && answers[c.id] <= 2) {
        g.push({ comp: c, score: answers[c.id], pillar: p, sub: s, isCore: core.has(c.id) });
      }
    })));
    return g.sort((a,b) => a.score - b.score || a.comp.id.localeCompare(b.comp.id));
  }, [data, answers, core]);

  const toggle = id => setExpanded(e => ({...e, [id]: !e[id]}));

  if (gaps.length === 0) {
    return (
      <div className="animate-fade flex items-center justify-center h-64">
        <div className="text-center">
          <div className="text-5xl mb-4">✅</div>
          <h3 className="text-white font-bold text-xl">No Critical Gaps Found</h3>
          <p className="text-slate-400 text-sm mt-2">All answered components are at Level 3 or above.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="animate-fade space-y-4">
      <div className="bg-slate-900 rounded-2xl border border-red-900/40 p-6">
        <div className="flex items-center gap-3 mb-2">
          <span className="text-2xl">⚠</span>
          <h3 className="font-bold text-white text-xl">Critical Gaps — Level 1–2</h3>
        </div>
        <p className="text-slate-400 text-sm mb-6">
          {gaps.length} component{gaps.length > 1 ? 's' : ''} at critical maturity.
          Expand each to see current state vs. target Level 4 and optimal Level 5.
        </p>
        <div className="space-y-3">
          {gaps.map(g => {
            const gCol = g.score === 1 ? '#ef4444' : '#f97316';
            const isOpen = expanded[g.comp.id];
            const curDesc = g.comp.L[g.score-1] || '(No descriptor available)';
            const tarDesc = g.comp.L[3] || '(No descriptor available)';
            const optDesc = g.comp.L[4] || '(No descriptor available)';
            return (
              <div key={g.comp.id} className="rounded-xl overflow-hidden border"
                style={{borderColor: gCol+'55', borderLeftWidth:'4px'}}>
                <div className="flex items-center gap-3 p-4 cursor-pointer hover:bg-slate-800/50 transition"
                  onClick={() => toggle(g.comp.id)}>
                  <div className="w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-extrabold mono shrink-0"
                    style={{color: gCol, borderColor: gCol+'66', background: gCol+'12'}}>
                    L{g.score}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-white truncate">{g.comp.id} · {g.comp.name}</div>
                    <div className="text-xs mono text-slate-500 mt-0.5">{g.pillar.id}: {g.pillar.name} › {g.sub.id}</div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {g.isCore && (
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded"
                        style={{background:'rgba(13,148,136,0.15)', color:'#0d9488'}}>🔷 CORE</span>
                    )}
                    <span className="text-slate-500 text-lg transition-transform duration-200"
                      style={{transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}}>▾</span>
                  </div>
                </div>
                {isOpen && (
                  <div className="px-4 pb-4 bg-slate-950/40 border-t border-slate-700">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
                      <div className="rounded-lg p-3 border" style={{borderColor: gCol+'44', background: gCol+'08'}}>
                        <div className="text-[10px] font-extrabold uppercase tracking-wider mb-2" style={{color: gCol}}>
                          📍 Current — Level {g.score}
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{curDesc}</p>
                      </div>
                      <div className="rounded-lg p-3 border border-blue-500/30 bg-blue-500/06">
                        <div className="text-[10px] font-extrabold text-blue-400 uppercase tracking-wider mb-2">
                          🎯 Target — Level 4
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{tarDesc}</p>
                      </div>
                      <div className="rounded-lg p-3 border border-emerald-500/30 bg-emerald-500/06">
                        <div className="text-[10px] font-extrabold text-emerald-400 uppercase tracking-wider mb-2">
                          🏆 Optimized — Level 5
                        </div>
                        <p className="text-xs text-slate-300 leading-relaxed">{optDesc}</p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PageRoadmap({ data, answers, scores }) {
  const { pillarScores } = scores;
  // Build roadmap: pillars sorted by score asc (worst first)
  const pillarsRanked = useMemo(() => {
    if (!data) return [];
    return [...data]
      .map(p => ({ ...p, score: pillarScores[p.id] || 0 }))
      .filter(p => p.score > 0)
      .sort((a,b) => a.score - b.score);
  }, [data, pillarScores]);

  const priorityLabel = score => {
    if (score < 2) return { label:'Immediate Priority', color:'#ef4444', bg:'rgba(239,68,68,0.12)' };
    if (score < 3) return { label:'Short-Term (3–6 months)', color:'#f97316', bg:'rgba(249,115,22,0.12)' };
    if (score < 3.5) return { label:'Medium-Term (6–12 months)', color:'#f59e0b', bg:'rgba(245,158,11,0.12)' };
    return { label:'Continuous Improvement', color:'#3b82f6', bg:'rgba(59,130,246,0.12)' };
  };

  // Find worst 3 comps per pillar
  function worstComps(p, n=3) {
    const comps = [];
    p.subs.forEach(s => s.comps.forEach(c => {
      if (answers[c.id]) comps.push({ ...c, score: answers[c.id], sub: s.name });
    }));
    return comps.sort((a,b) => a.score - b.score).slice(0, n);
  }

  return (
    <div className="animate-fade space-y-6">
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <h3 className="font-bold text-white text-xl mb-1">Actionable Roadmap</h3>
        <p className="text-slate-400 text-sm mb-6">
          Pillars ranked from lowest to highest maturity. Focus investment on the top sections first.
        </p>
        {pillarsRanked.length === 0 && (
          <p className="text-slate-500 text-center py-12">Complete the assessment to generate a roadmap.</p>
        )}
        {pillarsRanked.map((p, idx) => {
          const pi = data.findIndex(d => d.id === p.id);
          const pColor = PILAR_COLORS[pi % PILAR_COLORS.length];
          const priority = priorityLabel(p.score);
          const worst = worstComps(p);
          return (
            <div key={p.id} className="mb-6 last:mb-0 rounded-xl border border-slate-700 overflow-hidden">
              <div className="flex items-center gap-3 p-4 bg-slate-800/50">
                <span className="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-xs font-extrabold mono text-slate-300">
                  {idx+1}
                </span>
                <div className="w-9 h-9 rounded-lg flex items-center justify-center font-extrabold mono text-sm"
                  style={{background: pColor+'18', color: pColor, border:`2px solid ${pColor}44`}}>
                  {p.id.replace('P','')}
                </div>
                <div className="flex-1">
                  <div className="font-bold text-white">{p.name}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded"
                      style={{color: priority.color, background: priority.bg}}>
                      {priority.label}
                    </span>
                  </div>
                </div>
                <div className="text-2xl font-extrabold mono" style={{color: scoreColor(p.score)}}>
                  {p.score.toFixed(1)}
                </div>
              </div>
              {worst.length > 0 && (
                <div className="p-4 space-y-2 bg-slate-900/60">
                  <div className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500 mb-3">
                    Top components to address:
                  </div>
                  {worst.map(c => (
                    <div key={c.id} className="flex items-start gap-3 py-2 border-b border-slate-800 last:border-0">
                      <span className="text-[10px] font-extrabold mono px-1.5 py-0.5 rounded mt-0.5 shrink-0"
                        style={{color: scoreColor(c.score), background: scoreBg(c.score)}}>
                        L{c.score}
                      </span>
                      <div className="flex-1">
                        <div className="text-xs font-semibold text-slate-200">{c.id} · {c.name}</div>
                        <div className="text-[10px] text-slate-500 mono mt-0.5">{c.sub}</div>
                        {c.L[3] && (
                          <div className="mt-1.5 p-2 rounded bg-blue-500/06 border border-blue-500/20">
                            <div className="text-[9px] font-bold text-blue-400 uppercase tracking-wider mb-1">Target Level 4:</div>
                            <p className="text-[10px] text-slate-400 leading-relaxed line-clamp-2">{c.L[3]}</p>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PagePillarDetail({ pillar, answers, scores, core, onBack }) {
  const pi = parseInt(pillar.id.replace('P',''));
  const pColor = PILAR_COLORS[pi % PILAR_COLORS.length];
  const pScore = scores.pillarScores[pillar.id] || 0;
  return (
    <div className="animate-fade space-y-4">
      <button onClick={onBack} className="flex items-center gap-2 text-sm text-slate-400 hover:text-white transition mb-2">
        ← Back to Overview
      </button>
      <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6">
        <div className="flex items-center gap-4 mb-2">
          <div className="w-12 h-12 rounded-xl flex items-center justify-center font-extrabold mono text-lg"
            style={{background: pColor+'18', color: pColor, border:`2px solid ${pColor}44`}}>
            {pillar.id.replace('P','')}

          <div>
            <h3 className="font-bold text-white text-xl">{pillar.name}</h3>
            {pillar.desc && <p className="text-slate-400 text-xs mt-0.5">{pillar.desc}</p>}

                <span className="text-xs mono text-slate-500">{s.id}</span>

              <ScoreChip val={sAvg}/>

            <div className="divide-y divide-slate-800">

                return (
                  <div key={c.id} className="p-4">
                    <div className="flex items-start gap-3">
                      <div className="w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-extrabold mono shrink-0 mt-0.5"

                        {ans || '—'}
                      </div>
                      <div className="flex-1">

                          <span className="text-xs mono text-slate-500">{c.id}</span>
                          <span className="text-sm font-semibold text-slate-200">{c.name}</span>

                            style={{background:'rgba(13,148,136,0.15)', color:'#0d9488'}}>CORE</span>}
                        </div>
                        {ans && c.L[ans-1] && (
                          <div className="mt-2 p-2.5 rounded-lg text-xs text-slate-400 leading-relaxed"
                            style={{background: scoreBg(ans), borderLeft:`3px solid ${cColor}`}}>
                            <span className="font-bold" style={{color: cColor}}>L{ans} ({['Non-Existent','Reactive','Defined','Managed','Optimized'][ans-1]}): </span>
                            {c.L[ans-1]}
                          </div>
                        )}
                        {!ans && <p className="text-xs text-slate-600 mt-1">Not evaluated</p>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────
function App() {
  const [page, setPage] = useState((function(){try{if(localStorage.getItem('tprm_open_portfolio')==='1'){localStorage.removeItem('tprm_open_portfolio');return 'portfolio';}}catch(e){}return IS_SCORECARD?'vendorrisk':'overview';})());
  const [drillPillar, setDrillPillar] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const { data, answers, core, reg } = useMemo(() => loadFCMAData(), []);
  const scores = useMemo(() => computeScores(data, answers), [data, answers]);

  const handleDrillPillar = (p) => { setDrillPillar(p); setPage('pillar'); };
  const handleBack = () => { setDrillPillar(null); setPage('overview'); };

  const maturity = getMaturity(scores.globalScore);

  const NAV = [
    { id:'overview',    label:'Executive Overview',      icon:'📊' },
    { id:'heatmap',     label:'Pillars Heatmap',         icon:'🗂' },
    { id:'maturity',    label:'Maturity Scale',          icon:'📐' },
    { id:'gaps',        label:'Critical Gaps',           icon:'⚠',
      badge: data ? (() => { let n=0; data.forEach(p=>p.subs.forEach(s=>s.comps.forEach(c=>{ if(answers[c.id]&&answers[c.id]<=2)n++; }))); return n; })() : 0 },
    { id:'roadmap',     label:'Actionable Roadmap',      icon:'🗺' },
    { id:'threats',     label:'Threat Exposure',         icon:'🎯' },
    { id:'initiatives', label:'Initiatives (Effort×Benefit)', icon:'🧭' },
    { id:'vendorrisk',  label:'Vendor Risk (Residual)',   icon:'🧮' },
    { id:'portfolio',   label:'Portfolio Roll-up',        icon:'🗂' },
  ];

  if (!data) {
    return (
      <div className="min-h-screen bg-slate-950 flex items-center justify-center">
        <div className="text-center max-w-md p-8">
          <div className="text-6xl mb-6">🗺️</div>
          <h1 className="text-white text-2xl font-extrabold mb-3">No Assessment Data Found</h1>
          <p className="text-slate-400 text-sm leading-relaxed mb-6">
            Complete the FCMA Assessment first, then open this report.
            Data is loaded from your browser's localStorage.
          </p>
          <button onClick={() => window.close()}
            className="bg-teal-600 hover:bg-teal-500 text-white font-bold px-6 py-3 rounded-xl transition">
            Close Report
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
      {/* Watermark */}
      <div className="watermark-bg no-print" aria-hidden="true">
        {Array(16).fill('FCMA™ · CONFIDENTIAL').map((t,i) => <span key={i}>{t}</span>)}
      </div>

      {/* Header */}
      <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div className="max-w-[1800px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <button onClick={() => setSidebarOpen(!sidebarOpen)}
              className="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white transition no-print">
              ☰
            </button>
            <div className="w-9 h-9 rounded-lg flex items-center justify-center font-extrabold text-white"
              style={{background:'linear-gradient(135deg,#0d9488,#14b8a6)'}}>{TOOL.name.trim()[0]}</div>
            <div>
              <div className="text-sm font-extrabold tracking-tight">{TOOL.name} · Executive Report</div>
              <div className="text-[10px] text-slate-400 uppercase tracking-wider">{FMETA.assessmentName}</div>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <div className="hidden md:block text-right">
              <div className="text-sm font-bold text-white">{reg && reg.company ? reg.company : 'Demo Company'}</div>
              <div className="text-xs text-slate-400">Assessment · {new Date(reg && reg.ts ? reg.ts : Date.now()).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
            </div>
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg border"
              style={{color: maturity.color, background: maturity.bg, borderColor: maturity.color+'44'}}>
              <span className="text-sm font-extrabold mono">{scores.globalScore > 0 ? scores.globalScore.toFixed(1) : '—'}</span>
              <span className="text-xs font-bold hidden sm:block">{maturity.name}</span>
            </div>
            <button
              onClick={() => {
                const d = {
                  version:'2.0', data,
                  answers, core:[...core],
                  registration: reg,
                  globalScore: scores.globalScore,
                  pillarScores: scores.pillarScores,
                  exportedAt: new Date().toISOString()
                };
                const b = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = `${(FMETA.frameworkShort||'Report').replace(/[^A-Za-z0-9]+/g,'')}_Report_${reg?.company?.replace(/\s+/g,'_')||'Assessment'}_${new Date().toISOString().slice(0,10)}.json`;
                a.click(); URL.revokeObjectURL(a.href);
              }}
              className="no-print flex items-center gap-2 bg-teal-700 hover:bg-teal-600 text-white font-bold text-xs px-3 py-2 rounded-lg transition">
              💾 Export
            </button>
          </div>
        </div>
      </header>

      <div className="flex flex-1 max-w-[1800px] mx-auto w-full">
        {/* Sidebar */}
        {sidebarOpen && (
          <aside className="no-print w-56 shrink-0 sticky top-[57px] h-[calc(100vh-57px)] bg-slate-900 border-r border-slate-800 flex flex-col py-4 overflow-y-auto">
            <div className="px-3 space-y-1">
              <a href="index.html" className="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 mb-3 rounded-xl text-xs font-bold transition text-left bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-500/20" style={{textDecoration:'none'}}>
                <span>←</span>
                <span className="flex-1">Back to Assessment</span>
              </a>
              {NAV.filter(n => (n.id!=='vendorrisk' || IS_SCORECARD) && (n.id!=='portfolio' || IS_PORTFOLIO)).map(n => {
                const isActive = page === n.id || (n.id === 'overview' && page === 'pillar');
                return (
                  <button key={n.id}
                    onClick={() => { setPage(n.id); setDrillPillar(null); }}
                    className={`sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-left ${
                      isActive ? 'active bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                    }`}>
                    <span>{n.icon}</span>
                    <span className="flex-1">{n.label}</span>
                    {n.badge > 0 && (
                      <span className="px-1.5 py-0.5 text-[9px] font-extrabold bg-red-500/20 border border-red-500/30 text-red-400 rounded">
                        {n.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
            <div className="mt-auto px-3 pt-4 border-t border-slate-800">
              <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700 text-center">
                <div className="text-[9px] text-slate-500 uppercase tracking-wider font-bold mb-1">Framework</div>
                <div className="text-xs font-bold text-teal-400">{FMETA.frameworkShort}</div>
                {FMETA.version && <div className="text-[10px] text-slate-500 mt-0.5">Assessment v{FMETA.version}</div>}
                <div className="text-[10px] text-slate-400 mt-1.5 pt-1.5 border-t border-slate-700/60">{TOOL.name} v{TOOL.version}</div>
                <div className="text-[9px] text-slate-600 mt-1">© {FMETA.org}</div>
              </div>
            </div>
          </aside>
        )}

        {/* Main content */}
        <main className="flex-1 min-w-0 overflow-y-auto px-6 lg:px-10 py-6">
          {page === 'overview' && !drillPillar && (
            <PageOverview data={data} answers={answers} scores={scores}
              reg={reg} core={core} onDrillPillar={handleDrillPillar}/>
          )}
          {page === 'pillar' && drillPillar && (
            <PagePillarDetail pillar={drillPillar} answers={answers}
              scores={scores} core={core} onBack={handleBack}/>
          )}
          {page === 'heatmap' && (
            <PageHeatmap data={data} answers={answers} scores={scores}/>
          )}
          {page === 'maturity' && <PageMaturityScale data={data} core={core}/>}
          {page === 'gaps' && <PageGaps data={data} answers={answers} core={core}/>}
          {page === 'roadmap' && <PageRoadmap data={data} answers={answers} scores={scores}/>}
          {page === 'threats' && <PageThreats answers={answers}/>}
          {page === 'initiatives' && <PageInitiatives data={data} answers={answers} core={core}/>}
          {page === 'vendorrisk' && <PageVendorRisk data={data} answers={answers}/>}
          {page === 'portfolio' && <PagePortfolio/>}
        </main>
      </div>

      {/* Footer */}
      <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-[10px] text-slate-600">
        © {new Date().getFullYear()} {FMETA.org} — All rights reserved. {FMETA.framework} framework is the exclusive intellectual property of the author. Reproduction, distribution, or use without written authorization is prohibited.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
